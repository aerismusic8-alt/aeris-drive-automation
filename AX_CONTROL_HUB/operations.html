<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX Web Chat</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:16px}.panel{background:white;border:1px solid #d9dee7;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1{margin:0 0 4px;font-size:1.5rem}.muted{color:#667085;font-size:.9rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea,button{font:inherit;padding:10px;border:1px solid #c9d0db;border-radius:9px}input{min-width:0}button{cursor:pointer;background:#fff}textarea{width:100%;min-height:130px;resize:vertical}.grow{flex:1}.chat{min-height:160px;white-space:pre-wrap;overflow-wrap:anywhere;background:#101828;color:#f8fafc;border-radius:10px;padding:14px}.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.status div{padding:10px;border:1px solid #e2e8f0;border-radius:9px}.hidden{display:none}
@media(max-width:600px){.app{padding:10px}.status{grid-template-columns:1fr}.row>*{width:100%}button{width:auto}}
</style>
</head>
<body>
<main class="app">
<section class="panel">
<h1>AX Web Chat</h1><div class="muted">Independent client • authoritative state: A_MASTER_BRAIN</div>
<div id="authForm" class="row" style="margin-top:12px"><input id="username" class="grow" autocomplete="username" placeholder="Username"><input id="password" class="grow" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Login</button></div>
<div id="controls" class="row hidden" style="margin-top:12px"><button id="refresh">Refresh Context</button><button id="check">M-A-CHECK</button><button id="logout">Logout</button></div>
<div class="status" style="margin-top:12px"><div><b>Session</b><br><span id="session">NOT_AUTHENTICATED</span></div><div><b>Identity</b><br><span id="identity">—</span></div><div><b>Rehydration</b><br><span id="rehydration">—</span></div></div>
<pre id="context" class="muted"></pre>
</section>
<section id="chatPanel" class="panel hidden">
<div id="messages" class="chat">AX Web Chat ready.</div>
<textarea id="message" placeholder="ส่งข้อความถึง AX"></textarea>
<div class="row"><input id="file" type="file" multiple class="grow"><button id="send">Send</button></div>
<pre id="result" class="muted"></pre>
</section>
</main>
<script src="operations_client.js"></script>
</body>
</html>
