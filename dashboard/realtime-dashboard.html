<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AX Realtime Dashboard</title><style>body{font-family:system-ui;margin:20px;line-height:1.4}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.ok{font-weight:700}.muted{opacity:.7}code{font-size:.9em}</style></head><body><h1>AX Realtime Dashboard</h1><p id="updated" class="muted">Loading…</p><section id="summary"></section><table><thead><tr><th>Workflow</th><th>Status</th><th>Conclusion</th><th>Updated</th><th>Run</th></tr></thead><tbody id="runs"></tbody></table><script>
const API='https://api.github.com/repos/aerismusic8-alt/aeris-drive-automation/actions/runs?per_page=30';
async function refresh(){try{const r=await fetch(API,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const runs=d.workflow_runs||[];const active=runs.filter(x=>x.status!=='completed').length;const passed=runs.filter(x=>x.conclusion==='success').length;const failed=runs.filter(x=>x.conclusion==='failure').length;document.querySelector('#summary').innerHTML=`<b>Active:</b> ${active} &nbsp; <b>Passed:</b> ${passed} &nbsp; <b>Failed:</b> ${failed} &nbsp; <b>Total:</b> ${runs.length}`;document.querySelector('#runs').innerHTML=runs.map(x=>`<tr><td>${x.name}</td><td>${x.status}</td><td class="${x.conclusion==='success'?'ok':''}">${x.conclusion||'—'}</td><td>${new Date(x.updated_at).toLocaleString()}</td><td><a href="${x.html_url}" target="_blank">#${x.run_number}</a></td></tr>`).join('');document.querySelector('#updated').textContent='Last refresh: '+new Date().toLocaleString()}catch(e){document.querySelector('#updated').textContent='Dashboard error: '+e.message}}refresh();setInterval(refresh,10000);
</script></body></html>
