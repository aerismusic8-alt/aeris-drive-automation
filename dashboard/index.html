<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX Executive Dashboard</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#0b1020;color:#eef2ff}main{max-width:1280px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#151c33;border:1px solid #293354;border-radius:12px;padding:14px}.value{font-size:1.12rem;font-weight:700;margin-top:6px}.ok{color:#63e6be}.warn{color:#ffd166}.bad{color:#ff7b7b}.muted{color:#aeb8d4}pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;line-height:1.4}h1{margin:0 0 3px}button{padding:8px 12px;border-radius:8px;border:1px solid #44517a;background:#202a49;color:#fff;cursor:pointer}.progress{height:9px;background:#252d48;border-radius:8px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0%;background:#63e6be;transition:width .25s}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.badge{padding:5px 9px;border-radius:999px;background:#202a49}.section{margin-top:10px}
</style>
</head>
<body><main>
<div class="hero"><div><h1>AX Executive Dashboard</h1><div class="muted">Real-time Executive Cycle / Runner / Persistence Monitor</div></div><div><span id="feed" class="badge">LOADING</span> <button onclick="load()">Refresh</button></div></div>
<div class="grid">
<div class="card"><small>System</small><div id="system" class="value">—</div></div>
<div class="card"><small>Overall</small><div id="overall" class="value">—</div></div>
<div class="card"><small>Runner</small><div id="runner" class="value">—</div></div>
<div class="card"><small>Cycle</small><div id="cycle" class="value">—</div></div>
<div class="card"><small>Selected Task</small><div id="job" class="value">—</div></div>
<div class="card"><small>Last Update</small><div id="updated" class="value">—</div></div>
</div>
<div class="card section"><div style="display:flex;justify-content:space-between"><b>EXECUTIVE PIPELINE</b><span id="pipeline">—</span></div><div class="progress"><div id="bar" class="bar"></div></div></div>
<div class="grid section">
<div class="card"><small>Recovery</small><div id="recovery" class="value">—</div></div>
<div class="card"><small>Decision</small><div id="decision" class="value">—</div></div>
<div class="card"><small>Dispatch</small><div id="dispatch" class="value">—</div></div>
<div class="card"><small>Persistence</small><div id="persistence" class="value">—</div></div>
<div class="card"><small>Mutation</small><div id="mutation" class="value">—</div></div>
</div>
<div class="card section"><small>LIVE EVIDENCE</small><pre id="evidence">Loading…</pre></div>
</main>
<script>
const POLL_MS=2000,STALE_MS=10000;
const $=id=>document.getElementById(id);
function cls(v){let s=String(v||'').toUpperCase();return ['ONLINE','VERIFIED','PASS','COMPLETED','RUNNING','ENABLED'].includes(s)?'ok':['PENDING','QUEUED','WAITING_K','STALE','UNKNOWN'].includes(s)?'warn':'bad'}
function put(id,v){$(id).textContent=v??'—';$(id).className='value '+cls(v)}
function age(ms){if(!Number.isFinite(ms))return'UNKNOWN';if(ms<1000)return'just now';return Math.round(ms/100)/10+'s ago'}
async function load(){try{let r=await fetch('status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let s=await r.json(),t=s.timestamp?Date.parse(s.timestamp):0,a=t?Date.now()-t:Infinity,live=a<=STALE_MS;let stages=[s.recovery,s.decision,s.dispatch,s.persistence],done=stages.filter(x=>['PASS','VERIFIED','COMPLETED'].includes(String(x).toUpperCase())).length,p=Math.round(done/stages.length*100);put('system',s.system);put('overall',s.overall);put('runner',s.runner);put('cycle',s.cycle||'—');put('job',s.selectedTask||s.taskId||'NONE');put('updated',age(a));put('recovery',s.recovery);put('decision',s.decision);put('dispatch',s.dispatch);put('persistence',s.persistence);put('mutation',s.mutation);$('feed').textContent=live?'LIVE':'STALE';$('feed').className='badge '+(live?'ok':'warn');$('pipeline').textContent=p+'%';$('bar').style.width=p+'%';$('evidence').textContent=JSON.stringify({source:'dashboard/status.json',polledAt:new Date().toISOString(),sourceTimestamp:s.timestamp||null,sourceAgeMs:Number.isFinite(a)?a:null,feed:live?'LIVE':'STALE',pipelineProgress:p,raw:s},null,2)}catch(e){$('feed').textContent='OFFLINE';$('feed').className='badge bad';put('system','DASHBOARD DATA UNAVAILABLE');$('evidence').textContent=e.message}}
load();setInterval(load,POLL_MS);
</script></body></html>
