<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AX Executive Dashboard</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#151c33;border:1px solid #293354;border-radius:14px;padding:18px}.value{font-size:1.35rem;font-weight:700;margin-top:8px}.ok{color:#63e6be}.warn{color:#ffd166}.bad{color:#ff7b7b}small,.muted{color:#aeb8d4}pre{white-space:pre-wrap;word-break:break-word}h1{margin-bottom:4px}button{padding:8px 12px;border-radius:8px;border:1px solid #44517a;background:#202a49;color:#fff}</style></head>
<body><main><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>AX Executive Dashboard</h1><div class="muted">Autonomous execution status · local status feed</div></div><button onclick="load()">Refresh</button></div>
<div class="grid" style="margin-top:18px"><div class="card"><small>System</small><div id="system" class="value">Loading…</div></div><div class="card"><small>Runner</small><div id="runner" class="value">Loading…</div></div><div class="card"><small>Current Task</small><div id="task" class="value">Loading…</div></div><div class="card"><small>Last Cycle</small><div id="time" class="value">Loading…</div></div><div class="card"><small>Mutation</small><div id="mutation" class="value">Loading…</div></div><div class="card"><small>Persistence</small><div id="persistence" class="value">Loading…</div></div><div class="card" style="grid-column:1/-1"><small>Evidence</small><pre id="evidence">Loading…</pre></div></div></main>
<script>async function load(){try{const r=await fetch('status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();const set=(id,v,c)=>{const e=document.getElementById(id);e.textContent=v;e.className='value '+c};set('system',s.system||'UNKNOWN',s.system==='ONLINE'?'ok':'warn');set('runner',s.runner||'UNKNOWN',s.runner==='VERIFIED'?'ok':'warn');set('task',(s.taskId||'NONE')+' · '+(s.taskState||'UNKNOWN'),'');set('time',s.timestamp||'UNKNOWN','');set('mutation',s.mutation?'VERIFIED':'NOT VERIFIED',s.mutation?'ok':'bad');set('persistence',s.persistence?'VERIFIED':'NOT VERIFIED',s.persistence?'ok':'bad');document.getElementById('evidence').textContent=JSON.stringify(s,null,2)}catch(e){set('system','DASHBOARD DATA UNAVAILABLE','bad');document.getElementById('evidence').textContent=e.message}}function set(id,v,c){const e=document.getElementById(id);e.textContent=v;e.className='value '+c}load();setInterval(load,10000)</script></body></html>
