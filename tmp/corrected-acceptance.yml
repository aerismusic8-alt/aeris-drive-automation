name: AKATH 24x7 Acceptance Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: akath-24x7-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AKATH_RUNTIME_ID: akath-primary
      AKATH_PROBE_MODE: "true"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run and verify one autonomous AKATH cycle
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $stateDir = Join-Path $env:RUNNER_TEMP ("akath-24x7-acceptance\${{ github.run_id }}")
          & "$env:GITHUB_WORKSPACE/AKATH/runtime/akath_worker.ps1" -ProbeMode -StateDir $stateDir
          if ($LASTEXITCODE -ne 0) { throw "AKATH_WORKER_FAILED:$LASTEXITCODE" }

          $statePath = Join-Path $stateDir 'runtime-state.json'
          if (-not (Test-Path -LiteralPath $statePath)) { throw 'AKATH_STATE_MISSING' }
          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          if ($state.state -ne 'VERIFIED') { throw "AKATH_STATE_NOT_VERIFIED:$($state.state)" }
          if ($state.verification_status -ne 'VERIFIED') { throw 'AKATH_VERIFICATION_MISSING' }
          if ([string]::IsNullOrWhiteSpace($state.evidence_ref)) { throw 'AKATH_EVIDENCE_REF_MISSING' }
          $evidence = Get-Content -Raw -LiteralPath $state.evidence_ref | ConvertFrom-Json
          if ($evidence.verification_status -ne 'VERIFIED') { throw 'AKATH_EVIDENCE_NOT_VERIFIED' }
          if ($evidence.rehydration.rehydration_status -ne 'VERIFIED') { throw 'AKATH_REHYDRATION_NOT_VERIFIED' }
          if ($evidence.rehydration.identity -ne 'A') { throw 'AKATH_IDENTITY_NOT_A' }
          if ($evidence.rehydration.execution_authorized -ne $false) { throw 'AKATH_REHYDRATION_AUTHORITY_BYPASS' }
          if ($evidence.next_job_ready -ne $true) { throw 'AKATH_NEXT_JOB_NOT_READY' }
          "AKATH_RUN_ID=$($state.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_JOB_ID=$($state.job_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_EVIDENCE=$($state.evidence_ref)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_CYCLE_VERIFIED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run adapter acceptance test
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python "$env:GITHUB_WORKSPACE/AKATH/tests/rehydration_adapter_tests.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evaluate previous scheduled acceptance cycles
        if: github.event_name == 'schedule'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/akath-24x7-acceptance.yml/runs?event=schedule&per_page=10"
          $data = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
          $currentId = [int64]'${{ github.run_id }}'
          $previous = @($data.workflow_runs | Where-Object { $_.id -ne $currentId } | Select-Object -First 2)
          if ($previous.Count -lt 2) {
            "AKATH_24X7_STREAK=1/3" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "AKATH_ACCEPTANCE_READY=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          if ($previous[0].conclusion -ne 'success' -or $previous[1].conclusion -ne 'success') {
            "AKATH_24X7_STREAK=1/3 RESET" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "AKATH_ACCEPTANCE_READY=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "AKATH_24X7_STREAK=3/3" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_ACCEPTANCE_READY=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_PREV1_ID=$([string]$previous[0].id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_PREV1_NUMBER=$([string]$previous[0].run_number)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_PREV2_ID=$([string]$previous[1].id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_PREV2_NUMBER=$([string]$previous[1].run_number)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Persist authoritative 24x7 proof
        if: github.event_name == 'schedule' && env.AKATH_ACCEPTANCE_READY == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $proofDir = Join-Path $env:GITHUB_WORKSPACE 'AKATH/VERIFICATION'
          New-Item -ItemType Directory -Force -Path $proofDir | Out-Null
          $record = [ordered]@{
            schema = 'AKATH_AUTONOMY_24X7_ACCEPTANCE_V1'
            acceptance = 'PASS'
            verified_at_utc = [DateTime]::UtcNow.ToString('o')
            workflow = 'AKATH 24x7 Acceptance Gate'
            schedule = '*/5 * * * *'
            chat_intervention_between_cycles = $false
            cycle_count = 3
            cycles = @(
              [ordered]@{ sequence = 1; github_run_id = $env:AKATH_PREV2_ID; github_run_number = [int64]$env:AKATH_PREV2_NUMBER; conclusion = 'success'; event = 'schedule' },
              [ordered]@{ sequence = 2; github_run_id = $env:AKATH_PREV1_ID; github_run_number = [int64]$env:AKATH_PREV1_NUMBER; conclusion = 'success'; event = 'schedule' },
              [ordered]@{ sequence = 3; github_run_id = [string]'${{ github.run_id }}'; github_run_number = [int64]'${{ github.run_number }}'; conclusion = 'success'; event = 'schedule'; runtime_run_id = $env:AKATH_RUN_ID; runtime_job_id = $env:AKATH_JOB_ID; evidence_ref = $env:AKATH_EVIDENCE }
            )
          }
          $proofPath = Join-Path $proofDir 'three-cycle-proof.json'
          $record | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 -Path $proofPath
          if ((Get-Content -Raw $proofPath | ConvertFrom-Json).acceptance -ne 'PASS') { throw 'AKATH_PROOF_SELF_CHECK_FAILED' }
          $statusPath = Join-Path $env:GITHUB_WORKSPACE 'AKATH/STATUS.md'
          $status = Get-Content -Raw -LiteralPath $statusPath
          $replacement = @(
            '## 24/7 verification',
            '',
            '**VERIFIED** — three successive successful scheduled autonomous runtime cycles were verified by the AKATH 24x7 Acceptance Gate without ChatGPT intervention.',
            '',
            '### Acceptance proof',
            '',
            '- Proof: `AKATH/VERIFICATION/three-cycle-proof.json`',
            '- Workflow: `.github/workflows/akath-24x7-acceptance.yml`',
            '- Criterion: three consecutive successful scheduled runs',
            '- Runtime: self-hosted `PC2-CODING-EXECUTOR`',
            '- A MASTER BRAIN rehydration: VERIFIED',
            '- Execution authority bypass during rehydration: false',
            '',
            '### Integrity boundary',
            '',
            'A dashboard heartbeat alone is not sufficient proof. The persisted three-cycle acceptance record is the authoritative runtime evidence.'
          ) -join [Environment]::NewLine
          $status = [regex]::Replace($status, '(?ms)## 24/7 verification\r?\n.*?(?=\r?\n## |\z)', $replacement, 1)
          Set-Content -Encoding UTF8 -Path $statusPath -Value $status
          git config user.name 'AKATH Autonomous Acceptance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AKATH/VERIFICATION/three-cycle-proof.json AKATH/STATUS.md
          git commit -m 'chore: promote AKATH 24x7 acceptance to verified'
          git push origin HEAD:main

      - name: Report acceptance state
        if: always()
        shell: powershell
        run: |
          Write-Host "AKATH_24X7_ACCEPTANCE_RUN=${{ github.run_id }}"
          Write-Host "AKATH_24X7_ACCEPTANCE_EVENT=${{ github.event_name }}"
          Write-Host "AKATH_24X7_ACCEPTANCE_READY=$env:AKATH_ACCEPTANCE_READY"
