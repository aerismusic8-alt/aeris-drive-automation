name: AX OpenAI Helper Test

on:
  push:
    paths:
      - 'AKATH/runtime/ax_openai_helper.py'
      - 'AKATH/tests/openai_helper_tests.py'
      - '.github/workflows/openai-helper-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenAI helper contract test
        run: python3 AKATH/tests/openai_helper_tests.py
