name: AX UI File Picker Repair

on:
  push:
    branches: [main]
    paths:
      - 'AX_UI_FILEPICKER_REPAIR_TRIGGER.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch AX Web Chat file picker
        shell: python
        run: |
          from pathlib import Path

          path = Path('cloudflare/ax-control-runtime/src/index.ts')
          source = path.read_text(encoding='utf-8')

          old_css = '.ok{padding:10px;background:#eef7ee;border-radius:9px}.err{padding:10px;background:#fdecec;border-radius:9px}@media(max-width:700px)'
          new_css = '.ok{padding:10px;background:#eef7ee;border-radius:9px}.err{padding:10px;background:#fdecec;border-radius:9px}.filePicker{position:relative;display:flex;align-items:center;justify-content:flex-start;min-height:44px;padding:11px;border:1px solid #c9d0db;border-radius:9px;background:#fff;overflow:hidden;cursor:pointer}.filePicker input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}.filePicker span{pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:700px)'
          if old_css not in source:
              raise SystemExit('CSS_REPLACEMENT_TARGET_NOT_FOUND')
          source = source.replace(old_css, new_css, 1)

          old_html = '<div class="row"><input id="file" type="file" multiple><button id="send">Send</button></div>'
          new_html = '<div class="row"><label id="filePicker" class="filePicker"><span id="fileLabel">Choose File</span><input id="file" type="file" multiple></label><button id="send">Send</button></div>'
          if old_html not in source:
              raise SystemExit('HTML_REPLACEMENT_TARGET_NOT_FOUND')
          source = source.replace(old_html, new_html, 1)

          old_js = "$('logout').onclick=()=>{setSession('');location.reload()};$('send').onclick=async()=>{"
          new_js = "$('logout').onclick=()=>{setSession('');location.reload()};$('file').addEventListener('change',()=>{const count=$('file').files.length;$('fileLabel').textContent=count?(count+' file'+(count===1?'':'s')+' selected'):'Choose File'});$('send').onclick=async()=>{"
          if old_js not in source:
              raise SystemExit('JS_REPLACEMENT_TARGET_NOT_FOUND')
          source = source.replace(old_js, new_js, 1)

          old_clear = "$('message').value='';$('file').value='';$('result').className='muted'"
          new_clear = "$('message').value='';$('file').value='';$('fileLabel').textContent='Choose File';$('result').className='muted'"
          if old_clear not in source:
              raise SystemExit('CLEAR_REPLACEMENT_TARGET_NOT_FOUND')
          source = source.replace(old_clear, new_clear, 1)

          path.write_text(source, encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'AX Repair Bot'
          git config user.email 'ax-repair-bot@users.noreply.github.com'
          git add cloudflare/ax-control-runtime/src/index.ts
          git commit -m 'fix: make entire file picker field clickable'
          git push origin HEAD:main
