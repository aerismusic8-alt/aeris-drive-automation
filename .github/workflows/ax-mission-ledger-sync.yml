name: AX Mission Ledger Sync

on:
  workflow_dispatch:
    inputs:
      mission_payload:
        description: 'JSON event array/object for AX mission intake or update'
        required: false
        default: '[]'
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'AX_MISSION_INPUT.json'
      - 'AX_MISSION_LEDGER.json'
      - 'AX_MISSION_LEDGER.ps1'
      - 'AX_CONTEXT_SYNC.ps1'
      - 'docs/AX_MISSION_MEMORY_PROTOCOL_V1.md'
      - '.github/workflows/ax-mission-ledger-sync.yml'

permissions:
  contents: write

jobs:
  mission-ledger:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pester when missing
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run mission ledger tests
        shell: powershell
        run: |
          Import-Module Pester
          Invoke-Pester .\tests\AX_MISSION_LEDGER.Tests.ps1 -Output Detailed

      - name: Apply mission input
        shell: powershell
        env:
          MISSION_PAYLOAD: ${{ github.event.inputs.mission_payload }}
        run: |
          . .\AX_MISSION_LEDGER.ps1
          $ledger = Load-AxMissionLedger '.\AX_MISSION_LEDGER.json'
          $events = @()
          if ($env:MISSION_PAYLOAD -and $env:MISSION_PAYLOAD -ne '[]') {
            $parsed = $env:MISSION_PAYLOAD | ConvertFrom-Json
            if ($parsed -is [array]) { $events=@($parsed) } elseif ($parsed.events) { $events=@($parsed.events) } else { $events=@($parsed) }
          } elseif (Test-Path '.\AX_MISSION_INPUT.json') {
            $parsed = Get-Content -Raw '.\AX_MISSION_INPUT.json' | ConvertFrom-Json
            if ($parsed.events) { $events=@($parsed.events) }
          }
          foreach ($event in $events) {
            if (-not $event.missionId) {
              if ($event.type -ne 'mission.create' -and $event.eventType -ne 'mission.create') { continue }
              $event | Add-Member -NotePropertyName missionId -NotePropertyValue (New-AxMissionId ([string]$event.objective) ([string]$event.timestamp) ([string]$event.sourceId)) -Force
              if (-not $event.content) { $event | Add-Member -NotePropertyName content -NotePropertyValue ([string]$event.objective) -Force }
            }
            $ledger = Upsert-AxMissionEvent $ledger $event
          }
          $result = Save-AxMissionLedger '.\AX_MISSION_LEDGER.json' $ledger
          if (-not $result.verified) { throw ('AX_MISSION_LEDGER_VERIFY_FAIL:' + (@($result.errors) -join ',')) }
          Write-Host "AX_MISSION_LEDGER=VERIFIED"
          Write-Host "AX_MISSION_COUNT=$($result.missionCount)"
          Write-Host "AX_MISSION_EVENT_COUNT=$($result.eventCount)"

      - name: Recovery verification
        shell: powershell
        run: |
          . .\AX_MISSION_LEDGER.ps1
          $reloaded = Load-AxMissionLedger '.\AX_MISSION_LEDGER.json'
          $check = Test-AxMissionLedger $reloaded
          if (-not $check.verified) { throw ('AX_MISSION_RECOVERY_FAIL:' + (@($check.errors) -join ',')) }
          Write-Host 'AX_MISSION_RECOVERY=PASS'
          Write-Host "AX_MISSION_LATEST=$($reloaded.index.lastMissionId)"
          Write-Host "AX_MISSION_LATEST_EVENT=$($reloaded.index.lastEventId)"

      - name: Persist verified ledger
        shell: powershell
        run: |
          git config user.name 'AX Mission Ledger'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_MISSION_LEDGER.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'AX_MISSION_PERSISTENCE=NO_CHANGE'; exit 0 }
          git commit -m 'chore: persist AX mission ledger state'
          git push origin HEAD:main
          Write-Host 'AX_MISSION_PERSISTENCE=PASS'
