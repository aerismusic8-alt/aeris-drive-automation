name: JT Cloud Browser Worker

on:
  push:
    branches: [main]
    paths:
      - 'JT_CLOUD/**'
      - '.github/workflows/jt-cloud-browser-worker.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: jt-cloud-browser-worker
  cancel-in-progress: false

jobs:
  cloud-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run JumpTask cloud inspection
        id: inspect
        env:
          JT_APP_URL: https://app.jumptask.io
          JT_STORAGE_STATE_B64: ${{ secrets.JT_STORAGE_STATE_B64 }}
        run: node JT_CLOUD/jt-cloud-worker.mjs

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: jt-cloud-evidence-${{ github.run_id }}
          path: jt-evidence.json
          retention-days: 7
