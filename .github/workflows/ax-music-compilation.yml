name: AX Music Compilation Release

# Publishes the long-form album compilation: all the songs on one video with a
# clickable chapter list.
#
# Why this is the watch-hour lever. The YouTube Partner Program gate is 4,000
# public watch-hours in 12 months. A 3-minute song watched once earns 0.05 of an
# hour, so songs alone need ~80,000 views; one 57-minute compilation watched once
# earns a whole hour, so the same catalogue needs ~4,000 views. Same songs, same
# cost, ~20x less audience. This is how free music channels clear the bar.
#
# The 2026-11-07 advisor panel put it first: publish the compilation now, keep it
# on the one channel (splitting would just dilute the subscriber count), and give
# it a real chapter list so the "(เลือกเพลงฟังได้)" title is honest.
#
# It runs weekly, not daily: each video is ~30-60 minutes and one upload is
# enough. The upload is guarded by `compilation-state-<stem>.json`, so a retry
# never doubles it and a theme that is already live is skipped. With three
# themes defined it ships one a week for three weeks, then no-ops. Free minutes
# only — no pod, no browser, no paid anything.

on:
  schedule:
    # 10:00 UTC on Mondays. After the 09:00 daily-release tick, so the two
    # uploads do not fight for the same quota pool.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ax-music-compilation
  cancel-in-progress: false

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One long-form album per theme that is not live yet. The 2026-11-08
      # competitor scan (10 real Thai channels, no API quota) found the winning
      # channels publish *many* long-form compilations, each titled for a search
      # intent. The theme mood-sets are disjoint, so the albums are genuinely
      # different and not one tracklist re-titled — which is what the advisor
      # panel warned a channel-level originality review would punish. A theme
      # whose state file already carries a video_id is skipped, so a re-run or a
      # retry never re-uploads.
      - name: Install ffmpeg, the SoundFont sampler, and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # fluidsynth + a MuseScore/FluidR3 SoundFont are the General-MIDI path K
          # rejected (2026-11-09); they stay installed only for the MIDI tooling
          # and as a last resort. The beds themselves are pulled pre-rendered
          # through real instruments (see the pull step) and never re-synthesised
          # here, so AX_REQUIRE_REAL_INSTRUMENTS makes a GM render fail the run.
          sudo apt-get install -y -qq ffmpeg fluidsynth \
            fluid-soundfont-gm musescore-general-soundfont
          python3 -m pip install --quiet --disable-pip-version-check Pillow mido numpy

      - name: Pull the song masters, covers and real-instrument beds
        env:
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 music938-1/scripts/pull_media.py --only songs
          python3 music938-1/scripts/pull_media.py --only covers
          # The sleep bed is a ~30 MB WAV rendered through the sfizz sampler on a
          # pod that has the gigabyte banks. Pulling it is what lets the runner
          # tile a real-instrument bed without building the sampler or ever
          # touching the General-MIDI fallback.
          python3 music938-1/scripts/pull_media.py --only ambient

      - name: Build the 16:9 thumbnail
        run: |
          set -euo pipefail
          cd music938-1 && python3 scripts/brand.py

      # The sleep/ambient lane. The 2026-11-09 scan: a 4-minute single gets ~500
      # views, a 2-hour Thai compilation 6-17M, and a sleep/ambient loop of 8-12
      # hours 100-221M. The *container* is what the algorithm rewards, and this
      # is the biggest one we can build for free: the bed is real instruments
      # (the sfizz sampler — no Flow Music, no login), pulled pre-rendered, music
      # only, and the picture is one held still, so the encode is minutes. One
      # upload, then the state file stops a re-run from doubling it.
      - name: Build and upload the sleep/ambient loop (once)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          AX_REQUIRE_REAL_INSTRUMENTS: "1"
        run: |
          set -euo pipefail
          cd music938-1
          state="work/compilation-state-ambient-sleep.json"
          if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
            echo "ambient sleep loop already live — skipping"
          else
            python3 scripts/ambient_loop.py --preset sleep --minutes 480 --render
            # No `|| echo` on the upload: a silent skip means the sleep loop
            # never goes live and nobody notices. A real failure must be red.
            python3 scripts/upload_compilation.py --upload --ch ch3 \
              --stem ambient-sleep \
              --thumb library/thumbs/thumb-ambient-sleep.png
          fi

      - name: Replace the sleep loop if it was the old synth render
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cd music938-1
          # The sleep video that is live was made by the ffmpeg tone synth K
          # rejected (2026-11-09). The once-step above is guarded by the state
          # file, so it will not re-render; this uploads the corrected
          # real-instrument render and deletes the old one. Idempotent: once the
          # state carries "instrument": "soundfont" it skips on every later run.
          python3 scripts/refresh_sleep_video.py --apply || \
            echo "sleep refresh: skipped or failed; will retry next run"

      # The second long-form surface. The sleep loop is one search intent; the
      # relax preset is a different one (ทำงาน / อ่านหนังสือ / นั่งสมาธิ) on a
      # different bed (sampler1-warm-F.wav), so it is a distinct video, not the
      # sleep one re-titled — which is what a channel-level originality review
      # would punish. The 2026-11-09 scan puts 8-12h ambient containers at
      # 100-221M views and the YPP gate is watch-hours, so a second container
      # adds a whole watch-hours surface at no cost. Same guard: the state file
      # stops a re-run from doubling it.
      - name: Build and upload the relax/study loop (once)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          AX_REQUIRE_REAL_INSTRUMENTS: "1"
        run: |
          set -euo pipefail
          cd music938-1
          state="work/compilation-state-ambient-relax.json"
          if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
            echo "ambient relax loop already live — skipping"
          else
            python3 scripts/ambient_loop.py --preset relax --minutes 480 --render
            # No `|| echo` on the upload: a silent skip means the relax loop
            # never goes live and nobody notices. A real failure must be red.
            python3 scripts/upload_compilation.py --upload --ch ch3 \
              --stem ambient-relax \
              --thumb library/thumbs/thumb-ambient-relax.png
          fi

      - name: Build and upload each themed album not yet live
        id: themed
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cd music938-1
          # One album per run, not all three. `videos.insert` is its own 100/day
          # bucket, so the pool is not the constraint — but three long-form
          # albums landing the same day reads as a burst, and the whole point of
          # the weekly cadence is one album a week for three weeks. A theme too
          # thin to publish falls through to the next one instead of blocking it.
          # Publish at most one long-form video per run. Set this output so the
          # volume step below skips when a themed album was the one that shipped.
          published=0
          for theme in sad chill power; do
            state="work/compilation-state-compilation-${theme}.json"
            if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
              vid=$(python3 -c "import json;print(json.load(open('$state'))['video_id'])")
              echo "theme ${theme} already live: ${vid} — skipping"
              continue
            fi
            echo "=== building theme: ${theme} ==="
            # The theme sets the name, the listening-occasion line in the title
            # and the mood filter. It refuses under 8 eligible tracks so the
            # "N เพลง" title stays honest.
            python3 scripts/compile_album.py --theme "$theme" --max 60 --render
            # No `|| echo` on the upload: a swallowed skip leaves the theme
            # unpublished while the run stays green. A real failure must be red.
            python3 scripts/upload_compilation.py --upload --ch ch3 \
              --stem "compilation-${theme}"
            if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
              echo "published theme ${theme}; stopping this run"
              published=1
              break
            fi
          done
          echo "published=${published}" >> "$GITHUB_OUTPUT"

      # The long-form Volume Series. The 2026-11-15 competitor scan (real public
      # pages, no API quota) found the channels that WIN the Thai "เพลงเพราะๆ
      # ฟังสบาย" query are long-form continuous compilations published as a
      # *numbered series* ("... Vol.152 | รวมเพลงใหม่ ฟังยาว ไม่มีสะดุด เปิดฟัง
      # ทั้งวัน", 30+ volumes deep, median 1,000-3,700 views). We shipped a themed
      # album once and stopped, so YouTube had no "next episode" to suggest and
      # Studio Analytics showed 0% returning viewers. The advisor panel (duck +
      # pollinations, quorum PASS) chose the series over reworking Shorts. One
      # volume per weekly run, ~75 min, newest songs up front, the catalogue
      # rotating so each volume is new listening, and a "next volume" breadcrumb
      # in the description. The volume number is honest: `next_volume` only moves
      # after a real upload succeeds, so a failed run cannot burn a number.
      - name: Build and upload the next long-form Volume
        if: steps.themed.outputs.published != '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cd music938-1
          vol=$(python3 -c "import sys;sys.path.insert(0,'scripts');import volume_series as v;print(v.next_volume())")
          echo "next long-form volume: Vol.${vol}"
          # Builds the render + the volume title/description (chapters, subscribe
          # ask, next-volume breadcrumb). Refuses under 12 tracks / 45 min so the
          # "ฟังยาว" title stays honest.
          # K vetoed a "new" volume that is the previous one's songs reordered
          # (2026-11-26). The plan runs first: when the guard holds the volume,
          # say so in the run summary and stop green - a hold is a decision, not
          # a failure - instead of publishing duplicate content.
          plan=$(python3 scripts/volume_series.py --volume "$vol")
          echo "$plan"
          if ! printf '%s' "$plan" | grep -q '"ok": true'; then
            echo "::notice::long-form volume Vol.${vol} held: $plan"
            # K's deadline (2026-12-15): the hold ends when enough new songs
            # exist, or when the date passes - then the earlier volume ships as
            # a labelled remaster rather than the channel going silent.
            decision=$(python3 scripts/volume_series.py --decision)
            echo "deadline decision: $decision"
            { echo "### Vol.${vol} held"; echo '```json'; echo "$plan"; echo '```';
              echo "Deadline: $decision"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if printf '%s' "$decision" | grep -q '"decision": "remaster"'; then
              python3 scripts/volume_series.py --volume "$vol" --remaster --render
              echo "::warning::built Vol.${vol} as a remaster; publish the stem volume-$(printf '%03d' "$vol")-remaster by hand (no series number is advanced)"
            fi
            exit 0
          fi
          python3 scripts/volume_series.py --volume "$vol" --render
          # No `|| echo` on the upload: a swallowed skip leaves the volume
          # unpublished while the run stays green. A real failure must be red.
          python3 scripts/upload_compilation.py --upload --ch ch3 \
            --stem "volume-$(printf '%03d' "$vol")" --series-volume "$vol"

      - name: Record the uploads
        run: |
          set -euo pipefail
          git config user.name  "ax-music-compilation"
          git config user.email "ax-music-compilation@users.noreply.github.com"
          git add music938-1/work/compilation-state-*.json \
                  music938-1/work/volume-series-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change to record"
            exit 0
          fi
          git commit -m "data(music): compilation upload $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
