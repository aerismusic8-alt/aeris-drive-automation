name: AX Music Compilation Release

# Publishes the long-form album compilation: all the songs on one video with a
# clickable chapter list.
#
# Why this is the watch-hour lever. The YouTube Partner Program gate is 4,000
# public watch-hours in 12 months. A 3-minute song watched once earns 0.05 of an
# hour, so songs alone need ~80,000 views; one 57-minute compilation watched once
# earns a whole hour, so the same catalogue needs ~4,000 views. Same songs, same
# cost, ~20x less audience. This is how free music channels clear the bar.
#
# The 2026-11-07 advisor panel put it first: publish the compilation now, keep it
# on the one channel (splitting would just dilute the subscriber count), and give
# it a real chapter list so the "(เลือกเพลงฟังได้)" title is honest.
#
# It runs weekly, not daily: each video is ~30-60 minutes and one upload is
# enough. The upload is guarded by `compilation-state-<stem>.json`, so a retry
# never doubles it and a theme that is already live is skipped. With three
# themes defined it ships one a week for three weeks, then no-ops. Free minutes
# only — no pod, no browser, no paid anything.

on:
  schedule:
    # 10:00 UTC on Mondays. After the 09:00 daily-release tick, so the two
    # uploads do not fight for the same quota pool.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ax-music-compilation
  cancel-in-progress: false

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One long-form album per theme that is not live yet. The 2026-11-08
      # competitor scan (10 real Thai channels, no API quota) found the winning
      # channels publish *many* long-form compilations, each titled for a search
      # intent. The theme mood-sets are disjoint, so the albums are genuinely
      # different and not one tracklist re-titled — which is what the advisor
      # panel warned a channel-level originality review would punish. A theme
      # whose state file already carries a video_id is skipped, so a re-run or a
      # retry never re-uploads.
      - name: Install ffmpeg and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # brand.py builds the 16:9 thumbnail with PIL. Without this the run
          # died at "No module named 'PIL'" before building a single album, so
          # the themed compilations never shipped (fixed 2026-11-09).
          python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Pull the song masters and covers
        env:
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 music938-1/scripts/pull_media.py --only songs
          python3 music938-1/scripts/pull_media.py --only covers

      - name: Build the 16:9 thumbnail
        run: |
          set -euo pipefail
          cd music938-1 && python3 scripts/brand.py

      # The sleep/ambient lane. The 2026-11-09 scan: a 4-minute single gets ~500
      # views, a 2-hour Thai compilation 6-17M, and a sleep/ambient loop of 8-12
      # hours 100-221M. The *container* is what the algorithm rewards, and this
      # is the biggest one we can build for free: the bed is our own synth (no
      # Flow Music, no login), the rain is ffmpeg's own noise (no download, no
      # licence), and the picture is one held still, so the encode is minutes.
      # One upload, then the state file stops a re-run from doubling it.
      - name: Build and upload the sleep/ambient loop (once)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cd music938-1
          state="work/compilation-state-ambient-sleep.json"
          if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
            echo "ambient sleep loop already live — skipping"
          else
            python3 scripts/ambient_loop.py --preset sleep --minutes 480 --rain --render
            python3 scripts/upload_compilation.py --upload --ch ch3 \
              --stem ambient-sleep \
              --thumb library/thumbs/thumb-ambient-sleep.png \
              || echo "ambient sleep: upload skipped"
          fi

      - name: Build and upload each themed album not yet live
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cd music938-1
          # One album per run, not all three. `videos.insert` is its own 100/day
          # bucket, so the pool is not the constraint — but three long-form
          # albums landing the same day reads as a burst, and the whole point of
          # the weekly cadence is one album a week for three weeks. A theme too
          # thin to publish falls through to the next one instead of blocking it.
          for theme in sad chill power; do
            state="work/compilation-state-compilation-${theme}.json"
            if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
              vid=$(python3 -c "import json;print(json.load(open('$state'))['video_id'])")
              echo "theme ${theme} already live: ${vid} — skipping"
              continue
            fi
            echo "=== building theme: ${theme} ==="
            # The theme sets the name, the listening-occasion line in the title
            # and the mood filter. It refuses under 8 eligible tracks so the
            # "N เพลง" title stays honest.
            python3 scripts/compile_album.py --theme "$theme" --max 60 --render
            python3 scripts/upload_compilation.py --upload --ch ch3 \
              --stem "compilation-${theme}" || echo "theme ${theme}: upload skipped"
            if [ -f "$state" ] && grep -q '"video_id": *"[^"]' "$state"; then
              echo "published theme ${theme}; stopping this run"
              break
            fi
          done

      - name: Record the uploads
        run: |
          set -euo pipefail
          git config user.name  "ax-music-compilation"
          git config user.email "ax-music-compilation@users.noreply.github.com"
          git add music938-1/work/compilation-state-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change to record"
            exit 0
          fi
          git commit -m "data(music): compilation upload $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
