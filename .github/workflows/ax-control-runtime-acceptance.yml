name: AX Control Runtime Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ax-control-runtime-acceptance.yml'
      - 'cloudflare/ax-control-runtime/**'
      - 'AX_PC_CONTROL/AX_PC_NODE.ps1'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
      RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
    outputs:
      request_id: ${{ steps.enqueue.outputs.request_id }}
      task_id: ${{ steps.enqueue.outputs.task_id }}
      session_token: ${{ steps.web-session.outputs.session_token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run source contract regression checks
        shell: bash
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
      - name: Validate required secrets are provisioned
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 1; }
          test -n "$AX_MOBILE_INGRESS_SECRET" || { echo 'AX_MOBILE_INGRESS_SECRET_MISSING'; exit 1; }
          test -n "$AX_PC_PULL_SECRET" || { echo 'AX_PC_PULL_SECRET_MISSING'; exit 1; }
      - name: Apply runtime request correlation patch for acceptance
        shell: python
        working-directory: ${{ github.workspace }}
        run: |
          from pathlib import Path
          path = Path('cloudflare/ax-control-runtime/src/index.ts')
          text = path.read_text(encoding='utf-8')
          old_pull = """    if (path === '/pull' && request.method === 'POST') {
      const now = Date.now();
      const index = current.findIndex((item) => {
        const meta = item as AxGatewayInput & { _status?: string; _leaseUntil?: number };
        return meta._status !== 'ACKED' && (!meta._leaseUntil || meta._leaseUntil <= now);
      });
      if (index < 0) return json({ ok: true, item: null });
"""
          new_pull = """    if (path === '/pull' && request.method === 'POST') {
      const now = Date.now();
      const requestedId = payload && typeof payload === 'object'
        ? String((payload as { request_id?: unknown }).request_id || '')
        : '';
      const index = current.findIndex((item) => {
        const meta = item as AxGatewayInput & { _status?: string; _leaseUntil?: number };
        return meta._status !== 'ACKED'
          && (!meta._leaseUntil || meta._leaseUntil <= now)
          && (!requestedId || item.request_id === requestedId);
      });
      if (index < 0) {
        return requestedId
          ? json({ error: 'REQUEST_UNAVAILABLE', requestId: requestedId }, 404)
          : json({ ok: true, item: null });
      }
"""
          if old_pull not in text:
              raise SystemExit('RUNTIME_PULL_PATTERN_NOT_FOUND')
          text = text.replace(old_pull, new_pull, 1)
          old_route = """    if (request.method === 'POST' && url.pathname === '/pc/pull') {
      if (!secretAccepted(bearerSecret(request), env.AX_PC_PULL_SECRET)) return json({ error: 'AUTH_REQUIRED' }, 401);
      const inboxResponse = await gatewayInboxCall(env, 'pull'); return json(await inboxResponse.json(), inboxResponse.status);
    }
"""
          new_route = """    if (request.method === 'POST' && url.pathname === '/pc/pull') {
      if (!secretAccepted(bearerSecret(request), env.AX_PC_PULL_SECRET)) return json({ error: 'AUTH_REQUIRED' }, 401);
      const body = await request.json().catch(() => null) as { request_id?: string; requestId?: string } | null;
      const requestId = String(body?.request_id ?? body?.requestId ?? '');
      const inboxResponse = await gatewayInboxCall(env, 'pull', requestId ? { request_id: requestId } : {});
      return json(await inboxResponse.json(), inboxResponse.status);
    }
"""
          if old_route not in text:
              raise SystemExit('PC_PULL_ROUTE_PATTERN_NOT_FOUND')
          text = text.replace(old_route, new_route, 1)
          path.write_text(text, encoding='utf-8')
          print('ACCEPTANCE_RUNTIME_CORRELATION_PATCH_OK')
      - name: Verify acceptance runtime source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'REQUEST_UNAVAILABLE' cloudflare/ax-control-runtime/src/index.ts
          grep -q 'requestId ? { request_id: requestId } : {}' cloudflare/ax-control-runtime/src/index.ts
          echo 'ACCEPTANCE_RUNTIME_CORRELATION_SOURCE_OK'
      - name: Deploy current control runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: npx wrangler@latest deploy
      - name: Provision Worker secrets
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          printf '%s' "$AX_MOBILE_INGRESS_SECRET" | npx wrangler@latest secret put AX_MOBILE_INGRESS_SECRET --name ax-control-runtime
          printf '%s' "$AX_PC_PULL_SECRET" | npx wrangler@latest secret put AX_PC_PULL_SECRET --name ax-control-runtime
      - name: Verify deployed health gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(process.env.RUNTIME_URL + '/health');
          if (!response.ok) throw new Error(`HEALTH_HTTP_${response.status}`);
          const r = await response.json();
          console.log(JSON.stringify({status:r.status,mode:r.mode,liveFinancialExecution:r.liveFinancialExecution,mobileIngressAuthConfigured:r.mobileIngressAuthConfigured,pcPullAuthConfigured:r.pcPullAuthConfigured,gatewayInbox:r.gatewayInbox}));
          if (r.status !== 'ONLINE' || r.mode !== 'FREE_ONLY' || r.liveFinancialExecution !== false || r.mobileIngressAuthConfigured !== true || r.pcPullAuthConfigured !== true || r.gatewayInbox !== 'AX_GATEWAY_INBOX') process.exit(1);
          NODE
      - name: Enqueue explicit PC health task
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(process.env.RUNTIME_URL + '/mobile/input',{method:'POST',headers:{Authorization:`Bearer ${process.env.AX_MOBILE_INGRESS_SECRET}`,'Content-Type':'application/json'},body:JSON.stringify({request_id:`ACCEPT-PC-${crypto.randomUUID()}`,task_id:`TASK-PC2-${crypto.randomUUID().slice(0,8)}`,source_channel:'MOBILE',content_type:'text',content:JSON.stringify({operation:'health'}),attachments:[]})});
          const r = await response.json();
          console.log(JSON.stringify(r));
          if (response.status !== 201 || r.accepted !== true || r.queued !== true || !r.requestId || !r.taskId) process.exit(1);
          fs.writeFileSync(process.env.GITHUB_OUTPUT,`request_id=${r.requestId}${String.fromCharCode(10)}task_id=${r.taskId}${String.fromCharCode(10)}`);
          NODE
      - name: Open web result session
        id: web-session
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(process.env.RUNTIME_URL + '/web/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:process.env.AX_MOBILE_INGRESS_SECRET})});
          const r = await response.json();
          if (response.status !== 200 || r.authenticated !== true || !r.sessionToken) process.exit(1);
          fs.writeFileSync(process.env.GITHUB_OUTPUT,`session_token=${r.sessionToken}${String.fromCharCode(10)}`);
          NODE

  pc2-execute:
    needs: provision
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
      REQUEST_ID: ${{ needs.provision.outputs.request_id }}
      TASK_ID: ${{ needs.provision.outputs.task_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Execute one canonical PC2 pull cycle
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $node = Join-Path $PWD 'AX_PC_CONTROL\AX_PC_NODE.ps1'
          $config = 'C:\AKATH\AX_PC_CONTROL\AX_PC_NODE_CONFIG.json'
          if (!(Test-Path -LiteralPath $node)) { throw 'AX_PC_NODE_SCRIPT_NOT_FOUND' }
          if (!(Test-Path -LiteralPath $config)) { throw 'AX_PC_NODE_CONFIG_NOT_FOUND' }
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $node -ConfigPath $config -Once 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "AX_PC_NODE_EXIT_$LASTEXITCODE" }
          if ($output -notmatch 'AX_PC_NODE_RESULT\|') { throw 'AX_PC_NODE_RESULT_MISSING' }
          if ($output -notmatch '"taskId":"' + [regex]::Escape($env:TASK_ID)) { throw 'AX_PC_TASK_ID_NOT_MATCHED' }
          if ($output -notmatch '"verified":true') { throw 'AX_PC_NODE_VERIFICATION_FAILED' }
          Write-Host 'AX_PC2_PULL_EXECUTE_WRITEBACK_TRIGGERED'

  verify:
    needs: [provision, pc2-execute]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      REQUEST_ID: ${{ needs.provision.outputs.request_id }}
      TASK_ID: ${{ needs.provision.outputs.task_id }}
      WEB_SESSION_TOKEN: ${{ needs.provision.outputs.session_token }}
    steps:
      - name: Verify PC2 result, ACK, evidence and write-back
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const requestId = process.env.REQUEST_ID;
          const taskId = process.env.TASK_ID;
          const resultUrl = process.env.RUNTIME_URL + '/web/result/' + encodeURIComponent(requestId);
          const headers = {Authorization:`Bearer ${process.env.WEB_SESSION_TOKEN}`,'Content-Type':'application/json'};
          let last = null;
          for (let attempt=1; attempt<=30; attempt++) {
            const response=await fetch(resultUrl,{headers});
            if(response.ok){
              const body=await response.json();
              const result=body.result?.result || body.result || {};
              last=result;
              console.log(JSON.stringify({attempt,requestId,taskId,result},null,2));
              if(result.taskId===taskId && result.verified===true && result.executed===true && result.status==='VERIFIED' && result.node_id==='PC2' && result.writeBackVerified===true && result.evidence?.taskId===taskId && result.evidence?.nodeId==='PC2' && result.evidence?.command==='health'){
                console.log('AX_PC_EXECUTION_LOOP_VERIFIED');
                process.exit(0);
              }
            } else if(response.status!==404 && response.status!==401){throw new Error(`RESULT_HTTP_${response.status}`)}
            await new Promise(r=>setTimeout(r,2000));
          }
          throw new Error('AX_PC_EXECUTION_LOOP_TIMEOUT '+JSON.stringify({requestId,taskId,last}));
          NODE
