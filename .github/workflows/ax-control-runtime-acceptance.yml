name: AX Control Runtime Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - 'AX_PC_CONTROL/AX_PC_NODE.ps1'

permissions:
  contents: read

jobs:
  provision-and-mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
      RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run source contract regression checks
        shell: bash
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
      - name: Validate required secrets are provisioned
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 1; }
          test -n "$AX_MOBILE_INGRESS_SECRET" || { echo 'AX_MOBILE_INGRESS_SECRET_MISSING'; exit 1; }
          test -n "$AX_PC_PULL_SECRET" || { echo 'AX_PC_PULL_SECRET_MISSING'; exit 1; }
      - name: Deploy current control runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: npx wrangler@latest deploy
      - name: Provision Worker secrets
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          printf '%s' "$AX_MOBILE_INGRESS_SECRET" | npx wrangler@latest secret put AX_MOBILE_INGRESS_SECRET --name ax-control-runtime
          printf '%s' "$AX_PC_PULL_SECRET" | npx wrangler@latest secret put AX_PC_PULL_SECRET --name ax-control-runtime
      - name: Verify deployed health gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = process.env.RUNTIME_URL + '/health';
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HEALTH_HTTP_${response.status}`);
          const r = await response.json();
          console.log(JSON.stringify({status:r.status,mode:r.mode,liveFinancialExecution:r.liveFinancialExecution,mobileIngressAuthConfigured:r.mobileIngressAuthConfigured,pcPullAuthConfigured:r.pcPullAuthConfigured,gatewayInbox:r.gatewayInbox}));
          if (r.status !== 'ONLINE' || r.mode !== 'FREE_ONLY' || r.liveFinancialExecution !== false || r.mobileIngressAuthConfigured !== true || r.pcPullAuthConfigured !== true || r.gatewayInbox !== 'AX_GATEWAY_INBOX') process.exit(1);
          NODE
      - name: Verify mobile ingress and create explicit PC health task
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = process.env.RUNTIME_URL + '/mobile/input';
          const requestId = `ACCEPT-PC-${crypto.randomUUID()}`;
          const taskId = `TASK-PC2-${crypto.randomUUID().slice(0,8)}`;
          const body = {request_id:requestId,task_id:taskId,source_channel:'MOBILE',content_type:'text',content:JSON.stringify({operation:'health'}),attachments:[]};
          const response = await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${process.env.AX_MOBILE_INGRESS_SECRET}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
          const r = await response.json();
          console.log(JSON.stringify({status:response.status,accepted:r.accepted,queued:r.queued,requestId:r.requestId,taskId:r.taskId}));
          if (response.status !== 201 || r.accepted !== true || r.queued !== true || r.requestId !== requestId || r.taskId !== taskId) process.exit(1);
          NODE

  pc-e2e:
    needs: provision-and-mobile-e2e
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 10
    env:
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
    steps:
      - name: Run PC2 node once to drain any stale task
        shell: powershell -NoProfile -ExecutionPolicy Bypass
        run: |
          $ErrorActionPreference = 'Stop'
          $node = 'C:\AKATH\AX_PC_CONTROL\AX_PC_NODE.ps1'
          $config = 'C:\AKATH\AX_PC_CONTROL\AX_PC_NODE_CONFIG.json'
          if (!(Test-Path -LiteralPath $node)) { throw 'AX_PC_NODE_NOT_INSTALLED' }
          if (!(Test-Path -LiteralPath $config)) { throw 'AX_PC_NODE_CONFIG_NOT_FOUND' }
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $node -ConfigPath $config -Once 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "AX_PC_NODE_EXIT_$LASTEXITCODE" }
      - name: Execute explicit PC2 health task and require VERIFIED
        shell: powershell -NoProfile -ExecutionPolicy Bypass
        run: |
          $ErrorActionPreference = 'Stop'
          $node = 'C:\AKATH\AX_PC_CONTROL\AX_PC_NODE.ps1'
          $config = 'C:\AKATH\AX_PC_CONTROL\AX_PC_NODE_CONFIG.json'
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $node -ConfigPath $config -Once 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "AX_PC_NODE_EXIT_$LASTEXITCODE" }
          if ($output -notmatch 'AX_PC_NODE_RESULT\|') { throw 'AX_PC_NODE_RESULT_MISSING' }
          if ($output -notmatch '"verified":true') { throw 'AX_PC_NODE_VERIFICATION_FAILED' }
          if ($output -notmatch '"status":"VERIFIED"') { throw 'AX_PC_NODE_STATUS_NOT_VERIFIED' }
          if ($output -notmatch '"command":"health"') { throw 'AX_PC_NODE_HEALTH_EVIDENCE_MISSING' }
          Write-Host 'AX_PC_NODE_E2E_VERIFIED'
      - name: Record runner identity without secrets
        shell: powershell -NoProfile -ExecutionPolicy Bypass
        run: |
          Write-Host "Runner=$env:COMPUTERNAME"
          Write-Host "OS=$env:RUNNER_OS"
          Write-Host "Arch=$env:RUNNER_ARCH"
          Write-Host 'PC secret value was not printed.'
