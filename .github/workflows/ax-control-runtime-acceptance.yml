name: AX Control Runtime Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ax-control-runtime-acceptance.yml'
      - 'cloudflare/ax-control-runtime/**'
      - 'AX_PC_CONTROL/AX_PC_NODE.ps1'

permissions:
  contents: read

jobs:
  provision-and-pc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
      RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run source contract regression checks
        shell: bash
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
      - name: Validate required secrets are provisioned
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 1; }
          test -n "$AX_MOBILE_INGRESS_SECRET" || { echo 'AX_MOBILE_INGRESS_SECRET_MISSING'; exit 1; }
          test -n "$AX_PC_PULL_SECRET" || { echo 'AX_PC_PULL_SECRET_MISSING'; exit 1; }
      - name: Deploy current control runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: npx wrangler@latest deploy
      - name: Provision Worker secrets
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          printf '%s' "$AX_MOBILE_INGRESS_SECRET" | npx wrangler@latest secret put AX_MOBILE_INGRESS_SECRET --name ax-control-runtime
          printf '%s' "$AX_PC_PULL_SECRET" | npx wrangler@latest secret put AX_PC_PULL_SECRET --name ax-control-runtime
      - name: Verify deployed health gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = process.env.RUNTIME_URL + '/health';
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HEALTH_HTTP_${response.status}`);
          const r = await response.json();
          console.log(JSON.stringify({status:r.status,mode:r.mode,liveFinancialExecution:r.liveFinancialExecution,mobileIngressAuthConfigured:r.mobileIngressAuthConfigured,pcPullAuthConfigured:r.pcPullAuthConfigured,gatewayInbox:r.gatewayInbox}));
          if (r.status !== 'ONLINE' || r.mode !== 'FREE_ONLY' || r.liveFinancialExecution !== false || r.mobileIngressAuthConfigured !== true || r.pcPullAuthConfigured !== true || r.gatewayInbox !== 'AX_GATEWAY_INBOX') process.exit(1);
          NODE
      - name: Enqueue explicit PC health task
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const url = process.env.RUNTIME_URL + '/mobile/input';
          const requestId = `ACCEPT-PC-${crypto.randomUUID()}`;
          const taskId = `TASK-PC2-${crypto.randomUUID().slice(0,8)}`;
          const body = {request_id:requestId,task_id:taskId,source_channel:'MOBILE',content_type:'text',content:JSON.stringify({operation:'health'}),attachments:[]};
          const response = await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${process.env.AX_MOBILE_INGRESS_SECRET}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
          const r = await response.json();
          console.log(JSON.stringify({status:response.status,accepted:r.accepted,queued:r.queued,requestId:r.requestId,taskId:r.taskId}));
          if (response.status !== 201 || r.accepted !== true || r.queued !== true || r.requestId !== requestId || r.taskId !== taskId) process.exit(1);
          fs.writeFileSync(process.env.GITHUB_OUTPUT,`request_id=${requestId}${String.fromCharCode(10)}task_id=${taskId}${String.fromCharCode(10)}`);
          NODE
      - name: Open web result session
        id: web-session
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(process.env.RUNTIME_URL + '/web/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:process.env.AX_MOBILE_INGRESS_SECRET})});
          const r = await response.json();
          console.log(JSON.stringify({status:response.status,authenticated:r.authenticated,expiresInMs:r.expiresInMs}));
          if (response.status !== 200 || r.authenticated !== true || !r.sessionToken) process.exit(1);
          fs.writeFileSync(process.env.GITHUB_OUTPUT,`session_token=${r.sessionToken}${String.fromCharCode(10)}`);
          NODE
      - name: Poll for persistent PC2 execution result and require VERIFIED
        shell: bash
        env:
          REQUEST_ID: ${{ steps.enqueue.outputs.request_id }}
          TASK_ID: ${{ steps.enqueue.outputs.task_id }}
          WEB_SESSION_TOKEN: ${{ steps.web-session.outputs.session_token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const requestId = process.env.REQUEST_ID;
          const taskId = process.env.TASK_ID;
          const resultUrl = process.env.RUNTIME_URL + '/web/result/' + encodeURIComponent(requestId);
          const headers = {Authorization:`Bearer ${process.env.WEB_SESSION_TOKEN}`,'Content-Type':'application/json'};
          let last = null;
          for (let attempt = 1; attempt <= 60; attempt++) {
            const response = await fetch(resultUrl,{headers});
            if (response.ok) {
              const body = await response.json();
              const result = body.result?.result || body.result || {};
              last = result;
              console.log(JSON.stringify({attempt,requestId,taskId,result},null,2));
              if (result.taskId === taskId && result.verified === true && result.executed === true && result.status === 'VERIFIED' && result.node_id === 'PC2' && result.writeBackVerified === true && result.evidence?.taskId === taskId && result.evidence?.nodeId === 'PC2' && result.evidence?.command === 'health') {
                console.log('AX_PC_PERSISTENT_E2E_VERIFIED');
                process.exit(0);
              }
            } else if (response.status !== 404) {
              const text = await response.text();
              throw new Error(`RESULT_HTTP_${response.status}:${text}`);
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          console.error('AX_PC_PERSISTENT_E2E_TIMEOUT',JSON.stringify({requestId,taskId,last},null,2));
          process.exit(1);
          NODE
