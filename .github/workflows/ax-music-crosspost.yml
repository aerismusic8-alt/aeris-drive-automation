name: AX Music Crosspost (FB Reels + TikTok)

# The one rail that used to need a person: posting Shorts to the Facebook Page
# and TikTok needs a signed-in browser, and the cloud desktop that holds that
# login only exists inside a build pod. So the backlog only moved when a pod
# happened to be up (34 Reels sat unposted). This runs the same rail on GitHub
# Actions — always on, free for a public repo, no sandbox quota — restoring a
# saved session from a secret.
#
# The session is a credential: `AERIS_STORAGE_STATE_B64` (see
# `ops/save_storage_state.py`). Refresh it when it dies by signing in on the
# cloud desktop and re-running the exporter; a dead session makes the run fail
# loudly and push a phone alert, so it never fails silently.
#
# The browser is now the *fallback*, not the only route. When an API token is
# present the rail posts through the Meta Graph API / TikTok Content Posting API
# with no browser at all, so K is out of the loop:
#   FB_PAGE_TOKEN + FB_APP_ID + FB_APP_SECRET   -> Facebook (never-expiring System User token)
#   TT_CLIENT_KEY + TT_CLIENT_SECRET + TT_REFRESH_TOKEN -> TikTok
# Both are optional. With neither, everything below behaves exactly as before.
#
# Pacing lives in `crosspost.py` (1-hour gap; 4 posts/day on TikTok, 3 on
# Facebook, at most 1 link post/day). A run posts at most one per platform
# because the second is inside the gap; run every 2 hours and the daily cap is
# what limits throughput, not the schedule.
#
# The Facebook rail posts a mix, not only Reels: the queue interleaves cover-art
# photos and Shopee link posts among the Reels, and `crosspost.py` dispatches by
# the item's `kind` (see docs/k-free-runbook.md).

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: facebook | tiktok | all
        default: all
      limit:
        description: max posts per platform this run
        default: '1'

permissions:
  contents: write

concurrency:
  group: ax-music-crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Is the saved session still signed in?
        # Report per surface and never fail here. Facebook and TikTok are
        # independent logins, and gating the whole run on "all signed in" meant
        # one expired login stopped the other surface posting for days — run 7
        # (2026-11-04) failed at this step and skipped 44 pending TikTok Shorts
        # because Facebook's cookie had died. The next step posts to whichever
        # surfaces answer; this step only says which.
        id: probe
        env:
          AERIS_STORAGE_STATE_B64: ${{ secrets.AERIS_STORAGE_STATE_B64 }}
          # API tokens make the browser unnecessary; the probe reports those
          # surfaces as signed in without launching Chromium.
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${AERIS_STORAGE_STATE_B64:-}" ] && [ -z "${FB_PAGE_TOKEN:-}${TT_REFRESH_TOKEN:-}" ]; then
            echo "::error::no posting credential at all: set AERIS_STORAGE_STATE_B64 or an API token"
            exit 1
          fi
          for p in facebook tiktok; do
            python3 music938-1/scripts/crosspost.py --probe --platform "$p"
            rc=$?
            # rc 0 = signed in; rc 3 = an API-only surface with no token, which is
            # parked on purpose and must NOT count as blocked (a red run would make
            # ntfy ask K to sign in — the exact loop we removed); anything else is
            # a dead browser session.
            case "$rc" in
              0) echo "$p=SIGNED_IN" >> "$GITHUB_OUTPUT" ;;
              3) echo "$p=PARKED" >> "$GITHUB_OUTPUT"
                 echo "::notice::$p is API-only and has no token yet — parked, no K needed" ;;
              *) echo "$p=SIGNED_OUT" >> "$GITHUB_OUTPUT"
                 echo "::warning::$p session is dead — posting will skip it" ;;
            esac
          done

      - name: Post the pending Shorts
        env:
          AERIS_STORAGE_STATE_B64: ${{ secrets.AERIS_STORAGE_STATE_B64 }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          # The job token, as in ax-music-release.yml: fetch_media reads the
          # public media release with it. No personal PAT is stored.
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FB_STATE: ${{ steps.probe.outputs.facebook }}
          TK_STATE: ${{ steps.probe.outputs.tiktok }}
        run: |
          set -uo pipefail
          PLAT="${{ github.event.inputs.platform || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '1' }}"
          python3 music938-1/scripts/crosspost.py --status
          # Post only to the surfaces whose session answered the probe. A manual
          # dispatch naming one platform still forces it.
          for p in facebook tiktok; do
            if [ "$PLAT" != "all" ] && [ "$PLAT" != "$p" ]; then continue; fi
            case "$p" in
              facebook) state="${FB_STATE:-}" ;;
              tiktok)   state="${TK_STATE:-}" ;;
            esac
            if [ "$state" = "PARKED" ]; then
              # API-only surface with no token. Parked, not broken: stay quiet and
              # green. It resumes by itself the moment the one-time token exists.
              n=$(python3 music938-1/scripts/crosspost.py --pending-count --platform "$p" | tail -1)
              echo "--- $p: parked (API-only, no token; $n pending) — no K needed ---"
              continue
            fi
            if [ "$PLAT" = "all" ] && [ "$state" != "SIGNED_IN" ]; then
              # Blocked, not empty: there is work waiting and the session cannot
              # carry it. Record the count so the final gate can fail the run.
              n=$(python3 music938-1/scripts/crosspost.py --pending-count --platform "$p" | tail -1)
              echo "--- $p: skipped (session not signed in; $n pending) ---"
              echo "$n" >> /tmp/blocked-pending.txt
              continue
            fi
            echo "--- $p ---"
            python3 music938-1/scripts/crosspost.py --post --platform "$p" --limit "$LIMIT" \
              || echo "$p: nothing posted this run (cadence hold or signed out)"
          done

      - name: Commit the crosspost state
        # `if: always()` because this must run even when a surface is blocked.
        # The posting loop writes the ledger as it goes, so a run that posts to
        # TikTok and is then blocked on Facebook has real state to save. With the
        # old order — gate first, commit second — the gate's non-zero exit skipped
        # this step, the successful TikTok post was never recorded, and the next
        # run posted it a second time.
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "ax-music-crosspost"
          git config user.email "ax-music-crosspost@users.noreply.github.com"
          git add music938-1/work/crosspost-state.json
          if git diff --cached --quiet; then
            echo "no change to record"
            exit 0
          fi
          git commit -m "data(music): crosspost state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Fail if a surface was blocked with work waiting
        # A run that posts nothing because the queue is empty is a normal no-op
        # and must stay green. A run that posts nothing because the session is
        # dead, while posts are pending, is a real outage — and for weeks it
        # looked identical (green) to the healthy case, so K was never told.
        # This turns that outage red so the ntfy step below fires.
        #
        # It runs *after* the commit step on purpose: failing here must not
        # discard the ledger of whatever did post.
        run: |
          set -uo pipefail
          if [ ! -f /tmp/blocked-pending.txt ]; then
            echo "no blocked surface with pending work"
            exit 0
          fi
          total=$(awk '{s+=$1} END{print s+0}' /tmp/blocked-pending.txt)
          if [ "${total:-0}" -gt 0 ]; then
            echo "::error::$total post(s) pending but the session is signed out; nothing was posted"
            exit 1
          fi
          echo "blocked surfaces had no pending work; nothing lost"

      - name: Notify K on ntfy
        if: failure()
        env:
          TOPIC: ${{ vars.AX_NTFY_TOPIC }}
        run: |
          set -euo pipefail
          [ -n "${TOPIC:-}" ] || { echo "no AX_NTFY_TOPIC set"; exit 0; }
          # A "sign in on the cloud desktop" alert with no address is not
          # actionable: the desktop is only reachable at the session's work-2
          # host, and typing a URL on a phone is the hard part. Point at the
          # tap-first page, which opens the surface in the signed-in desktop.
          LINK="${{ vars.AX_LOGIN_URL }}"
          [ -n "$LINK" ] || LINK="(set the AX_LOGIN_URL repo variable to the work-2 host)"
          curl -sS --max-time 20 -H "Title: AERIS — session ที่ต้องล็อกอินใหม่" \
            -H "Tags: warning" -H "Priority: high" \
            -d "session ของ surface ที่ยังใช้ browser หมดอายุ มีโพสต์ค้างอยู่. แตะปุ่มเดียวจบที่ ${LINK} — ล็อกอินเฉพาะ surface ที่แจ้ง (ปกติคือ TikTok @aeris.music4). Facebook เป็น API-only แล้ว: ถ้ายังไม่มี token มันจะ park ไว้เงียบ ๆ ไม่แจ้งเตือน และกลับมาโพสต์เองเมื่อตั้ง FB_PAGE_TOKEN ครั้งเดียว (ดู docs/k-free-runbook.md). ถ้าเพิ่งล็อกอินแล้วยังแดง ให้รัน ops/login_vault.py save และ ops/save_storage_state.py แล้วตั้ง secret AERIS_STORAGE_STATE_B64 ใหม่" \
            "https://ntfy.sh/${TOPIC}" || echo "ntfy push failed (non-fatal)"
