name: Retire Temporary M Supervisor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  retire:
    runs-on: [self-hosted, windows]
    steps:
      - name: Remove temporary M scheduler trigger
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $taskName = 'AERIS AX Supervisor Trigger'
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($task) {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction Stop
            Write-Host "SCHEDULER_TASK_UNREGISTERED=$taskName"
          } else {
            Write-Host "SCHEDULER_TASK_ALREADY_ABSENT=$taskName"
          }
          $after = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($after) { throw 'M_RETIREMENT_FAILED_TASK_STILL_PRESENT' }
          Write-Host 'M_RETIREMENT_VERIFIED=TRUE'

      - name: Confirm AX worker task remains untouched
        shell: powershell
        run: |
          $taskName = 'AX-AERIS-Worker'
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($task) {
            Write-Host "AX_WORKER_TASK_PRESENT=TRUE"
            Write-Host "AX_WORKER_TASK_STATE=$($task.State)"
          } else {
            Write-Host 'AX_WORKER_TASK_PRESENT=FALSE'
          }
