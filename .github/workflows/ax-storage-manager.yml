name: AX Storage Manager
on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'
  workflow_run:
    workflows:
      - AX Autonomous Executive Loop
      - AX Trigger Registry
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ax-storage-manager
  cancel-in-progress: false
jobs:
  storage:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create and verify local storage layout
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          & "$PWD\AX_STORAGE_MANAGER.ps1"
      - name: Storage safety report
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $root='C:\AERIS\AX'
          $free=(Get-PSDrive -Name C).Free
          $dirs=Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $report=[ordered]@{schema='AX_STORAGE_STATUS_V1';timestampUtc=[DateTime]::UtcNow.ToString('o');computer=$env:COMPUTERNAME;root=$root;freeBytes=$free;directories=$dirs;cleanupMode='REPORT_ONLY';protected=@('00_CANONICAL_STATE','04_SCRIPTS','08_EMERGENCY_BACKUP')}
          $report|ConvertTo-Json -Depth 8|Set-Content "$root\09_MANIFEST\storage-status.json" -Encoding UTF8
          Write-Host "AX_STORAGE_STATUS=VERIFIED freeBytes=$free"
