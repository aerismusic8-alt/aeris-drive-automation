name: AX Context Sync

on:
  workflow_dispatch:
    inputs:
      context_payload:
        description: 'JSON array/object containing chat events from the active channel(s)'
        required: false
        default: '[]'
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'AX_CONTEXT_INPUT.json'
      - 'AX_CONTEXT_SYNC.ps1'

permissions:
  contents: write

jobs:
  context-sync:
    runs-on: self-hosted
    env:
      AX_TRIGGER: context_sync
      AX_CONTEXT_WINDOW_HOURS: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical 24h state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if ('${{ github.event.inputs.context_payload }}' -ne '') {
            '${{ github.event.inputs.context_payload }}' | Set-Content -Path AX_CONTEXT_INPUT.json -Encoding UTF8
          }
          & .\AX_CONTEXT_SYNC.ps1 -ContextPath .\AX_CONTEXT_INPUT.json -StatePath .\AX_CANONICAL_STATE.json -WindowHours 24

      - name: Verify canonical state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $s = Get-Content -Raw .\AX_CANONICAL_STATE.json | ConvertFrom-Json
          if ($s.schema -ne 'AX_CANONICAL_STATE_V1') { throw 'AX_CONTEXT_SYNC_SCHEMA_FAIL' }
          if ($s.integrity.verified -ne $true) { throw 'AX_CONTEXT_SYNC_NOT_VERIFIED' }
          Write-Host "Canonical state verified: events=$($s.eventCount)"

      - name: Persist state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          git config user.name 'aerismusic8-alt'
          git config user.email 'aerismusic8-alt@users.noreply.github.com'
          git add AX_CANONICAL_STATE.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'State persistence: NO_CHANGE'; exit 0 }
          git commit -m 'chore: persist AX canonical 24h context state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: State bootstrap marker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $s = Get-Content -Raw .\AX_CANONICAL_STATE.json | ConvertFrom-Json
          Write-Host 'AX_BOOTSTRAP=READY'
          Write-Host "AX_STATE_SCHEMA=$($s.schema)"
          Write-Host "AX_STATE_GENERATED_AT=$($s.generatedAt)"
          Write-Host "AX_STATE_EVENT_COUNT=$($s.eventCount)"
