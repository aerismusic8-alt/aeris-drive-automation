name: AX Active Executions
on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Record runtime heartbeat
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          & "$PWD\AX_ACTIVE_EXECUTIONS.ps1" -TriggerId "ax-active-execution-monitor" -JobId "${{ github.run_id }}" -Status "ACTIVE" -Runner "$env:COMPUTERNAME" -Result "monitor_heartbeat"
      - name: Verify active execution registry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $x=Get-Content -Raw AX_ACTIVE_EXECUTIONS.json|ConvertFrom-Json
          if($x.schema -ne 'AX_ACTIVE_EXECUTIONS_V1'){throw 'ACTIVE_EXECUTIONS_SCHEMA_FAIL'}
          Write-Host "ACTIVE_EXECUTIONS PASS active=$($x.activeCount) stale=$($x.staleCount)"
      - name: Persist registry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          git config user.name 'AX Active Execution Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_ACTIVE_EXECUTIONS.json
          if(git diff --cached --quiet){Write-Host 'No registry mutation'; exit 0}
          git commit -m 'chore: update AX active execution registry'
          for($i=1;$i -le 5;$i++){
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){Write-Host "Registry persistence: PASS attempt=$i"; exit 0}
            Write-Host "Registry persistence: RETRY attempt=$i"
            Start-Sleep -Seconds 2
          }
          throw 'AX_ACTIVE_EXECUTIONS_PUSH_FAILED'
