name: AX Active Executions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ax-active-executions.yml'
      - 'AX_ACTIVE_EXECUTIONS.ps1'
      - 'AX_ACTIVE_EXECUTIONS.json'
  schedule:
    - cron: '*/1 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: ax-active-executions-supervisor
  cancel-in-progress: false

jobs:
  heartbeat:
    # The supervisor must be independent from PC1/PC2 so it can recover a dead runner.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Record supervisor heartbeat
        shell: pwsh
        run: |
          & "$PWD/AX_ACTIVE_EXECUTIONS.ps1" -TriggerId "ax-active-execution-monitor" -JobId "${{ github.run_id }}" -Status "ACTIVE" -Runner "${{ runner.name }}" -Result "supervisor_heartbeat"

      - name: Verify active execution registry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $x=Get-Content -Raw AX_ACTIVE_EXECUTIONS.json|ConvertFrom-Json
          if($x.schema -ne 'AX_ACTIVE_EXECUTIONS_V1'){throw 'ACTIVE_EXECUTIONS_SCHEMA_FAIL'}
          Write-Host "ACTIVE_EXECUTIONS PASS active=$($x.activeCount) stale=$($x.staleCount)"

      - name: Run runner failover unit test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "$PWD/tests/AX_RUNNER_FAILOVER_TEST.ps1"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Verify workflow dispatch contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "$PWD/tests/AX_ACTIVE_EXECUTIONS_DISPATCH_TEST.ps1"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Supervise AKATH runtime and fail over PC1 to PC2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $workflow='akath-runtime.yml'
          $dispatchEndpoint="repos/$repo/actions/workflows/$workflow/dispatches"
          $runsEndpoint="repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=20"
          $now=[DateTime]::UtcNow
          $staleMinutes=6

          $runs = @(gh api $runsEndpoint --jq '.workflow_runs[] | {id,status,event,created_at}') | ForEach-Object { $_ | ConvertFrom-Json }
          $active = @($runs | Where-Object { $_.status -in @('queued','requested','waiting','pending','in_progress') } | Sort-Object { [DateTime]$_.created_at })
          if($active.Count -gt 0){
            $run=$active[0]
            $age=($now-[DateTime]$run.created_at).TotalMinutes
            if($age -lt $staleMinutes){
              Write-Host "AKATH_SUPERVISOR=BUSY existingRun=$($run.id) status=$($run.status) ageMinutes=$([math]::Round($age,1))"
              exit 0
            }
            Write-Host "AKATH_SUPERVISOR=STALE_RUN_CANCEL existingRun=$($run.id) status=$($run.status) ageMinutes=$([math]::Round($age,1))"
            gh run cancel $run.id -R $repo
            Start-Sleep -Seconds 2
          }

          function Dispatch-Akath([string]$target) {
            $dispatchAt=[DateTime]::UtcNow
            Write-Host "AKATH_SUPERVISOR=POST_WORKFLOW_DISPATCH target=$target"
            $response = gh api --method POST $dispatchEndpoint -f ref=main -f "inputs[target]=$target" -f "inputs[task_id]=" --include 2>&1
            $exit=$LASTEXITCODE
            Write-Host ($response -join [Environment]::NewLine)
            if($exit -ne 0){ throw "AKATH_WORKFLOW_DISPATCH_POST_FAILED:$target" }
            for($i=1;$i -le 12;$i++){
              Start-Sleep -Seconds 5
              $recent = @(gh api $runsEndpoint --jq '.workflow_runs[] | {id,status,event,created_at}') | ForEach-Object { $_ | ConvertFrom-Json }
              $match = $recent | Where-Object { $_.event -eq 'workflow_dispatch' -and ([DateTime]$_.created_at) -ge $dispatchAt } | Sort-Object { [DateTime]$_.created_at } -Descending | Select-Object -First 1
              if($null -ne $match){
                Write-Host "AKATH_SUPERVISOR=DISPATCH_CONFIRMED target=$target run=$($match.id) status=$($match.status)"
                return [int64]$match.id
              }
              Write-Host "AKATH_SUPERVISOR dispatch-poll=$i target=$target run=NOT_FOUND"
            }
            throw "AKATH_DISPATCH_RUN_ID_NOT_FOUND:$target"
          }

          $runId=Dispatch-Akath 'PC1'
          $status='queued'
          for($i=1;$i -le 6;$i++){
            Start-Sleep -Seconds 5
            $status=gh run view $runId -R $repo --json status --jq '.status'
            Write-Host "AKATH_SUPERVISOR poll=$i run=$runId status=$status"
            if($status -notin @('queued','requested','waiting','pending')){ break }
          }

          if($status -in @('queued','requested','waiting','pending')){
            Write-Host "AKATH_SUPERVISOR=PC1_OFFLINE_FAILOVER"
            gh run cancel $runId -R $repo
            Start-Sleep -Seconds 2
            $fallbackRunId=Dispatch-Akath 'PC2'
            "AKATH_SUPERVISOR=PC1_OFFLINE_FAILOVER_TO_PC2 run=$fallbackRunId" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif($status -eq 'in_progress') {
            "AKATH_SUPERVISOR=PC1_PRIMARY_ACTIVE run=$runId" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "AKATH_SUPERVISOR=PC1_RUN_STATUS_$status run=$runId" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Persist registry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'AX Active Execution Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_ACTIVE_EXECUTIONS.json
          if(git diff --cached --quiet){Write-Host 'No registry mutation'; exit 0}
          git commit -m 'chore: update AX active execution registry'
          for($i=1;$i -le 5;$i++){
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){Write-Host "Registry persistence: PASS attempt=$i"; exit 0}
            Write-Host "Registry persistence: RETRY attempt=$i"
            Start-Sleep -Seconds 2
          }
          throw 'AX_ACTIVE_EXECUTIONS_PUSH_FAILED'
