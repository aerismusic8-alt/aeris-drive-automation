name: AX Control Hub Tests

on:
  push:
    branches: ["feat/ax-control-hub-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run runtime unit tests
        run: python tests/control_hub/runtime_unit_tests.py
