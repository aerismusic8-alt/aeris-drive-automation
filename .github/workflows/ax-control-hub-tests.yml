name: AX Control Hub Tests

on:
  push:
    branches: ["feat/ax-control-hub-foundation", "feat/ax-file-id-persistence"]
  pull_request:
    branches: ["main"]

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run runtime unit tests
        run: python tests/control_hub/runtime_unit_tests.py
      - name: Run runtime integration tests
        run: python tests/control_hub/runtime_integration_tests.py
      - name: Run fresh-process rehydration tests
        run: python tests/master_brain/fresh_channel_rehydration_tests.py
      - name: Run two-runtime portability acceptance
        run: python tests/master_brain/model_runtime_portability_tests.py
      - name: Run source-of-truth conflict acceptance
        run: python tests/master_brain/source_of_truth_conflict_tests.py
      - name: Run File ID Persistence acceptance
        run: python tests/master_brain/file_id_persistence_tests.py
      - name: Run File ID Manifest Builder acceptance
        run: python tests/master_brain/file_id_manifest_builder_tests.py
      - name: Run Continuous Reflection acceptance
        run: python tests/master_brain/continuous_reflection_tests.py
      - name: Run evidence write-back tests
        run: python tests/control_hub/evidence_writeback_tests.py
      - name: Run restart recovery tests
        run: python tests/control_hub/restart_recovery_tests.py
      - name: Run authoritative state write-back acceptance
        run: python tests/control_hub/state_writeback_tests.py
      - name: Run interruption resume acceptance
        run: python tests/control_hub/interruption_resume_tests.py
      - name: Run communication gateway contract tests
        run: python tests/control_hub/communication_gateway_contract_tests.py
      - name: Run communication gateway behavior tests
        run: python tests/control_hub/communication_gateway_tests.py
      - name: Run PC mobile operations surface tests
        run: python tests/control_hub/operations_surface_tests.py
      - name: Run communication gateway E2E acceptance
        run: python tests/control_hub/communication_gateway_e2e_tests.py

  windows-prerequisite-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell runtime prerequisite check
        shell: pwsh
        run: .\AX_CONTROL_HUB\PC_RUNTIME_CHECK.ps1
      - name: Run revenue execution evidence regression
        shell: pwsh
        run: .\tests\AX_AERIS_EXECUTION_EVIDENCE.Tests.ps1
      - name: Run AERIS control runtime evidence gate regression
        shell: pwsh
        run: .\tests\AX_AERIS_CONTROL_RUNTIME_GATE.Tests.ps1
