name: AERIS Runtime Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-runtime-smoke.yml'
      - 'ops/aeris-runtime-smoke-config.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  AERIS_RUNTIME_URL: 'https://aeris-execution-runtime.aerismusic8.workers.dev'
  AERIS_WEBAPP_URL: 'https://script.google.com/macros/s/AKfycbwz6F8EWTD7YwnGkyu4Mq_JHtBkk6nOwl9TYjWDsMsQTtS5EVj3I6hmakuW6yP_YGQH/exec'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ops
          curl --fail-with-body --silent --show-error --max-time 30 "$AERIS_RUNTIME_URL/" > ops/aeris-runtime-root.json
          curl --fail-with-body --silent --show-error --max-time 30 "$AERIS_RUNTIME_URL/oauth/status" > ops/aeris-oauth-status.json
          curl --fail-with-body --silent --show-error --max-time 30 "$AERIS_RUNTIME_URL/apps-script/test" > ops/aeris-apps-script-test.json

      - name: Probe Web App
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 "$AERIS_WEBAPP_URL?mode=status" > ops/aeris-webapp-status.json

      - name: Verify Responses
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'ops/aeris-runtime-root.json',
            'ops/aeris-oauth-status.json',
            'ops/aeris-apps-script-test.json',
            'ops/aeris-webapp-status.json'
          ];
          for (const file of files) {
            const raw = fs.readFileSync(file, 'utf8');
            try { JSON.parse(raw); } catch { throw new Error(`INVALID_JSON:${file}`); }
          }
          const root = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const oauth = JSON.parse(fs.readFileSync(files[1], 'utf8'));
          const test = JSON.parse(fs.readFileSync(files[2], 'utf8'));
          const webapp = JSON.parse(fs.readFileSync(files[3], 'utf8'));
          const report = {
            runtimeStatus: root?.status ?? null,
            runtimeVersion: root?.version ?? null,
            oauthAuthorized: oauth?.authorized === true,
            oauthTokenStored: oauth?.tokenStored === true,
            appsScriptStatus: test?.status ?? null,
            appsScriptVerified: test?.verified === true,
            webAppStatus: webapp?.status ?? null,
            webAppVersion: webapp?.version ?? null
          };
          fs.writeFileSync('ops/aeris-runtime-smoke-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (report.runtimeStatus !== 'ONLINE') throw new Error('RUNTIME_NOT_ONLINE');
          if (report.oauthAuthorized && report.oauthTokenStored && report.appsScriptVerified !== true) {
            console.log('OAUTH_PRESENT_BUT_APPS_SCRIPT_NOT_VERIFIED');
          }
          if (!report.oauthAuthorized || !report.oauthTokenStored) {
            console.log('OAUTH_NOT_AUTHORIZED_OR_NOT_STORED');
          }
          NODE

      - name: Persist Smoke Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/aeris-runtime-root.json ops/aeris-oauth-status.json ops/aeris-apps-script-test.json ops/aeris-webapp-status.json ops/aeris-runtime-smoke-report.json
          git commit -m 'ci: record AERIS runtime smoke evidence' || true
          git push || true
