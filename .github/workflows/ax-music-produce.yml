name: AX Music Produce (continuous raw material)

# Keeps making new songs as raw material for other AIs to build clips from.
#
# K: "งานเพลงต้องสร้างต่อเนื่องไว้เป็นวัตถุดิบให้ ai เอาไปสร้างคลิปด้วยแล้วล่ะ".
#
# Why GitHub Actions and not the OpenHands sandbox: the lyric channel that needs
# no login (Duck.ai) is driven over the cloud desktop's CDP port, so on a bare
# runner it is unreachable — but pollinations is plain HTTP, and the master is
# synthesised with ffmpeg and the cover drawn with PIL, none of which need a
# browser or a credential. So a runner can produce a song on its own. It runs on
# ubuntu-latest (free minutes on a public repo), not the self-hosted Windows box.
#
# This lane is beds, not songs. A Flow Music vocal render needs the signed-in
# desktop, which lives in the sandbox, so it is passed --no-flow and its output is
# labelled `audio: synth-bed` in the catalogue. Before 2026-11-07 the runner ran
# the same command as the sandbox and the two were indistinguishable in the pack,
# so a bed could be shipped as a "song" (K caught it). Real songs come from the
# sandbox loop; this keeps raw material flowing when the desktop is unavailable.
#
# Each run: draft one lyric -> synthesise the bed -> draw the cover -> upload
# the media to the public `media-938` release -> commit the refreshed share
# catalog. No secret beyond the job's own GITHUB_TOKEN, which is why this can
# never be blocked by an expired PAT.

on:
  schedule:
    # Every 4 hours. One item per run is ~6/day, which is more than the release
    # rail consumes, so the material always leads demand — but not so fast that
    # the theme pool (12 themes x 5 variants) empties in a fortnight. GitHub drops
    # a scheduled run when the queue is busy, so a missed tick costs one bed.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: "Songs to produce this run"
        default: "1"

permissions:
  contents: write

concurrency:
  group: ax-music-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg, the SoundFont sampler, and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fluidsynth \
            fluid-soundfont-gm musescore-general-soundfont
          # The offline bed is now real instruments via fluidsynth (K rejected
          # the ffmpeg tone synth as "fake", 2026-11-09); mido writes the MIDI.
          python3 -m pip install --quiet --disable-pip-version-check Pillow mido

      - name: Produce the next bed (no Flow, no login)
        working-directory: music938-1
        env:
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A rejected lyric draft exits 1, which used to skip every step below —
        # the mood render, the publish and the queue merge all live *after* this
        # one, so a bad draft also froze the mood clips (found 2026-11-09: two
        # produce runs failed and the approved clips never reached the release).
        # The draft is raw material, not a gate: let it fail without taking the
        # rest of the run with it.
        continue-on-error: true
        run: |
          set -euo pipefail
          # --pack-only rebuilds the share catalog from the release union; the
          # upload step below then pushes the media. Without it the catalog is
          # never refreshed in CI and a new song never reaches the share pack.
          python3 scripts/produce_loop.py --no-flow \
            --count "${{ github.event.inputs.count || '1' }}" --pack-only

      # The six real-instrument mood clips K approved (2026-11-09). They are
      # deterministic and cost nothing, but re-rendering all six every 4 hours is
      # wasted runner time, so `--once` records what it built in a committed state
      # file and only fills the gaps. Bump STATE_VERSION in the script (or delete
      # the state file) to force a re-render after a renderer change.
      - name: Pull the mood clips already on the release
        # `--once` keys off the clip being on disk, and a fresh checkout has an
        # empty library/, so without this pull every run re-renders all six and
        # re-uploads them. With it, `--once` skips and the run stays cheap.
        env:
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 music938-1/scripts/pull_media.py --only moods

      - name: Render the mood clips (once)
        working-directory: music938-1
        run: |
          set -euo pipefail
          python3 scripts/make_mood_short.py --all --once || \
            echo "mood clips: render skipped or failed; will retry next run"

      - name: Upload the media to the public release
        env:
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 music938-1/scripts/publish_media.py

      - name: Add the mood clips to the crosspost queue
        run: |
          set -euo pipefail
          # --merge-queue appends only new (platform, video) ids, so the pending
          # backlog is never dropped when a new format joins the rotation.
          python3 music938-1/scripts/crosspost.py --merge-queue

      - name: Commit the refreshed share catalog
        run: |
          set -euo pipefail
          git config user.name  "aeris-music-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f share/aeris-music/catalog.json share/aeris-music/catalog.csv
          git add -A music938-1/lyrics music938-1/work/produce-queue.json \
                     music938-1/work/mood-clips-state.json \
                     music938-1/work/crosspost-queue.json \
                     music938-1/library/covers 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "produce: new song + refreshed share catalog"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
