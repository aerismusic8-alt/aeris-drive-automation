name: AX Status Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2

    steps:
      - name: AX Live Status Check
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; Write-Host '=== AX LIVE STATUS MONITOR ==='; Write-Host ('Time: ' + (Get-Date -Format o)); Write-Host ('Computer: ' + $env:COMPUTERNAME); Write-Host ('Runner: ' + $env:RUNNER_NAME); Write-Host ('OS: ' + $env:RUNNER_OS); Write-Host ('Arch: ' + $env:RUNNER_ARCH); Write-Host ('Repository: ' + $env:GITHUB_REPOSITORY); $p=Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command','Start-Sleep -Milliseconds 250' -PassThru -Wait; Write-Host ('PowerShell child PID: ' + $p.Id); Write-Host ('PowerShell child exit code: ' + $p.ExitCode); if ($p.ExitCode -ne 0) { throw 'POWERSHELL_CHILD_EXECUTION_FAILED' }; $headers=@{Authorization=('Bearer ' + $env:GITHUB_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}; $url='https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/actions/runs?per_page=10'; $response=Invoke-RestMethod -Uri $url -Headers $headers -Method Get; Write-Host '=== RECENT WORKFLOW STATUS ==='; foreach($run in $response.workflow_runs){Write-Host ('{0} | {1} | status={2} | conclusion={3} | branch={4}' -f $run.id,$run.name,$run.status,$run.conclusion,$run.head_branch)}; Write-Host ''; Write-Host '=== AX MONITOR RESULT ==='; Write-Host 'GitHub API: ONLINE'; Write-Host 'Workflow Data: RECEIVED'; Write-Host 'Runner Job: EXECUTING'; Write-Host 'PowerShell Child Execution: VERIFIED'; Write-Host '=== AX LIVE STATUS MONITOR COMPLETE ==='"
