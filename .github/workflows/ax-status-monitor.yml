name: AX Status Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: self-hosted

    steps:
      - name: AX Live Status Check
        shell: pwsh
        run: |
          Write-Host "=== AX LIVE STATUS MONITOR ==="
          Write-Host "Time: $(Get-Date -Format o)"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Arch: $env:RUNNER_ARCH"
          Write-Host ""

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = $env:GITHUB_REPOSITORY

          Write-Host "Repository: $repo"
          Write-Host ""

          $url = "https://api.github.com/repos/$repo/actions/runs?per_page=10"

          try {
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            Write-Host "=== RECENT WORKFLOW STATUS ==="
            foreach ($run in $response.workflow_runs) {
              Write-Host ("{0} | {1} | status={2} | conclusion={3} | branch={4}" -f $run.id,$run.name,$run.status,$run.conclusion,$run.head_branch)
            }
            Write-Host ""
            Write-Host "=== AX MONITOR RESULT ==="
            Write-Host "GitHub API: ONLINE"
            Write-Host "Workflow Data: RECEIVED"
            Write-Host "Runner Execution: VERIFIED"
            Write-Host "=== AX LIVE STATUS MONITOR COMPLETE ==="
          } catch {
            Write-Error "AX_STATUS_CHECK_FAILED: $($_.Exception.Message)"
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
