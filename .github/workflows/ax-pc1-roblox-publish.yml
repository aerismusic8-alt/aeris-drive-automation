name: AX PC1 Roblox Publish

# Publishes the built place to Roblox through the Open Cloud API. This is the
# path that needs no Roblox Studio, so it can run entirely from PC1.
#
# Needs, once:
#   - repo secret ROBLOX_API_KEY with the universe-places:write scope
#   - roblox/publish-config.json filled in with universeId and placeId
#
# Until both exist the job reports BLOCKED and passes, so the pipeline stays
# honest and green while the credential is still missing.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Saved (private test) or Published (live)'
        required: true
        default: 'Saved'
        type: choice
        options: [Saved, Published]
      universe_id:
        description: 'Roblox universeId (leave empty to use publish-config.json)'
        required: false
        default: ''
      place_id:
        description: 'Roblox placeId (leave empty to use publish-config.json)'
        required: false
        default: ''
      ref:
        description: 'Git ref to build (branch, tag or SHA)'
        required: false
        default: 'ax-arena-roblox-game'
  # Committing game code used to leave the live place untouched, because this
  # workflow only ran by hand or when the publish script itself changed. The
  # code was on the branch, the tests were green, and players still saw the old
  # game. Publishing now follows a green test run, so a merged change reaches
  # Roblox on its own.
  workflow_run:
    workflows: ["AX Arena Luau Tests"]
    types: [completed]
    branches: [ax-arena-roblox-game]

jobs:
  publish:
    # A red test run must never reach players.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: Verify PC1
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-RGK6JKB') { throw "EXPECTED_PC1:$env:COMPUTERNAME" }
          Write-Host "PC1=VERIFIED"

      - name: Build the place first
        shell: powershell
        run: |
          $ref = '${{ inputs.ref }}'
          if (!$ref) { $ref = '${{ github.event.workflow_run.head_sha }}' }
          if (!$ref) { $ref = $env:GITHUB_SHA }
          Write-Host "BUILD_REF=$ref"
          $url = "https://raw.githubusercontent.com/aerismusic8-alt/aeris-drive-automation/$ref/AX_PC_CONTROL/pc1-roblox-build.ps1"
          $p = Join-Path $env:TEMP "pc1-roblox-build.ps1"
          Invoke-WebRequest -Uri $url -OutFile $p -UseBasicParsing
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p
          if ($LASTEXITCODE -ne 0) { throw "BUILD_EXIT:$LASTEXITCODE" }

      - name: Publish through Open Cloud
        shell: powershell
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ inputs.universe_id }}
          PLACE_ID: ${{ inputs.place_id }}
        run: |
          $ref = '${{ inputs.ref }}'
          if (!$ref) { $ref = '${{ github.event.workflow_run.head_sha }}' }
          if (!$ref) { $ref = $env:GITHUB_SHA }
          $url = "https://raw.githubusercontent.com/aerismusic8-alt/aeris-drive-automation/$ref/AX_PC_CONTROL/pc1-roblox-publish.ps1"
          $p = Join-Path $env:TEMP "pc1-roblox-publish.ps1"
          Invoke-WebRequest -Uri $url -OutFile $p -UseBasicParsing
          $arg = @('-NoProfile','-ExecutionPolicy','Bypass','-File',$p)
          if ('${{ inputs.version_type }}' -eq 'Published') { $arg += '-VersionType'; $arg += 'Published' }
          & powershell.exe @arg
          if ($LASTEXITCODE -ne 0) { throw "PUBLISH_EXIT:$LASTEXITCODE" }

      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc1-roblox-publish-evidence
          path: C:\AX-Runtime\evidence\pc1-roblox-publish.json
          if-no-files-found: warn
