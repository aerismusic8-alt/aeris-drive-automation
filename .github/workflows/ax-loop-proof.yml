name: AX Loop Proof

on:
  workflow_run:
    workflows:
      - AX OpenAI Live Code Stream
      - AX Gemini Live Code Stream
      - AX Independent Chat Gateway
    types: [completed]

permissions:
  contents: write

jobs:
  prove-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify completed AI cycle
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, datetime

          run_id = int(os.environ['RUN_ID'])
          workflow = os.environ['WORKFLOW_NAME']
          conclusion = os.environ['CONCLUSION']
          queue = json.load(open('AX_MULTI_AI_DISPATCH_QUEUE.json', encoding='utf-8'))

          matched = []
          for task in queue.get('tasks', []):
              execution = task.get('execution') or {}
              if execution.get('run_id') == run_id:
                  matched.append(task)

          proof_path = pathlib.Path('AX_LOOP_PROOF.json')
          if proof_path.exists():
              proof = json.load(open(proof_path, encoding='utf-8'))
          else:
              proof = {
                  'schema': 'AX_LOOP_PROOF_V1',
                  'cycles': []
              }

          cycle = {
              'verified_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'workflow_run_id': run_id,
              'workflow': workflow,
              'conclusion': conclusion,
              'matched_tasks': []
          }

          for task in matched:
              execution = task.get('execution') or {}
              target = execution.get('output_file')
              target_exists = bool(target) and pathlib.Path(target).exists()
              cycle['matched_tasks'].append({
                  'task_id': task.get('task_id'),
                  'status': task.get('status'),
                  'executor': execution.get('executor'),
                  'output_file': target,
                  'output_exists': target_exists,
                  'execution_run_id_matches': execution.get('run_id') == run_id
              })

          if conclusion == 'success':
              if not matched:
                  raise SystemExit(f'LOOP_PROOF_FAIL no queue task references workflow_run_id={run_id}')
              for item in cycle['matched_tasks']:
                  if item['status'] != 'COMPLETED' or not item['execution_run_id_matches'] or not item['output_exists']:
                      raise SystemExit(f"LOOP_PROOF_FAIL invalid completion evidence: {item}")
              cycle['result'] = 'PASS'
          else:
              cycle['result'] = 'FAILURE_OBSERVED'

          proof['cycles'].append(cycle)
          proof['cycles'] = proof['cycles'][-50:]
          proof['last_verified_cycle'] = cycle
          proof['loop_condition'] = {
              'queue_has_ready_work': any(t.get('enabled') is True and t.get('status') == 'READY' for t in queue.get('tasks', [])),
              'completed_cycles': sum(1 for c in proof['cycles'] if c.get('result') == 'PASS'),
              'multi_cycle_pass': sum(1 for c in proof['cycles'] if c.get('result') == 'PASS') >= 2
          }
          json.dump(proof, open(proof_path, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          open(proof_path, 'a', encoding='utf-8').write('\n')
          print(json.dumps(cycle, indent=2, ensure_ascii=False))
          print(json.dumps(proof['loop_condition'], indent=2))
          PY

      - name: Persist loop proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AX Loop Proof'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_LOOP_PROOF.json
          if git diff --cached --quiet; then
            echo 'AX_LOOP_PROOF_NO_CHANGE'
            exit 0
          fi
          git commit -m "chore: record AX verified AI loop proof run=${{ github.event.workflow_run.id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "AX_LOOP_PROOF_WRITEBACK_VERIFIED run=${{ github.event.workflow_run.id }}"
