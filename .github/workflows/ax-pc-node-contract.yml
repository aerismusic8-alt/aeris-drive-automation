name: AX PC Node Contract

on:
  push:
    paths:
      - 'AX_PC_CONTROL/AX_PC_NODE.ps1'
      - 'tests/AX_PC_NODE_CONTRACT.Tests.ps1'
      - '.github/workflows/ax-pc-node-contract.yml'
  pull_request:
    paths:
      - 'AX_PC_CONTROL/AX_PC_NODE.ps1'
      - 'tests/AX_PC_NODE_CONTRACT.Tests.ps1'
      - '.github/workflows/ax-pc-node-contract.yml'
  workflow_dispatch:

jobs:
  contract-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AX PC Node contract regression test
        shell: pwsh
        run: ./tests/AX_PC_NODE_CONTRACT.Tests.ps1
