name: AX Agent Execution Contract

on:
  push:
    paths:
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_ROUTING_BRIDGE.ps1'
      - 'AX_AGENT_ROUTE_GATE.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_AGENT_EXECUTION_CONTRACT.Tests.ps1'
  pull_request:
    paths:
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_ROUTING_BRIDGE.ps1'
      - 'AX_AGENT_ROUTE_GATE.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_AGENT_EXECUTION_CONTRACT.Tests.ps1'
  workflow_dispatch:

jobs:
  execution-contract-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify helper execution truth contract
        shell: pwsh
        run: ./tests/AX_AGENT_EXECUTION_CONTRACT.Tests.ps1
