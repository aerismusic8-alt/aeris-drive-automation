name: PC2 AI Smoke Test

on:
  push:
    paths:
      - '.github/workflows/pc2-ai-smoke-test.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 3
    steps:
      - name: Execute simple AI task on PC2
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = [ordered]@{
            task = 'PC2_AI_SMOKE_TEST'
            message = 'AX test task executed successfully on PC2'
            runner = $env:COMPUTERNAME
            timestamp_utc = [DateTime]::UtcNow.ToString('o')
            powershell = $PSVersionTable.PSVersion.ToString()
          }
          $json = $result | ConvertTo-Json -Compress
          Write-Host "RESULT=$json"
          $json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:COMPUTERNAME) { exit 0 } else { exit 1 }
