name: AX Code Backup
on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.gs'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.py'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.cmd'
      - '**/*.bat'
      - '**/*.ini'
      - '**/*.toml'
permissions:
  contents: read
jobs:
  backup:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Backup code before next mutation
        shell: powershell
        run: |
          & "$PWD\AX_CODE_BACKUP.ps1" -SourceRoot "$PWD"
      - name: Verify backup evidence
        shell: powershell
        run: |
          $root='C:\AERIS\AX\08_EMERGENCY_BACKUP\CODE'
          $latest=Get-ChildItem $root -Filter '*.manifest.json' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $latest){throw 'CODE_BACKUP_EVIDENCE_MISSING'}
          Write-Host "AX_CODE_BACKUP_PIPELINE=PASS latest=$($latest.FullName)"
