name: AX Self-Hosted PowerShell Hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: ax-self-hosted-powershell-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate self-hosted Windows PowerShell policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          let bad = [];
          for (const file of fs.readdirSync('.github/workflows')) {
            if (!/\.ya?ml$/.test(file) || file === 'ax-self-hosted-powershell-hardening.yml') continue;
            const p = path.join('.github/workflows', file);
            const text = fs.readFileSync(p, 'utf8');
            if (!/runs-on:\s*.*self-hosted|runs-on:\s*\[self-hosted/.test(text)) continue;
            if (/^\s*shell:\s*powershell\s*$/m.test(text) || /^\s*shell:\s*powershell\s+-NoProfile\s*$/m.test(text)) {
              bad.push(`${p}: explicit PowerShell shell is missing ExecutionPolicy Bypass`);
            }
            const explicitPwsh = /^\s*shell:\s*powershell[^\n]*$/gm;
            for (const match of text.matchAll(explicitPwsh)) {
              if (!/ExecutionPolicy\s+Bypass/.test(match[0])) bad.push(`${p}: ${match[0].trim()}`);
            }
          }
          if (bad.length) {
            console.error('SELF_HOSTED_POWERSHELL_NOT_HARDENED');
            for (const item of bad) console.error(item);
            process.exit(1);
          }
          console.log('SELF_HOSTED_POWERSHELL_HARDENING_SOURCE_GUARD=PASS');
          NODE

      - name: Report repository hardening state
        shell: bash
        run: |
          set -euo pipefail
          echo 'AX_WORKFLOW_HARDENING_PERSISTENCE=NOT_REQUIRED'
          echo 'AX_WORKFLOW_HARDENING_PERMISSION_NOTE=This guard intentionally does not push .github/workflows because the available GitHub App token lacks workflows permission.'
