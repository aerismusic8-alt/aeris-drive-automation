name: AX PC2 Local Dispatch E2E

# Free-first pcsev path: AX dispatcher -> PC2 -> local executor -> verify -> write-back.
# Apps Script / external control APIs are excluded from this critical path.
# Verification refresh trigger: run after proof-gate regression fixes.
# PC2 E2E refresh: force a fresh main-branch verification run.

on:
  push:
    branches: [main]
    paths:
      - 'AX_PC_CONTROL/AX_PC2_LOCAL_DISPATCHER.ps1'
      - 'AX_PC_CONTROL/AX_PC2_LOCAL_EXECUTOR_E2E.ps1'
      - '.github/workflows/ax-pc2-local-dispatch-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax-pc2-local-dispatch
  cancel-in-progress: false

jobs:
  pc2-local-dispatch:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AX_EXPECTED_PC2: DESKTOP-O0AUKHG
      AX_DISPATCH_JOB_ID: AX-PC2-DISPATCH-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify PC2 dispatcher identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne $env:AX_EXPECTED_PC2) { throw 'PC2_DISPATCHER_IDENTITY_MISMATCH' }
          $dispatcher = Join-Path $env:GITHUB_WORKSPACE 'AX_PC_CONTROL\AX_PC2_LOCAL_DISPATCHER.ps1'
          if (-not (Test-Path $dispatcher)) { throw 'PC2_LOCAL_DISPATCHER_MISSING' }
          if ([string]::IsNullOrWhiteSpace($env:AX_DISPATCH_JOB_ID)) { throw 'DISPATCH_JOB_ID_MISSING' }
          Write-Host 'PC2_DISPATCHER_IDENTITY=VERIFIED'
          Write-Host 'PC2_LOCAL_DISPATCHER_FILE=FOUND'
          Write-Host "DISPATCH_JOB=$env:AX_DISPATCH_JOB_ID"

      - name: AX dispatch to PC2 and verify write-back
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $dispatcher = Join-Path $env:GITHUB_WORKSPACE 'AX_PC_CONTROL\AX_PC2_LOCAL_DISPATCHER.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $dispatcher -JobId $env:AX_DISPATCH_JOB_ID
          if ($LASTEXITCODE -ne 0) { throw "AX_PC2_DISPATCHER_EXIT:$LASTEXITCODE" }
          Write-Host 'AX_DISPATCH_GATE=VERIFIED'

      - name: Verify final dispatch proof
        if: ${{ always() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $dispatchDir = 'C:\AX-Runtime\dispatch'
          $jobId = $env:AX_DISPATCH_JOB_ID
          $recordPath = Join-Path $dispatchDir "$jobId.json"
          if (-not (Test-Path $recordPath)) { throw "DISPATCH_RECORD_MISSING:$recordPath" }
          $data = Get-Content $recordPath -Raw | ConvertFrom-Json
          if ($data.jobId -ne $jobId) { throw "DISPATCH_JOB_MISMATCH:$($data.jobId)" }
          if ($data.targetNode -ne 'PC2') { throw "DISPATCH_NODE_MISMATCH:$($data.targetNode)" }
          if ($data.dispatchStatus -ne 'COMPLETED') { throw "DISPATCH_NOT_COMPLETED:$($data.dispatchStatus)" }
          if ($data.verified -ne $true) { throw 'DISPATCH_RESULT_NOT_VERIFIED' }
          if (-not $data.proof) { throw 'DISPATCH_PROOF_REFERENCE_MISSING' }
          if (-not (Test-Path $data.proof)) { throw "DISPATCH_PROOF_MISSING:$($data.proof)" }
          $proofData = Get-Content $data.proof -Raw | ConvertFrom-Json
          if ($proofData.jobId -ne $jobId) { throw "PROOF_JOB_MISMATCH:$($proofData.jobId)" }
          if ($proofData.nodeId -ne 'PC2') { throw "PROOF_NODE_MISMATCH:$($proofData.nodeId)" }
          if ($proofData.verified -ne $true) { throw 'PROOF_NOT_VERIFIED' }
          Write-Host "DISPATCH_RECORD=$recordPath"
          Write-Host "DISPATCH_JOB=$jobId"
          Write-Host 'DISPATCH_ACCEPTED=VERIFIED'
          Write-Host 'PC2_EXECUTED=VERIFIED'
          Write-Host 'RESULT_VERIFIED=VERIFIED'
          Write-Host 'STATE=COMPLETED'
          Write-Host 'WRITE_BACK=VERIFIED'
          Write-Host 'PROOF=VERIFIED'
