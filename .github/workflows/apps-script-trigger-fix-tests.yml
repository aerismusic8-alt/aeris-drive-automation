name: AERIS Apps Script Trigger Fix Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apps-script-oauth-bridge/**'
      - '.github/workflows/apps-script-trigger-fix-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run OAuth bridge tests
        working-directory: tools/apps-script-oauth-bridge
        run: node --test tests/*.test.mjs
