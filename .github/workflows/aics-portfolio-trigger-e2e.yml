name: AICS Portfolio Trigger E2E

on:
  push:
    paths:
      - 'AX_AICS_PORTFOLIO_TRIGGER.ps1'
      - 'tests/AX_AICS_PORTFOLIO_TRIGGER_TEST.ps1'
      - '.github/workflows/aics-portfolio-trigger-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-e2e:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run AX-only portfolio trigger E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD/tests/AX_AICS_PORTFOLIO_TRIGGER_TEST.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
