name: AICS Portfolio Trigger E2E

on:
  push:
    paths:
      - 'AX_AICS_PORTFOLIO_TRIGGER.ps1'
      - 'tests/AX_AICS_PORTFOLIO_TRIGGER_TEST.ps1'
      - '.github/workflows/aics-portfolio-trigger-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run AX-only portfolio trigger E2E
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$PWD/tests/AX_AICS_PORTFOLIO_TRIGGER_TEST.ps1" 2>&1 | Tee-Object -FilePath "$PWD/trigger-test.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Upload trigger diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aics-portfolio-trigger-diagnostics
          path: |
            trigger-test.log
            AX_AICS_PORTFOLIO_STATE.json
          if-no-files-found: ignore
