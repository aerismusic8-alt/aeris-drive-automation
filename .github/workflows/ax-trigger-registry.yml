name: AX Trigger Registry
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'AX_TRIGGER_REGISTRY.ps1'
      - '.github/workflows/ax-trigger-registry.yml'
permissions:
  contents: write
concurrency:
  group: ax-trigger-registry-main
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Register AX runtime heartbeat
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%CD%\AX_TRIGGER_REGISTRY.ps1" -TriggerId "github-trigger-registry" -Source "github-actions-self-hosted" -Event "heartbeat" -Status "ACTIVE" -Result "heartbeat_ok"
      - name: Verify registry
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$x=Get-Content -Raw '%CD%\AX_TRIGGER_REGISTRY.json'|ConvertFrom-Json; if($x.schema -ne 'AX_TRIGGER_REGISTRY_V1'){throw 'REGISTRY_SCHEMA_FAIL'}; if([int]$x.triggerCount -lt 1){throw 'REGISTRY_EMPTY'}; Write-Host ('TRIGGER_REGISTRY PASS count=' + $x.triggerCount)"
      - name: Persist registry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'AX Trigger Registry'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_TRIGGER_REGISTRY.json
          if(git diff --cached --quiet){Write-Host 'No trigger registry mutation'; exit 0}

          git stash push -u -m 'ax-trigger-registry-generated-state'
          git fetch origin main
          git rebase origin/main
          git stash pop

          if(git diff --name-only --diff-filter=U){
            git checkout --theirs -- AX_TRIGGER_REGISTRY.json 2>$null
            git add AX_TRIGGER_REGISTRY.json
          }

          if(git diff --cached --quiet){
            git add AX_TRIGGER_REGISTRY.json
          }
          if(git diff --cached --quiet){Write-Host 'No trigger registry mutation after rebase'; exit 0}
          git commit -m 'chore: persist AX trigger heartbeat'

          for($attempt=1;$attempt -le 3;$attempt++){
            git fetch origin main
            $behind = git rev-list --count HEAD..origin/main
            if([int]$behind -gt 0){ git rebase origin/main }
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){ Write-Host "AX_TRIGGER_REGISTRY_PUSH=PASS attempt=$attempt"; exit 0 }
            if($attempt -eq 3){ throw 'AX_TRIGGER_REGISTRY_PUSH_FAILED_AFTER_RETRIES' }
            Start-Sleep -Seconds 2
          }
