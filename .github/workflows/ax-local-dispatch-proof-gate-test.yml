name: AX Local Dispatch Proof Gate Test

on:
  push:
    branches: [main]
    paths:
      - 'AX_PC_CONTROL/tests/Test-LocalDispatchProofGate.ps1'
      - '.github/workflows/ax-pc2-local-dispatch-e2e.yml'
      - '.github/workflows/ax-local-dispatch-proof-gate-test.yml'
  pull_request:
    paths:
      - 'AX_PC_CONTROL/tests/Test-LocalDispatchProofGate.ps1'
      - '.github/workflows/ax-pc2-local-dispatch-e2e.yml'
      - '.github/workflows/ax-local-dispatch-proof-gate-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-gate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run regression test
        shell: pwsh
        run: ./AX_PC_CONTROL/tests/Test-LocalDispatchProofGate.ps1
