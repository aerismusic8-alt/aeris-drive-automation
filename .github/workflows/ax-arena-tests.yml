name: AX Arena Luau Tests

on:
  push:
    paths:
      - 'roblox/**'
      - 'scripts/test-roblox.sh'
      - 'scripts/install-luau.sh'
      - '.github/workflows/ax-arena-tests.yml'
  pull_request:
    paths:
      - 'roblox/**'
      - 'scripts/test-roblox.sh'
      - 'scripts/install-luau.sh'
      - '.github/workflows/ax-arena-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Needed to dispatch the publish workflow once the tests pass. A push alone
  # never reached Roblox, which is why the live place lagged the branch.
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Luau
        run: bash scripts/install-luau.sh

      - name: Syntax check Roblox glue
        run: |
          set -euo pipefail
          ./tools/luau/luau-compile --binary roblox/src/server/init.server.luau > /dev/null
          ./tools/luau/luau-compile --binary roblox/src/client/init.client.luau > /dev/null
          echo "syntax OK"

      - name: Run shared logic tests
        run: ./tools/luau/luau roblox/tests/run.luau

      - name: Run integration tests
        run: ./tools/luau/luau roblox/tests/integration.luau

      - name: Check client, HUD and server agree on names
        run: python3 scripts/check-hud-wiring.py

      # Green tests are the gate for the live place. The publish workflow used
      # to run only by hand, so a merge could sit on the branch while players
      # saw the old game. Dispatching it here keeps that from happening again.
      - name: Publish the place when the tests pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/ax-arena-roblox-game'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed dispatch must not fail the tests. The tests answer "is the
          # code good"; a dispatch is a side effect, and letting it turn the run
          # red hides the answer the run exists to give.
          #
          # The target is also checked first. Dispatching a workflow that is not
          # on the default branch returns 404, and that is the case here, so an
          # unguarded dispatch would fail on every push to this branch.
          set -uo pipefail
          TARGET=ax-pc1-roblox-publish.yml
          if ! gh api "repos/${{ github.repository }}/actions/workflows/$TARGET" >/dev/null 2>&1; then
            echo "DISPATCH=SKIPPED reason=$TARGET_not_on_default_branch"
            exit 0
          fi
          gh workflow run "$TARGET" \
            --ref "${{ github.ref_name }}" \
            -f version_type=Published \
            -f ref="${{ github.sha }}" \
            && echo "DISPATCHED=$TARGET ref=${{ github.sha }}" \
            || echo "DISPATCH=SKIPPED reason=dispatch_failed"
