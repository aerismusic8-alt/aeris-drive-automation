name: AX Arena Luau Tests

on:
  push:
    paths:
      - 'roblox/**'
      - 'roblox-garden/**'
      - 'scripts/test-roblox.sh'
      - 'scripts/install-luau.sh'
      - '.github/workflows/ax-arena-tests.yml'
  pull_request:
    paths:
      - 'roblox/**'
      - 'roblox-garden/**'
      - 'scripts/test-roblox.sh'
      - 'scripts/install-luau.sh'
      - '.github/workflows/ax-arena-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Needed to dispatch the publish workflow once the tests pass. A push alone
  # never reached Roblox, which is why the live place lagged the branch.
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Luau
        run: bash scripts/install-luau.sh

      - name: Syntax check Roblox glue
        run: |
          set -euo pipefail
          ./tools/luau/luau-compile --binary roblox/src/server/init.server.luau > /dev/null
          ./tools/luau/luau-compile --binary roblox/src/client/init.client.luau > /dev/null
          echo "syntax OK"

      - name: Run shared logic tests
        run: ./tools/luau/luau roblox/tests/run.luau

      - name: Run integration tests
        run: ./tools/luau/luau roblox/tests/integration.luau

      - name: Run quest and balance tests
        run: |
          ./tools/luau/luau roblox/tests/quests.luau
          ./tools/luau/luau roblox/tests/layout.luau
          ./tools/luau/luau roblox/tests/balance.luau

      # AX Garden Legends is the current game. Its whole loop is pure arithmetic
      # on a timestamp, so the suite needs no shim: it plants, fast-forwards eight
      # hours, and asserts the crop ripened. A garden that does not grow while the
      # player is away has no retention mechanic at all.
      - name: Run AX Garden Legends tests
        run: ./tools/luau/luau roblox-garden/tests/run.luau

      # Breachline had no test suite at all, so its round loop had never been run
      # outside Roblox Studio. This suite boots the real match layer under the
      # engine shim and plays a round through the real remotes.
      - name: Run Breachline runtime tests
        run: |
          python3 scripts/gen-roblox-sources.py breachline/tests/.generated/Sources.luau --src breachline/src/breachline-uncompressed --overlay breachline/overlay
          ./tools/luau/luau breachline/tests/runtime.luau

      # Boots the real server, builds the real world and loads the real client
      # under a headless engine shim. The unit, integration, quest and balance
      # suites all passed while the game was unplayable, because none of them
      # executed World.luau, init.server.luau or the client. This one does.
      - name: Generate Roblox source bundle
        run: python3 scripts/gen-roblox-sources.py

      - name: Run runtime tests
        run: ./tools/luau/luau roblox/tests/runtime.luau

      - name: Check client, HUD and server agree on names
        run: python3 scripts/check-hud-wiring.py

      # The lighting fix is one line in the project file and one in World.luau,
      # so it can be undone while tuning the look on a fast machine. That is the
      # bug that made the world render black on an Intel HD adapter, which is
      # the hardware the mobile players this game targets are closest to.
      - name: Keep the game renderable on low-end hardware
        run: python3 scripts/check-low-end-lighting.py

      # Publishing is deliberately not dispatched from here.
      #
      # This workflow answers "is the code good" and runs on every push, as does
      # the shipping pipeline. That pipeline runs this same suite as its first
      # job and publishes only when it passes, so the gate holds without a
      # cross-workflow dispatch.
      #
      # A dispatch from here was also the wrong shape. The target has to exist
      # on the default branch to be dispatchable, and ax-pc1-roblox-publish.yml
      # is a PC1-bound workflow, so every push queued a job that can never run
      # while PC1 is down. Those jobs pile up and the publish they were meant to
      # trigger does not happen.
