name: AX Independent Chat Gateway

on:
  push:
    branches: [main]
    paths:
      - 'AX_CONTROL_HUB/**'
      - 'AX_MULTI_AI_DISPATCH_QUEUE.json'
      - 'cloudflare/ax-control-runtime/src/gemini-adapter.ts'
      - 'cloudflare/ax-control-runtime/src/gemini-router.ts'
      - 'tests/control_hub/ax_independent_chat_gateway_tests.py'
      - '.github/workflows/ax-independent-chat-gateway.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control-hub-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run AX independent chat gateway acceptance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tests/control_hub/ax_independent_chat_gateway_tests.py

      - name: Resolve READY Cloudflare Gemini task
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          q=json.load(open('AX_MULTI_AI_DISPATCH_QUEUE.json',encoding='utf-8'))
          t=next((x for x in sorted(q.get('tasks',[]), key=lambda x:x.get('priority',0), reverse=True)
                  if x.get('provider')=='GEMINI_CLOUDFLARE' and x.get('enabled') is True and x.get('status')=='READY'), None)
          if not t:
              print('AX_GEMINI_CLOUDFLARE_NO_READY_TASK')
              open('AX_CF_NO_TASK','w').write('1')
          else:
              open('AX_CF_TASK_ID','w').write(str(t['task_id']))
              open('AX_CF_TARGET','w').write(str(t['file']))
              open('AX_CF_PROMPT.txt','w',encoding='utf-8').write(str(t['prompt']))
              print(f"AX_GEMINI_CLOUDFLARE_TASK_READY task={t['task_id']} file={t['file']}")
          PY

      - name: Run Gemini through Cloudflare adapter path
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f AX_CF_NO_TASK ]]; then exit 0; fi
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY_MISSING'; exit 1; }
          cd cloudflare/ax-control-runtime
          npm install --no-audit --no-fund
          cd ../..
          cat > AX_CF_RUNNER.mjs <<'EOF'
          const fs = await import('node:fs');
          const path = await import('node:path');
          const { generateGeminiText } = await import('./cloudflare/ax-control-runtime/src/gemini-adapter.ts');
          const prompt = fs.readFileSync('AX_CF_PROMPT.txt','utf8');
          const result = await generateGeminiText({ apiKey: process.env.GEMINI_API_KEY, prompt });
          if (!result.ok) throw new Error(result.error);
          const target = fs.readFileSync('AX_CF_TARGET','utf8').trim();
          fs.mkdirSync(path.dirname(target), {recursive:true});
          fs.writeFileSync(target, result.text.trimEnd() + '\n', 'utf8');
          console.log(`AX_GEMINI_CLOUDFLARE_CODE_PASS task=${fs.readFileSync('AX_CF_TASK_ID','utf8').trim()} file=${target}`);
          EOF
          npx --yes tsx AX_CF_RUNNER.mjs
          test -s "$(cat AX_CF_TARGET)"
          echo "AX_GEMINI_CLOUDFLARE_OUTPUT_VERIFIED file=$(cat AX_CF_TARGET)"

      - name: Persist Cloudflare Gemini result and complete task
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f AX_CF_NO_TASK ]]; then exit 0; fi
          task_id=$(cat AX_CF_TASK_ID)
          target=$(cat AX_CF_TARGET)
          python - <<'PY'
          import json,os
          p='AX_MULTI_AI_DISPATCH_QUEUE.json'
          q=json.load(open(p,encoding='utf-8'))
          task_id=open('AX_CF_TASK_ID',encoding='utf-8').read().strip()
          target=open('AX_CF_TARGET',encoding='utf-8').read().strip()
          for t in q.get('tasks',[]):
              if t.get('task_id')==task_id:
                  t['status']='COMPLETED'
                  t['execution']={'workflow':'ax-independent-chat-gateway.yml','run_id':int(os.environ['GITHUB_RUN_ID']),'executor':'GEMINI_CLOUDFLARE','output_file':target}
          q['updated_at']=__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
          json.dump(q,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False); open(p,'a',encoding='utf-8').write('\n')
          PY
          git config user.name 'AX Gemini Cloudflare Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target" AX_MULTI_AI_DISPATCH_QUEUE.json
          rm -f AX_CF_RUNNER.mjs AX_CF_TASK_ID AX_CF_TARGET AX_CF_PROMPT.txt AX_CF_NO_TASK
          git add -- AX_CF_RUNNER.mjs AX_CF_TASK_ID AX_CF_TARGET AX_CF_PROMPT.txt AX_CF_NO_TASK
          git commit -m "chore: persist Cloudflare Gemini task=$task_id run=$GITHUB_RUN_ID"
          git push origin HEAD:main
          echo "AX_GEMINI_CLOUDFLARE_WRITEBACK_VERIFIED task=$task_id file=$target run=$GITHUB_RUN_ID"
