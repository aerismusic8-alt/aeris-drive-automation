name: AKATH Autonomous Runtime

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Execution target'
        required: false
        default: 'PC1'
        type: choice
        options:
          - PC1
          - PC2
      task_id:
        description: 'AX task identifier'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: akath-runtime-${{ inputs.target || 'PC1' }}
  cancel-in-progress: false

env:
  AKATH_TARGET: ${{ inputs.target || 'PC1' }}
  AKATH_TASK_ID: ${{ inputs.task_id || '' }}

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64, "${{ inputs.target == 'PC2' && 'PC2-CODING-EXECUTOR' || 'PC1-AUTONOMOUS-EXECUTOR' }}"]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record execution target
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          "AKATH_TARGET=$env:AKATH_TARGET" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_TASK_ID=$env:AKATH_TASK_ID" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_RUNNER=$env:COMPUTERNAME" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Discover existing Python runtime
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Get-Command py.exe -ErrorAction SilentlyContinue).Source,
            (Get-Command python.exe -ErrorAction SilentlyContinue).Source,
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python310\python.exe",
            "$env:USERPROFILE\.local\bin\python.exe",
            "C:\Python313\python.exe",
            "C:\Python312\python.exe",
            "C:\Python311\python.exe",
            "C:\Python310\python.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $python = $candidates | Select-Object -First 1
          if (-not $python) {
            $python = Get-ChildItem -Path @("$env:LOCALAPPDATA\Programs\Python", "$env:USERPROFILE\AppData\Local\Programs\Python", "C:\Python") -Filter python.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $python) { throw 'PYTHON_RUNTIME_NOT_FOUND' }
          $pythonDir = Split-Path -Parent $python
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run runner health policy tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest AKATH.tests.runner_health_policy_tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run AKATH worker with canonical Brain rehydration
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          AKATH_RUNTIME_ID: akath-primary
          AKATH_PROBE_MODE: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/AKATH/runtime/akath_worker.ps1" -ProbeMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify persisted runtime state and A rehydration
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $stateDir = if ($env:AKATH_STATE_DIR) { $env:AKATH_STATE_DIR } else { Join-Path $HOME '.akath/runtime' }
          $statePath = Join-Path $stateDir 'runtime-state.json'
          if (-not (Test-Path -LiteralPath $statePath)) { throw 'AKATH_STATE_MISSING' }
          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          if ($state.state -ne 'VERIFIED') { throw "AKATH_STATE_NOT_VERIFIED:$($state.state)" }
          if ($state.verification_status -ne 'VERIFIED') { throw 'AKATH_VERIFICATION_MISSING' }
          if ([string]::IsNullOrWhiteSpace($state.evidence_ref)) { throw 'AKATH_EVIDENCE_REF_MISSING' }
          $evidence = Get-Content -Raw -LiteralPath $state.evidence_ref | ConvertFrom-Json
          if ($evidence.rehydration.rehydration_status -ne 'VERIFIED') { throw 'AKATH_REHYDRATION_NOT_VERIFIED' }
          if ($evidence.rehydration.identity -ne 'A') { throw 'AKATH_IDENTITY_NOT_A' }
          if ($evidence.rehydration.execution_authorized -ne $false) { throw 'AKATH_REHYDRATION_AUTHORITY_BYPASS' }
          "AKATH_STATE=$($state.state)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_RUN_ID=$($state.run_id)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_JOB_ID=$($state.job_id)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_REHYDRATION=$($evidence.rehydration.rehydration_status)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_IDENTITY=$($evidence.rehydration.identity)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_EVIDENCE=$($state.evidence_ref)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run adapter acceptance test
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python "$env:GITHUB_WORKSPACE/AKATH/tests/rehydration_adapter_tests.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
