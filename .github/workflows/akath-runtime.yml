name: AKATH Autonomous Runtime

on:
  push:
    branches: [main]
    paths:
      - 'AKATH/**'
      - 'AX_MASTER_BRAIN/**'
      - '.github/workflows/akath-runtime.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: akath-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run AKATH worker with canonical Brain rehydration
        shell: pwsh
        env:
          AKATH_RUNTIME_ID: akath-primary
          AKATH_PROBE_MODE: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/AKATH/runtime/akath_worker.ps1" -ProbeMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify persisted runtime state and A rehydration
        shell: pwsh
        run: |
          $stateDir = if ($env:AKATH_STATE_DIR) { $env:AKATH_STATE_DIR } else { Join-Path $HOME '.akath/runtime' }
          $statePath = Join-Path $stateDir 'runtime-state.json'
          if (-not (Test-Path -LiteralPath $statePath)) { throw 'AKATH_STATE_MISSING' }
          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          if ($state.state -ne 'VERIFIED') { throw "AKATH_STATE_NOT_VERIFIED:$($state.state)" }
          if ($state.verification_status -ne 'VERIFIED') { throw 'AKATH_VERIFICATION_MISSING' }
          if ([string]::IsNullOrWhiteSpace($state.evidence_ref)) { throw 'AKATH_EVIDENCE_REF_MISSING' }
          $evidence = Get-Content -Raw -LiteralPath $state.evidence_ref | ConvertFrom-Json
          if ($evidence.rehydration.rehydration_status -ne 'VERIFIED') { throw 'AKATH_REHYDRATION_NOT_VERIFIED' }
          if ($evidence.rehydration.identity -ne 'A') { throw 'AKATH_IDENTITY_NOT_A' }
          if ($evidence.rehydration.execution_authorized -ne $false) { throw 'AKATH_REHYDRATION_AUTHORITY_BYPASS' }
          "AKATH_STATE=$($state.state)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "AKATH_RUN_ID=$($state.run_id)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "AKATH_JOB_ID=$($state.job_id)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "AKATH_REHYDRATION=$($evidence.rehydration.rehydration_status)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "AKATH_IDENTITY=$($evidence.rehydration.identity)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "AKATH_EVIDENCE=$($state.evidence_ref)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run adapter acceptance test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python "$env:GITHUB_WORKSPACE/AKATH/tests/rehydration_adapter_tests.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
