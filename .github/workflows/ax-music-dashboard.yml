name: AX Music Daily Dashboard

# Writes the AERIS Music dashboard once a day and commits it, so progress is
# visible without a sandbox and without a signed-in browser.
#
# Why here and not the OpenHands "AX Music Marketing Daily" automation: that one
# needs a provisioned sandbox, and provisioning is its failure mode (see
# ax-music-release.yml). This job needs only the YouTube Data API and a git push,
# so it runs forever for free.
#
# Scope note: the YouTube refresh token carries only `.../auth/youtube`, which
# covers channel + video statistics (subs, views, likes, comments). It does NOT
# cover the YouTube Analytics API, so watch-hours and per-video retention are not
# here — those need Studio or an Analytics-scope token. This is the statistics
# dashboard; the promo brief it writes is what the weekly strategy pass reads.

on:
  schedule:
    # 08:30 UTC: the release job spends most of the day's 10,000 Data API units
    # at 07:00, and the quota resets at 08:00 Pacific-midnight (07:00 UTC in
    # winter). Running before that reset made channels.list return quotaExceeded.
    #
    # Three ticks so a single dropped GitHub tick does not lose the day. The job
    # is idempotent: it commits only when a number changed and re-pushes the same
    # headline, so a repeat run costs one API read and nothing else.
    - cron: '30 8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ax-music-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        # The four-surface report reads Facebook/TikTok/Shopee through a browser
        # (social_stats.py). Best effort: a failure here must not stop the
        # YouTube numbers, which are the rail's main job.
        run: |
          set -euo pipefail
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium || true

      - name: Write the dashboard
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          AERIS_STORAGE_STATE_B64: ${{ secrets.AERIS_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          # A spent Data API quota must not fail the job: PROGRESS.md still has
          # the last known numbers, and the ntfy push below is the point.
          python3 music938-1/scripts/market.py --root "$GITHUB_WORKSPACE" --channel ch3 \
            || echo "market.py skipped (quota or transient API error)"
          python3 music938-1/scripts/progress.py --root "$GITHUB_WORKSPACE"
          # The four-surface report (YouTube + FB + TikTok + Shopee). Shopee's
          # dashboard answers a fresh browser with a captcha, so it usually falls
          # back to the last reading the desktop captured — labelled, not blank.
          python3 aeris938-2/scripts/report.py \
            || echo "report.py skipped (desktop/CDP unavailable)"
          # The daily judge: reads the history report.py just wrote and names the
          # one constraint blocking revenue. Exits 0 on bad news by design.
          python3 aeris938-2/scripts/goal_watch.py --no-push \
            || echo "goal_watch.py skipped"

      - name: Commit the dashboard
        run: |
          set -euo pipefail
          git config user.name  "ax-music-dashboard"
          git config user.email "ax-music-dashboard@users.noreply.github.com"
          git add music938-1/work/market-report.md music938-1/work/market-snapshot.json \
                  music938-1/channel/PROGRESS.md \
                  aeris938-2/work/growth-report.md aeris938-2/work/history.jsonl \
                  aeris938-2/work/goal-watch.md
          if git diff --cached --quiet; then
            echo "no change to record"
            exit 0
          fi
          git commit -m "data(music): daily dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      # Push the goal headline to K's phone so progress toward $500 is seen
      # without opening the repo. goal_watch.py owns the message: it carries the
      # commission, both gate counts and the named constraint. ntfy is free and
      # needs no account; the topic is the same AX_NTFY_TOPIC the watchdog uses.
      - name: Notify K on ntfy
        if: always()
        env:
          TOPIC: ${{ vars.AX_NTFY_TOPIC }}
        run: |
          set -euo pipefail
          [ -n "${TOPIC:-}" ] || { echo "no AX_NTFY_TOPIC set"; exit 0; }
          AX_NTFY_TOPIC="$TOPIC" python3 aeris938-2/scripts/goal_watch.py \
            || echo "goal_watch push failed (non-fatal)"
