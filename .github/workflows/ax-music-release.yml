name: AX Music Daily Release (Actions fallback)

# Uploads the day's batch of music938-1 songs to AERIS Music (ch3) and schedules
# them across the day with YouTube's own publishAt.
#
# Why this exists next to the OpenHands "AX Music Daily Release" automation: that
# automation runs on a provisioned sandbox, and provisioning is its failure mode.
# Five consecutive runs died with "Timed out: Sandbox not available" and the
# platform auto-paused it. GitHub Actions needs no sandbox, and this repository is
# public so the minutes are free. This is the durable half of the rail.
#
# The driver fetches the media release itself and only pulls each file as it is
# about to upload, so a run downloads tens of MB, not the whole 500 MB.
#
# Secrets: the YouTube refresh tokens already live in this repo's Actions secrets
# (YT_CLIENT_ID, YT_CLIENT_SECRET, YT_CH3_REFRESH_TOKEN) for the watchdog. The
# ledger write uses the job's own GITHUB_TOKEN with contents:write — no personal
# token is stored, so nothing here can be blocked by an expired PAT.

on:
  schedule:
    # The daily quotas reset at midnight *Pacific*, and the first tick has to sit
    # after that reset in both halves of the year. Midnight PT is 07:00 UTC under
    # PDT (Mar-Nov) and 08:00 UTC under PST (Nov-Mar), so a `07:00` tick runs an
    # hour *before* the reset for half the year — on 2026-11-06 that is exactly
    # what happened: the 14:43 UTC run found the 10,000-unit pool already gone,
    # so all six uploads landed without a thumbnail or a playlist slot while the
    # uploads themselves succeeded on their separate 100/day bucket. 09:00 UTC is
    # clear of both offsets.
    #
    # Three ticks, not one. GitHub drops a scheduled run when the queue is busy
    # and a once-a-day cron gets a single chance, so one dropped tick lost the
    # whole day — the 07:00 run did not fire for the first two days of this job's
    # life. Later ticks are free: `release.py --next` returns 3 ("today's uploads
    # are done") once the batch is up, so a retry can never double-upload.
    - cron: '0 9,15,21 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: "Videos to upload this run (cadence choice; videos.insert bucket is 100/day)"
        default: "6"
      spread:
        description: "Hours between publishAt times"
        default: "4"

permissions:
  contents: write

concurrency:
  group: ax-music-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs first, on purpose. thumbnails.set draws on the shared 10,000-unit
      # pool that videos.insert also uses, so a late-in-the-day upload succeeds
      # and its thumbnail returns 403. At 07:00 UTC the pool is fresh and a
      # thumbnail costs only 50 units, so the repairs are free here — after the
      # releases below they would be the ones to starve.
      - name: Repair thumbnails lost to a spent quota
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd music938-1 && python3 scripts/fix_thumbnails.py --ch ch3 || true

      - name: Fix the wrong-render backlog first
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A replacement spends the same upload slot a new release would, and it
          # is a defect on content that is already live, so it goes first — but
          # only up to `AFFILIATE_RESERVE` (2) slots, which `replace_video.py`
          # holds for the product clips. The backlog is a quality fix and can
          # wait; the product clips are the only content that can produce a
          # Shopee click, so they must reach the channel every day.
          python3 music938-1/scripts/pending_replacements.py --root "$GITHUB_WORKSPACE"

      - name: Release the day's batch
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          # The driver reads AX_GH_TOKEN for the ledger write and the media
          # release; the job token can do both in this repo.
          AX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AX_RELEASE_COUNT: ${{ github.event.inputs.count || '6' }}
          AX_RELEASE_SPREAD: ${{ github.event.inputs.spread || '4' }}
          AX_RELEASE_CH: ch3
        run: |
          set -euo pipefail
          python3 music938-1/scripts/daily_release.py --root "$GITHUB_WORKSPACE"
