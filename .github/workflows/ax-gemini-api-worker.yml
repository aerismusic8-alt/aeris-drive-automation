name: AX Gemini API Worker

on:
  push:
    branches: [main]
    paths:
      - 'AX_MULTI_AI_DISPATCH_QUEUE.json'
      - 'AKATH/runtime/ax_gemini_helper.py'
      - '.github/workflows/ax-gemini-api-worker.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Coding task for Gemini API"
        required: true
        type: string
      file:
        description: "Target file"
        required: true
        default: "AKATH/runtime/generated_gemini_api_task.py"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            prompt="$INPUT_PROMPT"
            target="$INPUT_FILE"
            task_id="MANUAL-GEMINI-API-${GITHUB_RUN_ID}"
          else
            task_data=$(python - <<'PY'
          import json
          q=json.load(open('AX_MULTI_AI_DISPATCH_QUEUE.json', encoding='utf-8'))
          t=next((x for x in q.get('tasks', []) if x.get('provider')=='GEMINI_API'), None)
          if not t: raise SystemExit('GEMINI_API_TASK_NOT_FOUND')
          print(t['task_id']); print(t['prompt']); print(t['file'])
          PY
            )
            mapfile -t fields <<< "$task_data"
            task_id="${fields[0]}"; prompt="${fields[1]}"; target="${fields[2]}"
          fi
          [[ -n "$prompt" ]] || { echo 'GEMINI_API_PROMPT_EMPTY'; exit 1; }
          [[ -n "$target" ]] || { echo 'GEMINI_API_TARGET_EMPTY'; exit 1; }
          {
            echo "TASK_ID=$task_id"
            echo "PROMPT=$prompt"
            echo "TARGET_FILE=$target"
          } >> "$GITHUB_ENV"
          echo "AX_GEMINI_API_TASK_READY task=$task_id file=$target"
      - name: Run Gemini API worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from AKATH.runtime.ax_gemini_helper import ask_gemini
          text=ask_gemini(os.environ['PROMPT'])
          target=Path(os.environ['TARGET_FILE'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text.rstrip()+'\n', encoding='utf-8')
          print(f"AX_GEMINI_API_PASS task={os.environ['TASK_ID']} file={target}")
          PY
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -s "$TARGET_FILE"
          echo "AX_GEMINI_API_OUTPUT_VERIFIED task=$TASK_ID file=$TARGET_FILE"
      - name: Persist output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AX Gemini API Worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET_FILE"
          git diff --cached --quiet && { echo "GEMINI_API_WRITEBACK_EMPTY task=$TASK_ID"; exit 1; }
          git commit -m "chore: persist Gemini API task=$TASK_ID"
          git push origin HEAD:main
          echo "AX_GEMINI_API_WRITEBACK_VERIFIED task=$TASK_ID file=$TARGET_FILE"
