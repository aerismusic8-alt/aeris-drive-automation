name: AX Gemini API Worker

on:
  push:
    branches: [main]
    paths:
      - 'AX_MULTI_AI_DISPATCH_QUEUE.json'
      - 'AKATH/runtime/ax_gemini_helper.py'
      - '.github/workflows/ax-gemini-api-worker.yml'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Coding task for Gemini API"
        required: true
        type: string
      file:
        description: "Target file"
        required: true
        default: "AKATH/runtime/generated_gemini_api_task.py"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve task
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $prompt = $env:INPUT_PROMPT
            $target = $env:INPUT_FILE
            $taskId = "MANUAL-GEMINI-API-$env:GITHUB_RUN_ID"
          } else {
            $task = python -c "import json; q=json.load(open('AX_MULTI_AI_DISPATCH_QUEUE.json', encoding='utf-8')); t=next((x for x in q.get('tasks', []) if x.get('provider')=='GEMINI_API'), None); raise SystemExit('GEMINI_API_TASK_NOT_FOUND') if not t else print(json.dumps(t, ensure_ascii=False))"
            $obj = $task | ConvertFrom-Json
            $taskId = $obj.task_id
            $prompt = $obj.prompt
            $target = $obj.file
          }
          if ([string]::IsNullOrWhiteSpace($prompt)) { throw 'GEMINI_API_PROMPT_EMPTY' }
          if ([string]::IsNullOrWhiteSpace($target)) { throw 'GEMINI_API_TARGET_EMPTY' }
          "TASK_ID=$taskId" >> $env:GITHUB_ENV
          "PROMPT=$prompt" >> $env:GITHUB_ENV
          "TARGET_FILE=$target" >> $env:GITHUB_ENV
          Write-Host "AX_GEMINI_API_TASK_READY task=$taskId file=$target"
      - name: Run Gemini API worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import os; from pathlib import Path; from AKATH.runtime.ax_gemini_helper import ask_gemini; text=ask_gemini(os.environ['PROMPT']); target=Path(os.environ['TARGET_FILE']); target.parent.mkdir(parents=True, exist_ok=True); target.write_text(text.rstrip()+'\n', encoding='utf-8'); print(f\"AX_GEMINI_API_PASS task={os.environ['TASK_ID']} file={target}\")"
      - name: Verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:TARGET_FILE)) { throw "GEMINI_API_OUTPUT_MISSING:$env:TARGET_FILE" }
          if ((Get-Item $env:TARGET_FILE).Length -le 0) { throw "GEMINI_API_OUTPUT_EMPTY:$env:TARGET_FILE" }
          Write-Host "AX_GEMINI_API_OUTPUT_VERIFIED task=$env:TASK_ID file=$env:TARGET_FILE"
      - name: Persist output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'AX Gemini API Worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:TARGET_FILE
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "GEMINI_API_WRITEBACK_EMPTY task=$env:TASK_ID" }
          git commit -m "chore: persist Gemini API task=$env:TASK_ID"
          git push origin HEAD:main
          Write-Host "AX_GEMINI_API_WRITEBACK_VERIFIED task=$env:TASK_ID file=$env:TARGET_FILE"
