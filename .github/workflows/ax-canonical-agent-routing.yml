name: AX Canonical Agent Routing

on:
  push:
    paths:
      - 'AX_ACTION_DISPATCHER.ps1'
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_ROUTE_GATE.ps1'
      - 'AX_AGENT_ROUTING_BRIDGE.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_CANONICAL_AGENT_ROUTING.Tests.ps1'
      - '.github/workflows/ax-canonical-agent-routing.yml'
  pull_request:
    paths:
      - 'AX_ACTION_DISPATCHER.ps1'
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_ROUTE_GATE.ps1'
      - 'AX_AGENT_ROUTING_BRIDGE.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_CANONICAL_AGENT_ROUTING.Tests.ps1'
      - '.github/workflows/ax-canonical-agent-routing.yml'
  workflow_dispatch:

jobs:
  policy-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical routing regression
        shell: pwsh
        run: ./tests/AX_CANONICAL_AGENT_ROUTING.Tests.ps1
