name: AX PC1 Desktop Control

# Let an agent drive the PC1 desktop through the winremote-mcp server that runs
# on PC1 itself.
#
# Why this shape: the MCP server binds 127.0.0.1, so only something already on
# PC1 can call it. The self-hosted runner is on PC1, which makes it the shortest
# possible path and removes every other dependency at once. No tailnet, no
# MeshCentral server, no port forward, and no credential has to be handed over:
# the runner talks to loopback and this workflow uploads what it finds as an
# artifact the caller can read.
#
# The screenshot is the point. An agent that can only read logs is guessing
# about anything visual, so Snapshot is saved as a PNG and uploaded, not
# summarised into a byte count.
#
# This is dispatch-only in intent. It runs whatever tool it is told to run, so
# a push must not be able to fire an arbitrary tool call. The push trigger below
# is deliberately narrow, and it exists for a mechanical reason: GitHub only
# registers a workflow on a non-default branch when one of its triggers fires
# there. A workflow_dispatch-only file on a feature branch is never registered,
# so it can never be dispatched, which is why an earlier dispatch-only workflow
# in this repository returned 404 forever. The narrow push trigger is what makes
# this file dispatchable at all; on push the inputs are empty, so it runs the
# read-only default (GetSystemInfo) and nothing else.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'MCP tool to call (Snapshot, Shell, FileList, GetSystemInfo, ...)'
        required: true
        default: 'GetSystemInfo'
      args:
        description: 'JSON arguments for the tool'
        required: false
        default: '{}'
      port:
        description: 'winremote-mcp port on PC1'
        required: false
        default: '8090'
      start_server:
        description: 'Start the MCP server task if it is not already answering'
        required: false
        type: boolean
        default: true
  push:
    paths:
      - '.github/workflows/ax-pc1-desktop-control.yml'

permissions:
  contents: read

jobs:
  control:
    runs-on: self-hosted
    env:
      # On a push trigger the dispatch inputs are empty, so fall back to the
      # read-only default rather than calling a tool with an empty name.
      MCP_TOOL: ${{ inputs.tool || 'GetSystemInfo' }}
      MCP_ARGS: ${{ inputs.args || '{}' }}
      MCP_PORT: ${{ inputs.port || '8090' }}
    steps:
      # Self-hosted runners reuse their workspace between jobs, so without an
      # explicit checkout the client script below can be missing or stale.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify PC1
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-RGK6JKB') { throw "EXPECTED_PC1:$env:COMPUTERNAME" }
          Write-Host "PC1=VERIFIED"

      - name: Make sure the MCP client's dependencies are present
        shell: powershell
        run: |
          $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $python) { throw 'PYTHON_NOT_FOUND' }
          # pip writes dependency-resolver notes to stderr, and a native command's
          # stderr becomes a terminating error under ErrorActionPreference=Stop.
          # The install was fine; the run died on the warning. The exit code is
          # the thing to trust here, so stderr is merged into the log instead.
          $ErrorActionPreference = 'Continue'
          & $python -m pip install --quiet --upgrade mcp httpx2 2>&1 | Out-String | Write-Host
          $install = $LASTEXITCODE
          & $python -c "import mcp, httpx2" 2>&1 | Out-String | Write-Host
          if ($install -ne 0 -or $LASTEXITCODE -ne 0) { throw 'MCP_CLIENT_DEPS_FAILED' }
          Write-Host 'MCP_CLIENT_DEPS=ok'

      - name: Make sure the MCP server is up
        shell: powershell
        run: |
          # Empty (a push run) is treated as "yes"; only an explicit false skips.
          if ('${{ inputs.start_server }}' -eq 'false') {
            Write-Host 'MCP_START_SKIPPED_BY_INPUT'
            exit 0
          }
          $port = $env:MCP_PORT
          $url = "http://127.0.0.1:$port/health"
          $ok = $false
          try {
            $r = Invoke-RestMethod -Uri $url -TimeoutSec 5
            if ($r.status -eq 'ok') { $ok = $true; Write-Host "MCP_ALREADY_UP=$($r.version)" }
          } catch { }

          if (-not $ok) {
            Write-Host 'MCP_NOT_ANSWERING - starting the scheduled task'
            $task = Get-ScheduledTask -TaskName 'AERIS-PC1-WINREMOTE-MCP' -ErrorAction SilentlyContinue
            if (-not $task) { throw 'MCP_TASK_MISSING: run pc1-bootstrap-once.ps1 on PC1 first' }
            Start-ScheduledTask -TaskName 'AERIS-PC1-WINREMOTE-MCP'
            foreach ($attempt in 1..20) {
              Start-Sleep -Seconds 3
              try {
                $r = Invoke-RestMethod -Uri $url -TimeoutSec 5
                if ($r.status -eq 'ok') { $ok = $true; Write-Host "MCP_STARTED=$($r.version)"; break }
              } catch { }
            }
          }
          if (-not $ok) { throw 'MCP_SERVER_NOT_HEALTHY' }

      - name: Call the tool
        shell: powershell
        run: |
          $port = $env:MCP_PORT
          $shotDir = 'C:\AX-Runtime\evidence\desktop-control'
          New-Item -ItemType Directory -Path $shotDir -Force | Out-Null

          # Find the client script. The repository is checked out in the runner
          # workspace, so prefer that over a copy in the runtime folder.
          $client = Join-Path $env:GITHUB_WORKSPACE 'AX_PC_CONTROL\ax-winremote-mcp.py'
          if (-not (Test-Path -LiteralPath $client)) {
            $client = 'C:\AX-Runtime\AX_PC_CONTROL\ax-winremote-mcp.py'
          }
          if (-not (Test-Path -LiteralPath $client)) { throw "MCP_CLIENT_MISSING:$client" }

          $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $python) { throw 'PYTHON_NOT_FOUND' }

          Write-Host "CLIENT=$client"
          Write-Host "TOOL=$env:MCP_TOOL"

          # The tool name and its JSON arguments come from environment variables
          # rather than being interpolated into this script, so a JSON argument
          # containing quotes cannot break out into PowerShell.
          #
          # --save-images is what makes a screenshot usable: it writes the PNG
          # and reports the path, instead of reporting only its size.
          #
          # The MCP SDK prints a task-group traceback to stderr while it tears
          # the session down, after the tool has already answered. A native
          # command's stderr is a terminating error under
          # ErrorActionPreference=Stop, so that teardown noise killed the step
          # before the result was written and the real answer was lost. stderr
          # goes to its own file and the exit code decides what happened.
          $errFile = Join-Path $shotDir 'mcp-call.err'
          $ErrorActionPreference = 'Continue'
          $out = & $python $client `
            --url "http://127.0.0.1:$port/mcp" `
            --call $env:MCP_TOOL `
            --args $env:MCP_ARGS `
            --save-images $shotDir 2>$errFile | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if (Test-Path -LiteralPath $errFile) {
            $errText = Get-Content -LiteralPath $errFile -Raw
            if ($errText) { Write-Host "MCP_STDERR=$errText" }
          }
          Set-Content -LiteralPath (Join-Path $shotDir 'mcp-call.json') -Value $out -Encoding UTF8

          # Also leave a copy where the evidence upload expects it.
          $evidence = 'C:\AX-Runtime\evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $evidence 'pc1-desktop-control.json') -Value $out -Encoding UTF8

          if ($code -ne 0) { throw "MCP_CALL_EXIT:$code" }

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc1-desktop-control
          path: |
            C:\AX-Runtime\evidence\desktop-control\*
            C:\AX-Runtime\evidence\pc1-desktop-control.json
          if-no-files-found: warn
          retention-days: 14
