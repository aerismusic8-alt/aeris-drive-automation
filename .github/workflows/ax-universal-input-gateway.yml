name: AX Universal Input Gateway

on:
  push:
    paths:
      - 'AX_UNIVERSAL_INPUT_GATEWAY.gs'
      - 'tests/AX_UNIVERSAL_INPUT_GATEWAY.Tests.ps1'
      - '.github/workflows/ax-universal-input-gateway.yml'
  pull_request:
    paths:
      - 'AX_UNIVERSAL_INPUT_GATEWAY.gs'
      - 'tests/AX_UNIVERSAL_INPUT_GATEWAY.Tests.ps1'
      - '.github/workflows/ax-universal-input-gateway.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gateway regression
        shell: pwsh
        run: ./tests/AX_UNIVERSAL_INPUT_GATEWAY.Tests.ps1
