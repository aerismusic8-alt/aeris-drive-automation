name: AX OpenAI Autonomous Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'AX_OPENAI_DISPATCH_QUEUE.json'
      - '.github/workflows/ax-openai-dispatcher.yml'
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ax-openai-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Dispatch READY OpenAI task
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $queuePath = Join-Path $env:GITHUB_WORKSPACE 'AX_OPENAI_DISPATCH_QUEUE.json'
          if (-not (Test-Path $queuePath)) { Write-Host 'OPENAI_DISPATCH_QUEUE=EMPTY'; exit 0 }
          $q = Get-Content -Raw $queuePath | ConvertFrom-Json
          if ($q.status -ne 'READY') { Write-Host "OPENAI_DISPATCH_QUEUE=SKIP status=$($q.status)"; exit 0 }

          $repo = '${{ github.repository }}'
          $workflow = 'ax-openai-live-code-stream.yml'
          $endpoint = "repos/$repo/actions/workflows/$workflow/dispatches"
          $runsEndpoint = "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=10"
          $dispatchAt = [DateTime]::UtcNow

          Write-Host "OPENAI_DISPATCH=POST task=$($q.task_id)"
          gh api --method POST $endpoint -f ref=main -f "inputs[prompt]=$($q.prompt)" -f "inputs[file]=$($q.file)"
          if ($LASTEXITCODE -ne 0) { throw 'OPENAI_WORKFLOW_DISPATCH_FAILED' }

          $runId = $null
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 5
            $recent = @(gh api $runsEndpoint --jq '.workflow_runs[] | {id,status,event,created_at}') | ForEach-Object { $_ | ConvertFrom-Json }
            $match = $recent | Where-Object { $_.event -eq 'workflow_dispatch' -and ([DateTime]$_.created_at) -ge $dispatchAt } | Sort-Object { [DateTime]$_.created_at } -Descending | Select-Object -First 1
            if ($null -ne $match) { $runId = $match.id; break }
          }
          if ($null -eq $runId) { throw 'OPENAI_WORKFLOW_RUN_ID_NOT_FOUND' }

          $q.status = 'DISPATCHED'
          $q.run_id = [int64]$runId
          $q.dispatched_at = [DateTime]::UtcNow.ToString('o')
          $q | ConvertTo-Json -Depth 10 | Set-Content $queuePath -Encoding UTF8

          git config user.name 'AX OpenAI Autonomous Dispatcher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_OPENAI_DISPATCH_QUEUE.json
          git commit -m "chore: mark OpenAI task dispatched run=$runId"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'OPENAI_DISPATCH_QUEUE_WRITEBACK_FAILED' }

          Write-Host "OPENAI_DISPATCH_CONFIRMED run=$runId task=$($q.task_id)"
