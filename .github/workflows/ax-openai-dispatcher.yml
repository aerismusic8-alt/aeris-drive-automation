name: AX OpenAI Autonomous Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'AX_OPENAI_DISPATCH_QUEUE.json'
      - '.github/workflows/ax-openai-dispatcher.yml'
      - 'tests/AX_OPENAI_DISPATCHER_CORRELATION.Tests.ps1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ax-openai-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Regression test dispatcher correlation
        shell: pwsh
        run: ./tests/AX_OPENAI_DISPATCHER_CORRELATION.Tests.ps1

      - name: Dispatch READY OpenAI task
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $queuePath = Join-Path $env:GITHUB_WORKSPACE 'AX_OPENAI_DISPATCH_QUEUE.json'
          if (-not (Test-Path $queuePath)) { Write-Host 'OPENAI_DISPATCH_QUEUE=EMPTY'; exit 0 }
          $q = Get-Content -Raw -Path $queuePath | ConvertFrom-Json
          if ($q.status -ne 'READY') { Write-Host "OPENAI_DISPATCH_QUEUE=SKIP status=$($q.status)"; exit 0 }
          $taskId = $q.task_id
          $prompt = $q.prompt
          $file = $q.file
          Write-Host "OPENAI_DISPATCH=POST task=$taskId"
          gh workflow run ax-openai-live-code-stream.yml --ref main -f prompt=$prompt -f file=$file

          $runId = $null
          for ($i=1; $i -le 12; $i++) {
            Start-Sleep -Seconds 5
            $json = gh run list --workflow ax-openai-live-code-stream.yml --event workflow_dispatch --limit 1 --json databaseId | ConvertFrom-Json
            if ($json.Count -gt 0) { $runId = $json[0].databaseId; break }
          }
          if (-not $runId) { throw 'OPENAI_WORKFLOW_RUN_ID_NOT_FOUND' }

          $q.status = 'DISPATCHED'
          $q.run_id = [int64]$runId
          $q | ConvertTo-Json -Depth 20 | Set-Content -Path $queuePath -Encoding UTF8
          git config user.name 'AX OpenAI Autonomous Dispatcher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_OPENAI_DISPATCH_QUEUE.json
          git commit -m "chore: mark OpenAI task dispatched run=$runId"
          git push origin HEAD:main
          Write-Host "OPENAI_DISPATCH_CONFIRMED run=$runId task=$taskId"