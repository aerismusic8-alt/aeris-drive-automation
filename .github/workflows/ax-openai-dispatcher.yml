name: AX OpenAI Autonomous Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'AX_OPENAI_DISPATCH_QUEUE.json'
      - '.github/workflows/ax-openai-dispatcher.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ax-openai-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Dispatch READY OpenAI task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          queue_path="$GITHUB_WORKSPACE/AX_OPENAI_DISPATCH_QUEUE.json"
          if [[ ! -f "$queue_path" ]]; then echo 'OPENAI_DISPATCH_QUEUE=EMPTY'; exit 0; fi
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$queue_path")
          if [[ "$status" != "READY" ]]; then echo "OPENAI_DISPATCH_QUEUE=SKIP status=$status"; exit 0; fi

          task_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["task_id"])' "$queue_path")
          prompt=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prompt"])' "$queue_path")
          file=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["file"])' "$queue_path")
          echo "OPENAI_DISPATCH=POST task=$task_id"
          gh workflow run ax-openai-live-code-stream.yml --ref main -f prompt="$prompt" -f file="$file"

          for i in {1..12}; do
            sleep 5
            run_id=$(gh run list --workflow ax-openai-live-code-stream.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq --argjson t "$(date +%s)" '[.[] | select((.createdAt | fromdateiso8601) >= ($t-90))] | .[0].databaseId // empty') || true
            if [[ -n "$run_id" ]]; then
              break
            fi
          done
          if [[ -z "${run_id:-}" ]]; then echo 'OPENAI_WORKFLOW_RUN_ID_NOT_FOUND' >&2; exit 1; fi

          python - "$queue_path" "$run_id" <<'PY'
          import json,sys
          p=sys.argv[1]; run_id=int(sys.argv[2])
          with open(p,encoding='utf-8') as f: q=json.load(f)
          q['status']='DISPATCHED'; q['run_id']=run_id
          with open(p,'w',encoding='utf-8') as f: json.dump(q,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
          git config user.name 'AX OpenAI Autonomous Dispatcher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_OPENAI_DISPATCH_QUEUE.json
          git commit -m "chore: mark OpenAI task dispatched run=$run_id"
          git push origin HEAD:main
          echo "OPENAI_DISPATCH_CONFIRMED run=$run_id task=$task_id"