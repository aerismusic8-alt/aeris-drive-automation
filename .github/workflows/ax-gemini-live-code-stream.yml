name: AX Gemini Live Code Stream

on:
  push:
    branches: [main]
    paths:
      - 'AX_GEMINI_KICK.txt'
      - 'AX_MULTI_AI_DISPATCH_QUEUE.json'
      - '.github/workflows/ax-gemini-live-code-stream.yml'
      - 'tests/AX_GEMINI_EXECUTION_CONTRACT.Tests.ps1'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Coding task for Gemini"
        required: true
        type: string
      file:
        description: "Displayed target file name"
        required: true
        default: "AKATH/runtime/generated_gemini_task.py"
        type: string

permissions:
  contents: write

jobs:
  code-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Regression test Gemini execution contract
        shell: pwsh
        run: ./tests/AX_GEMINI_EXECUTION_CONTRACT.Tests.ps1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve Gemini task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            prompt="${INPUT_PROMPT}"
            target_file="${INPUT_FILE:-AKATH/runtime/generated_gemini_task.py}"
          else
            prompt=""
            target_file="AKATH/runtime/generated_gemini_api_task.py"
            if [[ -f AX_MULTI_AI_DISPATCH_QUEUE.json ]]; then
              readarray -t task_data < <(python - <<'PY'
          import json
          q=json.load(open('AX_MULTI_AI_DISPATCH_QUEUE.json', encoding='utf-8'))
          for p in ('GEMINI_API','GEMINI_LIVE_CODE_STREAM'):
              t=next((x for x in q.get('tasks',[]) if x.get('provider')==p), None)
              if t:
                  print(t['task_id'])
                  print(t['prompt'])
                  print(t['file'])
          PY
              )
              for ((i=0; i<${#task_data[@]}; i+=3)); do
                task_id="${task_data[i]}"
                prompt="${task_data[i+1]}"
                target_file="${task_data[i+2]}"
                printf 'GEMINI_TASKS += %s\n' "$task_id"
                printf 'PROMPT=%s\n' "$prompt" >> "$GITHUB_ENV"
                printf 'TARGET_FILE=%s\n' "$target_file" >> "$GITHUB_ENV"
                python - <<PY
          import os
          from pathlib import Path
          from AKATH.runtime.ax_gemini_helper import ask_gemini
          text=ask_gemini(os.environ['PROMPT'])
          target=Path(os.environ['TARGET_FILE'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text.rstrip()+'\n', encoding='utf-8')
          print(f"AX_GEMINI_CODE_STREAM_PASS file={target} task={os.environ['PROMPT'][:32]}")
          PY
                unset 'GITHUB_ENV'
              done
            fi
            if [[ -z "$prompt" && -f AX_GEMINI_KICK.txt ]]; then
              prompt="$(cat AX_GEMINI_KICK.txt)"
              target_file="AKATH/runtime/generated_gemini_task.py"
            fi
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'PROMPT=%s\n' "$prompt" >> "$GITHUB_ENV"
            printf 'TARGET_FILE=%s\n' "$target_file" >> "$GITHUB_ENV"
            echo "AX_GEMINI_TASK_READY file=$target_file"
          fi

      - name: Run Gemini coding worker
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROMPT:-}" || -z "${TARGET_FILE:-}" ]]; then
            echo 'AX_GEMINI_QUEUE_EXECUTION_FAILED=NO_RESOLVED_TASK'
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from AKATH.runtime.ax_gemini_helper import ask_gemini
          text=ask_gemini(os.environ['PROMPT'])
          target=Path(os.environ['TARGET_FILE'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text.rstrip()+'\n', encoding='utf-8')
          print('AX_GEMINI_CODE_STREAM_START')
          for line in text.splitlines(): print(f'AX_GEMINI_CODE_LINE={line}')
          print('AX_GEMINI_CODE_STREAM_END')
          print(f'AX_GEMINI_CODE_STREAM_PASS file={target}')
          PY

      - name: Verify generated file
        shell: bash
        run: |
          set -euo pipefail
          test -s "$TARGET_FILE"
          echo "AX_GEMINI_OUTPUT_VERIFIED file=$TARGET_FILE"

      - name: Durable write-back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AX Gemini Live Code Stream'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILE"
          git diff --cached --quiet && { echo 'GEMINI_WRITEBACK_EMPTY'; exit 1; }
          git commit -m "chore: persist Gemini code-stream output run=$GITHUB_RUN_ID"
          git push origin HEAD:main
          echo "AX_GEMINI_WRITEBACK_VERIFIED file=$TARGET_FILE"
