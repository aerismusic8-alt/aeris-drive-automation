name: AX Task Selector Tests

on:
  push:
    paths:
      - 'AX_TASK_SELECTOR.ps1'
      - 'AX_DECISION_ENGINE.ps1'
      - 'AX_ACTION_DISPATCHER.ps1'
      - 'tests/AX_TASK_SELECTOR.Tests.ps1'
      - '.github/workflows/ax-task-selector-tests.yml'
  pull_request:
    paths:
      - 'AX_TASK_SELECTOR.ps1'
      - 'AX_DECISION_ENGINE.ps1'
      - 'AX_ACTION_DISPATCHER.ps1'
      - 'tests/AX_TASK_SELECTOR.Tests.ps1'
      - '.github/workflows/ax-task-selector-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run selector regression tests
        shell: pwsh
        run: ./tests/AX_TASK_SELECTOR.Tests.ps1
      - name: Verify dispatcher uses canonical selector
        shell: pwsh
        run: |
          $text = Get-Content -Raw ./AX_ACTION_DISPATCHER.ps1
          if ($text -notmatch 'AX_TASK_SELECTOR\.ps1') { throw 'Dispatcher is not using canonical selector' }
          if ($text -notmatch 'Test-AxTaskDependencies') { throw 'Dispatcher is missing dependency defense-in-depth gate' }
          if ($text -match '\$eligible\s*=.*Sort-Object.*priority') { throw 'Dispatcher still contains independent priority selector' }
          Write-Host 'DISPATCHER_STATIC_GUARD: PASS'
