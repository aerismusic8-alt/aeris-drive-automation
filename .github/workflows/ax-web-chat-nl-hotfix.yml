name: AX Web Chat NL Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ax-web-chat-nl-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject browser-scoped newline constant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cloudflare/ax-control-runtime/src/index.ts')
          source = path.read_text(encoding='utf-8')
          marker = '<script>const $=id=>document.getElementById(id);'
          replacement = '<script>const NL=String.fromCharCode(10);const $=id=>document.getElementById(id);'
          if marker not in source:
              raise SystemExit('AX_WEB_CHAT_SCRIPT_MARKER_NOT_FOUND')
          if replacement not in source:
              source = source.replace(marker, replacement, 1)
              path.write_text(source, encoding='utf-8')
              changed = True
          else:
              changed = False
          print(f'AX_WEB_CHAT_NL_CHANGED={str(changed).lower()}')
          PY

      - name: Verify browser-scoped newline constant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('cloudflare/ax-control-runtime/src/index.ts').read_text(encoding='utf-8')
          assert '<script>const NL=String.fromCharCode(10);const $=id=>document.getElementById(id);' in source
          print('AX browser-scoped NL guard passed.')
          PY
          node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/ax-control-runtime/src/index.ts; then
            echo 'AX_WEB_CHAT_NL_ALREADY_FIXED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/ax-control-runtime/src/index.ts
          git commit -m 'fix: scope AX Web Chat newline constant to browser'
          git push
