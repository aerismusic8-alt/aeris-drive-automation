name: AX PC1 System Cleanup Diagnose

on:
  workflow_dispatch:
  push:
    paths:
      - 'AX_PC_CONTROL/pc1-system-cleanup-diagnose.ps1'
      - '.github/workflows/ax-pc1-system-cleanup-diagnose.yml'

jobs:
  cleanup-diagnose:
    runs-on: self-hosted
    steps:
      - name: Verify PC1
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-RGK6JKB') { throw "EXPECTED_PC1:$env:COMPUTERNAME" }
          Write-Host "PC1=VERIFIED"

      - name: Run foreground diagnosis
        shell: powershell
        run: |
          $url = "https://raw.githubusercontent.com/aerismusic8-alt/aeris-drive-automation/$env:GITHUB_SHA/AX_PC_CONTROL/pc1-system-cleanup-diagnose.ps1"
          $p = Join-Path $env:TEMP "pc1-foreground-diagnose.ps1"
          Invoke-WebRequest -Uri $url -OutFile $p
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p
          if ($LASTEXITCODE -ne 0) { throw "FOREGROUND_DIAGNOSE_EXIT:$LASTEXITCODE" }

      - name: Verify and expose root-cause evidence
        shell: powershell
        run: |
          $p = Join-Path "C:\AX-Runtime" "evidence\pc1-foreground-diagnosis.json"
          if (!(Test-Path $p)) { throw "EVIDENCE_MISSING:$p" }
          $x = Get-Content $p -Raw | ConvertFrom-Json
          Write-Host "SAMPLE_COUNT=$($x.sampleCount)"
          Write-Host "UNIQUE_PROCESS_COUNT=$(@($x.uniqueProcesses).Count)"
          Write-Host "TOP_FOREGROUND:"
          @($x.uniqueProcesses | Group-Object ForegroundName | Sort-Object Count -Descending | Select-Object -First 15) | ForEach-Object {
            Write-Host ("FG {0} COUNT={1}" -f $_.Name,$_.Count)
          }
          Write-Host "TERMINAL_PARENT_TRACE:"
          @($x.parentTrace | Sort-Object Child,ChildPid -Unique) | ForEach-Object {
            Write-Host ("CHILD={0} PID={1} PARENT={2} PPID={3} CMD={4}" -f $_.Child,$_.ChildPid,$_.Parent,$_.ParentPid,$_.ParentCommandLine)
          }
          Write-Host "RUNNER_SERVICES:"
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'actions.runner.*' -or $_.DisplayName -like '*GitHub Actions*' } |
            Select-Object Name,State,StartMode,StartName,PathName |
            Format-List | Out-String | Write-Host
