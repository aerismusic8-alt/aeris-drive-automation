name: AX PC1 System Cleanup Diagnose

on:
  workflow_dispatch:
  push:
    paths:
      - 'AX_PC_CONTROL/pc1-system-cleanup-diagnose.ps1'
      - '.github/workflows/ax-pc1-system-cleanup-diagnose.yml'

jobs:
  cleanup-diagnose:
    runs-on: self-hosted
    steps:
      - name: Verify PC1
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-RGK6JKB') { throw "EXPECTED_PC1:$env:COMPUTERNAME" }
          Write-Host "PC1=VERIFIED"

      - name: Run cleanup and terminal diagnosis
        shell: powershell
        run: |
          $url = "https://raw.githubusercontent.com/aerismusic8-alt/aeris-drive-automation/$env:GITHUB_SHA/AX_PC_CONTROL/pc1-system-cleanup-diagnose.ps1"
          $p = Join-Path $env:TEMP "pc1-system-cleanup-diagnose.ps1"
          Invoke-WebRequest -Uri $url -OutFile $p
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p
          if ($LASTEXITCODE -ne 0) { throw "CLEANUP_DIAGNOSE_EXIT:$LASTEXITCODE" }

      - name: Verify evidence
        shell: powershell
        run: |
          $p = Join-Path "C:\AX-Runtime" "evidence\pc1-system-cleanup-diagnosis.json"
          if (!(Test-Path $p)) { throw "EVIDENCE_MISSING" }
          $x = Get-Content $p -Raw | ConvertFrom-Json
          Write-Host "TAILSCALE_BEFORE=$($x.tailscale.beforeCount)"
          Write-Host "TAILSCALE_AFTER=$($x.tailscale.afterCount)"
          Write-Host "TERMINAL_PROCESS_COUNT=$($x.terminal.processCount)"
          Write-Host "SCHEDULED_TASK_COUNT=$($x.terminal.scheduledTaskCount)"
          Write-Host "DIAGNOSIS_STATUS=$($x.status)"
