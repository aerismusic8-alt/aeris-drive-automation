name: AX Apply Request Correlation Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ax-apply-correlation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply correlation patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare/ax-control-runtime/src/index.ts')
          s = p.read_text()
          old_pull = '''    if (path === '/pull' && request.method === 'POST') {\n      const now = Date.now();\n      const index = current.findIndex((item) => {\n        const meta = item as AxGatewayInput & { _status?: string; _leaseUntil?: number };\n        return meta._status !== 'ACKED' && (!meta._leaseUntil || meta._leaseUntil <= now);\n      });\n      if (index < 0) return json({ ok: true, item: null });\n      const item = current[index] as AxGatewayInput & { _status?: string; _leaseUntil?: number };\n      item._status = 'CLAIMED';\n      item._leaseUntil = now + LEASE_MS;\n      current[index] = item;\n      await this.state.storage.put('items', current);\n      return json({ ok: true, item });\n    }'''
          new_pull = '''    if (path === '/pull' && request.method === 'POST') {\n      const requestedId = String((payload as { request_id?: unknown } | null)?.request_id || '');\n      const now = Date.now();\n      const index = current.findIndex((item) => {\n        const meta = item as AxGatewayInput & { _status?: string; _leaseUntil?: number };\n        const eligible = meta._status !== 'ACKED' && (!meta._leaseUntil || meta._leaseUntil <= now);\n        return eligible && (!requestedId || item.request_id === requestedId);\n      });\n      if (index < 0) return requestedId ? json({ error: 'REQUEST_UNAVAILABLE', requestId: requestedId }, 404) : json({ ok: true, item: null });\n      const item = current[index] as AxGatewayInput & { _status?: string; _leaseUntil?: number };\n      item._status = 'CLAIMED';\n      item._leaseUntil = now + LEASE_MS;\n      current[index] = item;\n      await this.state.storage.put('items', current);\n      return json({ ok: true, item });\n    }'''
          if old_pull not in s:
              raise SystemExit('OLD_PULL_BLOCK_NOT_FOUND')
          s = s.replace(old_pull, new_pull, 1)
          old_call = '''async function gatewayInboxCall(env: Env, operation: 'put' | 'pull' | 'ack' | 'result-put' | 'result-get/', payload?: unknown, requestId?: string): Promise<Response> {'''
          new_call = '''async function gatewayInboxCall(env: Env, operation: 'put' | 'pull' | 'ack' | 'result-put' | 'result-get/', payload?: unknown, requestId?: string): Promise<Response> {'''
          if old_call not in s:
              raise SystemExit('GATEWAY_CALL_SIGNATURE_NOT_FOUND')
          old_route = '''    if (request.method === 'POST' && url.pathname === '/pc/pull') {\n      if (!secretAccepted(bearerSecret(request), env.AX_PC_PULL_SECRET)) return json({ error: 'AUTH_REQUIRED' }, 401);\n      const inboxResponse = await gatewayInboxCall(env, 'pull'); return json(await inboxResponse.json(), inboxResponse.status);\n    }'''
          new_route = '''    if (request.method === 'POST' && url.pathname === '/pc/pull') {\n      if (!secretAccepted(bearerSecret(request), env.AX_PC_PULL_SECRET)) return json({ error: 'AUTH_REQUIRED' }, 401);\n      const body = await request.json().catch(() => null) as { request_id?: string; requestId?: string } | null;\n      const requestId = String(body?.request_id ?? body?.requestId ?? '');\n      const inboxResponse = await gatewayInboxCall(env, 'pull', requestId ? { request_id: requestId } : {});\n      return json(await inboxResponse.json(), inboxResponse.status);\n    }'''
          if old_route not in s:
              raise SystemExit('PC_PULL_ROUTE_NOT_FOUND')
          s = s.replace(old_route, new_route, 1)
          p.write_text(s)
          print('CORRELATION_SOURCE_PATCH_OK')

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "REQUEST_UNAVAILABLE" cloudflare/ax-control-runtime/src/index.ts
          grep -q "body?.request_id" cloudflare/ax-control-runtime/src/index.ts
          grep -q "requestedId || item.request_id === requestedId" cloudflare/ax-control-runtime/src/index.ts
          echo CORRELATION_SOURCE_VERIFY_OK

      - name: Commit source and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aerismusic8-alt'
          git config user.email 'aerismusic8-alt@users.noreply.github.com'
          git add cloudflare/ax-control-runtime/src/index.ts
          git rm .github/workflows/ax-apply-correlation-fix.yml
          git commit -m 'fix: enforce PC request correlation at runtime'
          git push origin HEAD:main
