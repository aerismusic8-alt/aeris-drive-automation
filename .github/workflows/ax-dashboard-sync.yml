name: AX Dashboard Sync
on:
  workflow_dispatch:
    inputs:
      event:
        required: false
        default: manual
      job_id:
        required: false
        default: ''
  push:
    paths:
      - 'dashboard/status.json'
      - 'AX_TRIGGER_REGISTRY.json'
      - 'AX_TASK_REGISTRY.json'
      - 'AX_ACTIVE_EXECUTIONS.json'
      - 'AX_DASHBOARD_SYNC.ps1'
      - '.github/workflows/ax-dashboard-sync.yml'
  schedule:
    - cron: '*/2 * * * *'
permissions:
  contents: write
concurrency:
  group: ax-dashboard-sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Sync AX runtime state to dashboard
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $event='push'
          $job=''
          if('${{ github.event_name }}' -eq 'workflow_dispatch'){$event='${{ inputs.event }}';$job='${{ inputs.job_id }}'}
          & "$PWD\AX_DASHBOARD_SYNC.ps1" -Event $event -JobId $job
      - name: Verify dashboard contracts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $sync=Get-Content -Raw 'dashboard/ax-sync.json'|ConvertFrom-Json
          if($sync.schema -ne 'AX_DASHBOARD_SYNC_V1' -or $sync.stateVerified -ne $true){throw 'DASHBOARD_SYNC_VERIFY_FAILED'}
          $queue=Get-Content -Raw 'dashboard/task-queue.json'|ConvertFrom-Json
          if($queue.schema -ne 'AX_TASK_QUEUE_V1' -or $queue.tasks -eq $null){throw 'DASHBOARD_QUEUE_CONTRACT_FAILED'}
          $activity=Get-Content -Raw 'dashboard/activity.json'|ConvertFrom-Json
          if($activity.schema -ne 'AX_ACTIVITY_V1' -or $activity.events -eq $null){throw 'DASHBOARD_ACTIVITY_CONTRACT_FAILED'}
          $agents=Get-Content -Raw 'dashboard/agents.json'|ConvertFrom-Json
          if($agents.schema -ne 'AX_AGENTS_V1' -or $agents.agents -eq $null){throw 'DASHBOARD_AGENT_CONTRACT_FAILED'}
          Write-Host "AX_DASHBOARD_CONTRACTS PASS tasks=$($queue.tasks.Count) events=$($activity.events.Count) agents=$($agents.agents.Count)"
      - name: Persist dashboard state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'AX Dashboard Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/ax-sync.json dashboard/task-queue.json dashboard/activity.json dashboard/agents.json
          if(git diff --cached --quiet){Write-Host 'No dashboard mutation'; exit 0}

          git stash push -u -m 'ax-dashboard-sync-generated-state'
          git fetch origin main
          git rebase origin/main
          git stash pop

          if(git status --porcelain --untracked-files=no){
            git add dashboard/ax-sync.json dashboard/task-queue.json dashboard/activity.json dashboard/agents.json
          }

          if(git diff --name-only --diff-filter=U){
            git checkout --theirs -- dashboard/ax-sync.json dashboard/task-queue.json dashboard/activity.json dashboard/agents.json 2>$null
            git add dashboard/ax-sync.json dashboard/task-queue.json dashboard/activity.json dashboard/agents.json
          }

          if(git diff --cached --quiet){Write-Host 'No dashboard mutation after rebase'; exit 0}
          git commit -m 'chore: update AX dashboard state'

          for($attempt=1;$attempt -le 3;$attempt++){
            git fetch origin main
            $behind = git rev-list --count HEAD..origin/main
            if([int]$behind -gt 0){ git rebase origin/main }
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){ Write-Host "AX_DASHBOARD_PUSH=PASS attempt=$attempt"; exit 0 }
            if($attempt -eq 3){ throw 'AX_DASHBOARD_PUSH_FAILED_AFTER_RETRIES' }
            Start-Sleep -Seconds 2
          }
