name: AX Mobile HTTPS Ingress Tests

on:
  push:
    branches:
      - feat/mobile-https-ingress
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - 'tests/cloudflare/**'
      - 'tests/AX_PC_MOBILE_BRIDGE.Tests.ps1'
      - 'AX_CONTROL_HUB/AX_PC_MOBILE_BRIDGE.ps1'
      - '.github/workflows/ax-mobile-ingress-tests.yml'
  pull_request:
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - 'tests/cloudflare/**'
      - 'tests/AX_PC_MOBILE_BRIDGE.Tests.ps1'
      - 'AX_CONTROL_HUB/AX_PC_MOBILE_BRIDGE.ps1'
      - '.github/workflows/ax-mobile-ingress-tests.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run mobile ingress contract
        run: node --experimental-transform-types tests/cloudflare/ax_mobile_ingress_contract_test_v3.mjs

  pc-bridge-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run PC mobile bridge contract
        shell: pwsh
        run: .\tests\AX_PC_MOBILE_BRIDGE.Tests.ps1

  cloudflare-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Worker configuration and TypeScript
        working-directory: cloudflare/ax-control-runtime
        run: npx wrangler@latest deploy --dry-run --name ax-control-runtime
