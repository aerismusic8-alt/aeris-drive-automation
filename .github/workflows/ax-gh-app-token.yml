name: AX GitHub App Token

# Mints a short-lived GitHub App installation token from the persisted app key,
# so automation never depends on a long-lived personal access token.
#
# Repository secrets required:
#   AERIS_GH_APP_KEY    full PEM contents of the app private key
#   AERIS_GH_APP_ID     the app id (also accepted as AERIS_GH_APP_CLIENT_ID)
#
# The key is written to the runner's temp directory only for the duration of
# the job and removed in an always() step.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ax-gh-app-token.yml'

permissions:
  contents: read

jobs:
  mint:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret presence
        shell: powershell
        env:
          APP_KEY: ${{ secrets.AERIS_GH_APP_KEY }}
        run: |
          if (-not $env:APP_KEY) {
            Write-Host "::error::MISSING_SECRET:AERIS_GH_APP_KEY is not set for this repository."
            Write-Host "Add it under Settings > Secrets and variables > Actions."
            exit 1
          }
          Write-Host "APP_KEY_PRESENT=true"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write key to a temporary file
        shell: powershell
        env:
          APP_KEY: ${{ secrets.AERIS_GH_APP_KEY }}
          APP_ID: ${{ secrets.AERIS_GH_APP_ID }}
          APP_CLIENT_ID: ${{ secrets.AERIS_GH_APP_CLIENT_ID }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'aeris-gh-app'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $pem = Join-Path $dir 'gh-app.pem'
          $cfg = Join-Path $dir 'gh-app.json'
          [IO.File]::WriteAllText($pem, $env:APP_KEY)

          $id = if ($env:APP_ID) { $env:APP_ID } else { $env:APP_CLIENT_ID }
          if (-not $id) { throw 'MISSING_SECRET:AERIS_GH_APP_ID' }

          # The token script reads client_id and installation_id from this file.
          $json = @{ client_id = $id; installation_id = $null } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($cfg, $json)
          Write-Host "KEY_STAGED=$dir"

      - name: Mint and verify installation token
        shell: powershell
        env:
          AERIS_GH_APP_KEY: ${{ runner.temp }}/aeris-gh-app/gh-app.pem
          AERIS_GH_APP_CONFIG: ${{ runner.temp }}/aeris-gh-app/gh-app.json
        run: |
          $token = (node scripts/gh-app-token.mjs 2>$null).Trim()
          if (-not $token) { throw 'TOKEN_MINT_FAILED' }
          Write-Host "TOKEN_LENGTH=$($token.Length)"

          $headers = @{ Authorization = "Bearer $token"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $repo = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/aerismusic8-alt/aeris-drive-automation'
          Write-Host "REPO_ACCESS=VERIFIED ($($repo.full_name))"

          $perms = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/installation/repositories'
          Write-Host "REPOS_VISIBLE=$($perms.total_count)"

      - name: Remove staged key
        if: always()
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'aeris-gh-app'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Write-Host "KEY_REMOVED=true"
