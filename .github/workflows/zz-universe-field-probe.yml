name: zz Universe Field Probe (temporary)

# One-off: dump the full Cloud v2 Universe object for both games, so the device
# flags and any other launch-blocking field can be read rather than guessed.
# Deleted once the answer is recorded.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump universe fields
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ]; then echo "NO_KEY"; exit 0; fi
          for U in 10772257179 10771844216; do
            echo "=================== universe $U ==================="
            curl -sS -m 20 -H "x-api-key: $ROBLOX_API_KEY" \
              "https://apis.roblox.com/cloud/v2/universes/$U" \
              -w "\nHTTP=%{http_code}\n" | head -c 3000
            echo
          done
