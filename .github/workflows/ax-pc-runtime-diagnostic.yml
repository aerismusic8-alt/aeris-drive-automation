name: AX PC Runtime Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      AERIS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbwz6F8EWTD7YwnGkyu4Mq_JHtBkk6nOwl9TYjWDsMsQTtS5EVj3I6hmakuW6yP_YGQH/exec
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect PC execution channel
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== AX PC RUNTIME DIAGNOSTIC ==='
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner Arch: $env:RUNNER_ARCH"
          Write-Host '--- Tools ---'
          foreach ($name in @('git','node','npm','npx','clasp','wrangler','gh')) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host "$name = $($cmd.Source)" } else { Write-Host "$name = NOT_FOUND" }
          }

      - name: Probe live Apps Script command contract
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $payloads = @(
            @{ command = 'CREATE_SAVEPOINT'; approved = $true },
            @{ command = 'SAVE_STATE'; approved = $true }
          )
          foreach ($p in $payloads) {
            $json = $p | ConvertTo-Json -Compress
            Write-Host "--- Probe $($p.command) ---"
            try {
              $r = Invoke-RestMethod -Uri $env:AERIS_WEB_APP_URL -Method Post -ContentType 'application/json' -Body $json -TimeoutSec 30
              $r | ConvertTo-Json -Depth 20 | Write-Host
            } catch {
              Write-Host "HTTP/transport failure: $($_.Exception.Message)"
            }
          }

      - name: Detect local Apps Script deployment capability
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- Apps Script deployment probe ---'
          $clasp = Get-Command clasp -ErrorAction SilentlyContinue
          if (-not $clasp) {
            Write-Host 'CLASP_NOT_INSTALLED'
            Write-Host 'RESULT=DEPLOYMENT_CAPABILITY_NOT_AVAILABLE'
            exit 0
          }
          clasp --version
          $cfg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '.clasp.json' -Force -ErrorAction SilentlyContinue
          if (-not $cfg) {
            Write-Host 'CLASP_CONFIG_NOT_FOUND'
            Write-Host 'RESULT=SCRIPT_ID_OR_CLASP_CONFIG_REQUIRED'
            exit 0
          }
          Write-Host 'CLASP_CONFIG_FOUND'
          Write-Host 'RESULT=DEPLOYMENT_CAPABILITY_PRESENT'

      - name: Summary
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host '=== DIAGNOSTIC COMPLETE ==='
          Write-Host 'No secrets or credential values are printed.'
