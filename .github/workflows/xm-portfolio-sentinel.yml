name: XM Portfolio Sentinel

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xm-portfolio-sentinel
  cancel-in-progress: false

env:
  XM_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev

jobs:
  sentinel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Discover Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Get-Command py.exe -ErrorAction SilentlyContinue).Source,
            (Get-Command python.exe -ErrorAction SilentlyContinue).Source,
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "C:\Python313\python.exe",
            "C:\Python312\python.exe",
            "C:\Python311\python.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $python = $candidates | Select-Object -First 1
          if (-not $python) { throw 'PYTHON_RUNTIME_NOT_FOUND' }
          Split-Path -Parent $python | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $python --version

      - name: Run XM market-data and backtest contract tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest AKATH.tests.xm_historical_backtest_tests AKATH.tests.xm_live_cycle_market_data_tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run XM observation and risk cycle
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = python "$env:GITHUB_WORKSPACE/AKATH/runtime/xm_live_cycle.py" --runtime-url "$env:XM_RUNTIME_URL"
          $exitCode = $LASTEXITCODE
          $output | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "XM_CYCLE_EXIT=$exitCode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $stateDir = Join-Path $HOME '.akath/xm'
          New-Item -ItemType Directory -Path $stateDir -Force | Out-Null
          $output | Out-File -LiteralPath (Join-Path $stateDir 'last-cycle.json') -Encoding utf8
          if ($exitCode -eq 1) { throw 'XM_CYCLE_EXECUTION_ERROR' }
          exit 0

      - name: Record sentinel contract
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Invoke-RestMethod -Uri "$env:XM_RUNTIME_URL/xm/status" -Method Get
          "XM_BRIDGE_MODE=$($status.mode)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "XM_LIVE_EXECUTION_ENABLED=$($status.live_execution_enabled)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "XM_KILL_SWITCH=$($status.kill_switch)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status.live_execution_enabled -ne $false) { throw 'XM_LIVE_EXECUTION_GUARD_CHANGED' }
