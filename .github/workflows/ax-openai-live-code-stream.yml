name: AX OpenAI Live Code Stream

on:
  push:
    branches: [main]
    paths:
      - 'AX_MULTI_AI_DISPATCH_QUEUE.json'
      - 'AKATH/runtime/ax_openai_code_writer.py'
      - 'AKATH/runtime/ax_openai_helper.py'
      - 'AKATH/runtime/ax_code_stream_writer.ps1'
      - 'dashboard/**'
      - '.github/workflows/ax-openai-live-code-stream.yml'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Coding task for OpenAI"
        required: true
        type: string
      file:
        description: "Target file"
        required: true
        default: "dashboard/index.html"
        type: string

permissions:
  contents: write

concurrency:
  group: ax-openai-live-code-stream
  cancel-in-progress: false

env:
  PROOF_FILE: AX_AI_EXECUTION_PROOF_OPENAI.json

jobs:
  code-stream:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve next READY OpenAI task
        shell: cmd
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_FILE: ${{ inputs.file }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& '%GITHUB_WORKSPACE%\scripts\AX_OPENAI_RESOLVE_TASK.ps1'"

      - name: Regression test code stream writer
        if: env.TASK_ID != ''
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\tests\AX_CODE_STREAM_WRITER_TARGET.Tests.ps1"

      - name: Run OpenAI coding worker
        if: env.TASK_ID != ''
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $prompt=Get-Content -Raw -LiteralPath $env:PROMPT_FILE; python AKATH/runtime/ax_openai_code_writer.py \"$prompt\" --task-id \"$env:TASK_ID\" --file \"$env:TARGET_FILE\""

      - name: Verify generated file
        if: env.TASK_ID != ''
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; if (-not (Test-Path -LiteralPath $env:TARGET_FILE)) { throw \"OPENAI_OUTPUT_MISSING file=$env:TARGET_FILE\" }; $lines=@(Get-Content -LiteralPath $env:TARGET_FILE); if ($lines.Count -eq 0) { throw \"OPENAI_OUTPUT_EMPTY file=$env:TARGET_FILE\" }; Write-Host \"AX_OPENAI_OUTPUT_VERIFIED task=$env:TASK_ID file=$env:TARGET_FILE lines=$($lines.Count)\""

      - name: Persist generated code and complete queue task
        if: env.TASK_ID != ''
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& '%GITHUB_WORKSPACE%\scripts\AX_OPENAI_PERSIST_TASK.ps1'"
