name: AX OpenAI Live Code Stream

on:
  push:
    branches: [main]
    paths:
      - 'AX_MULTI_AI_DISPATCH_QUEUE.json'
      - 'AKATH/runtime/ax_openai_code_writer.py'
      - 'AKATH/runtime/ax_openai_helper.py'
      - 'AKATH/runtime/ax_code_stream_writer.ps1'
      - '.github/workflows/ax-openai-live-code-stream.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Coding task for OpenAI"
        required: true
        type: string
      file:
        description: "Target file"
        required: true
        default: "dashboard/index.html"
        type: string

permissions:
  contents: write

concurrency:
  group: ax-openai-live-code-stream
  cancel-in-progress: false

jobs:
  code-stream:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve OpenAI task
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          $prompt = $env:INPUT_PROMPT
          $target = $env:INPUT_FILE
          $taskId = "MANUAL-OPENAI-$env:GITHUB_RUN_ID"
          if ($env:EVENT_NAME -ne 'workflow_dispatch') {
            $queue = Get-Content -Raw 'AX_MULTI_AI_DISPATCH_QUEUE.json' | ConvertFrom-Json
            $task = @($queue.tasks | Where-Object { $_.provider -eq 'OPENAI' }) | Select-Object -First 1
            if (-not $task) { throw 'OPENAI_QUEUE_TASK_NOT_FOUND' }
            $taskId = [string]$task.task_id
            $prompt = [string]$task.prompt
            $target = [string]$task.file
          }
          if ([string]::IsNullOrWhiteSpace($prompt)) { throw 'OPENAI_PROMPT_EMPTY' }
          if ([string]::IsNullOrWhiteSpace($target)) { throw 'OPENAI_TARGET_EMPTY' }
          "TASK_ID=$taskId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROMPT=$prompt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_FILE=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AX_OPENAI_TASK_READY task=$taskId file=$target"

      - name: Run OpenAI coding worker
        shell: powershell
        run: |
          python AKATH/runtime/ax_openai_code_writer.py "$env:PROMPT" --task-id "$env:TASK_ID" --file "$env:TARGET_FILE"

      - name: Verify generated file
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:TARGET_FILE)) { throw "OPENAI_OUTPUT_MISSING file=$env:TARGET_FILE" }
          $lines = @(Get-Content -LiteralPath $env:TARGET_FILE)
          if ($lines.Count -eq 0) { throw "OPENAI_OUTPUT_EMPTY file=$env:TARGET_FILE" }
          Write-Host "AX_OPENAI_OUTPUT_VERIFIED task=$env:TASK_ID file=$env:TARGET_FILE lines=$($lines.Count)"

      - name: Persist generated code and evidence
        shell: powershell
        run: |
          git config user.name 'AX OpenAI Live Code Stream'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$env:TARGET_FILE"
          if (git diff --cached --quiet -- "$env:TARGET_FILE") { throw "OPENAI_WRITEBACK_EMPTY file=$env:TARGET_FILE" }
          git commit -m "chore: persist OpenAI task=$env:TASK_ID run=$env:GITHUB_RUN_ID"
          git push origin HEAD:main
          Write-Host "AX_OPENAI_WRITEBACK_VERIFIED task=$env:TASK_ID file=$env:TARGET_FILE run=$env:GITHUB_RUN_ID"
