name: AX OpenAI Live Code Stream

on:
  push:
    branches: [main]
    paths:
      - 'AKATH/runtime/ax_openai_code_writer.py'
      - 'AKATH/runtime/ax_openai_helper.py'
      - 'AKATH/runtime/ax_code_stream_writer.ps1'
      - '.github/workflows/ax-openai-live-code-stream.yml'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Coding task for OpenAI"
        required: true
        type: string
      file:
        description: "Displayed target file name"
        required: true
        default: "AKATH/runtime/generated_task.py"
        type: string

permissions:
  contents: write

jobs:
  code-stream:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run OpenAI coding worker
        shell: powershell
        env:
          PROMPT: ${{ inputs.prompt || 'Write a tiny Python function named add that returns the sum of two integers. Return only the source code.' }}
          TARGET_FILE: ${{ inputs.file || 'AKATH/runtime/generated_task.py' }}
        run: |
          python AKATH/runtime/ax_openai_code_writer.py "$env:PROMPT" --task-id "OPENAI-${env:GITHUB_RUN_ID}" --file "$env:TARGET_FILE"
      - name: Persist generated code
        shell: powershell
        env:
          TARGET_FILE: ${{ inputs.file || 'AKATH/runtime/generated_task.py' }}
        run: |
          git config user.name 'AX OpenAI Live Code Stream'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$env:TARGET_FILE"
          if (-not (git diff --cached --quiet -- "$env:TARGET_FILE")) {
            git commit -m "chore: persist OpenAI code stream run=$env:GITHUB_RUN_ID"
            git push origin HEAD:main
            Write-Host "AX_OPENAI_CODE_WRITEBACK_PASS file=$env:TARGET_FILE run=$env:GITHUB_RUN_ID"
          } else {
            Write-Host "AX_OPENAI_CODE_WRITEBACK_SKIP file=$env:TARGET_FILE run=$env:GITHUB_RUN_ID"
          }
