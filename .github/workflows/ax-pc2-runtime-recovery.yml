name: AX PC2 Runtime Recovery

# Free-first pcsev path: GitHub Actions -> PC2 -> local executor -> proof.
# Apps Script / external control APIs are intentionally excluded from the critical path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc2-runtime-recovery:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AX_EXPECTED_PC2: DESKTOP-O0AUKHG
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify PC2 executor identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne $env:AX_EXPECTED_PC2) { throw 'PC2_EXECUTOR_IDENTITY_MISMATCH' }
          $executor = Join-Path $env:GITHUB_WORKSPACE 'AX_PC_CONTROL\AX_PC2_LOCAL_EXECUTOR_E2E.ps1'
          if (-not (Test-Path $executor)) { throw 'PC2_LOCAL_EXECUTOR_MISSING' }
          Write-Host 'PC2_EXECUTOR_IDENTITY=VERIFIED'
          Write-Host 'PC2_LOCAL_EXECUTOR_FILE=FOUND'

      - name: Execute one PC2 E2E without external runtime API
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $executor = Join-Path $env:GITHUB_WORKSPACE 'AX_PC_CONTROL\AX_PC2_LOCAL_EXECUTOR_E2E.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $executor
          $statePath = 'C:\AX-Runtime\AX-PC2-Worker-State.json'
          if (-not (Test-Path $statePath)) { throw 'PC2_WORKER_STATE_MISSING' }
          $state = Get-Content $statePath -Raw | ConvertFrom-Json
          $state | ConvertTo-Json -Depth 20 | Write-Host
          if ($state.status -ne 'COMPLETED') { throw "PC2_WORKER_E2E_NOT_COMPLETED:$($state.status)" }
          Write-Host 'PC2_WORKER_E2E=VERIFIED'
          Write-Host 'STATE=COMPLETED'

      - name: Verify PC2 evidence
        if: ${{ always() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Get-ChildItem 'C:\AX-Runtime\proof' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $proof) { throw 'LATEST_PROOF=NONE' }
          Write-Host "LATEST_PROOF=$($proof.FullName)"
          $proofData = Get-Content $proof.FullName -Raw | ConvertFrom-Json
          if ($proofData.verified -ne $true) { throw 'PC2_PROOF_NOT_VERIFIED' }
          if ($proofData.nodeId -ne 'PC2') { throw 'PC2_PROOF_NODE_MISMATCH' }
          Write-Host 'PC2_PROOF=VERIFIED'
