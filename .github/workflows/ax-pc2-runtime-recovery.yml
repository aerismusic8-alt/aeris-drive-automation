name: AX PC2 Runtime Recovery

# Runtime recovery explicitly bypasses host PowerShell policy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc2-runtime-recovery:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AX_EXPECTED_PC2: DESKTOP-O0AUKHG
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify PC2 worker path
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne $env:AX_EXPECTED_PC2) { throw 'PC2_EXECUTOR_IDENTITY_MISMATCH' }
          $runtime = 'C:\AX-Runtime\AX_PC2_WORKER_V2.ps1'
          if (-not (Test-Path $runtime)) { throw 'PC2_WORKER_RUNTIME_FILE_MISSING' }
          Write-Host 'PC2_RUNTIME_FILE=FOUND'
          $text = Get-Content -Raw $runtime
          if ($text -notmatch "'NODE_E2E_TEST'") {
            $backup = "$runtime.bak-before-node-e2e-fix-$(Get-Date -Format yyyyMMddHHmmss)"
            Copy-Item $runtime $backup -Force
            $text = $text -replace "('CREATE_LOCAL_PROOF' \{ \})", "`$1`r`n    'NODE_E2E_TEST' { }"
            Set-Content -Path $runtime -Value $text -Encoding UTF8
          }
          if ((Get-Content -Raw $runtime) -notmatch "'NODE_E2E_TEST'") { throw 'NODE_E2E_TEST_ALLOWLIST_NOT_VERIFIED' }
          Write-Host 'NODE_E2E_TEST_ALLOWLIST=VERIFIED'
      - name: Patch PC2 worker Node action compatibility
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'C:\AX-Runtime\AX_PC2_WORKER_V2.ps1'
          $text = Get-Content -Raw $runtime
          $needle = '  $r = Invoke-RestMethod -Uri $ApiUrl -Method Post -Headers (Headers) -Body ($body | ConvertTo-Json -Depth 20 -Compress) -TimeoutSec 30'
          $compatLines = @(
            '# AX_NODE_ACTION_COMPAT_V3'
            'if ($body -ne $null) {'
            '  $hasAction = $false'
            '  if ($body.PSObject.Properties.Name -contains ''action'') {'
            '    $hasAction = -not [string]::IsNullOrWhiteSpace([string]$body.action)'
            '  }'
            '  if (-not $hasAction) {'
            '    $derivedAction = '''''
            '    $delegationId = Get-PropertyValue $body ''delegationJobId'''
            '    $executionValue = Get-PropertyValue $body ''execution'''
            '    $statusValue = Get-PropertyValue $body ''status'''
            '    $versionValue = Get-PropertyValue $body ''version'''
            '    if (-not [string]::IsNullOrWhiteSpace([string]$delegationId) -and $executionValue -ne $null) {'
            '      $derivedAction = ''node_complete'''
            '    } elseif (-not [string]::IsNullOrWhiteSpace([string]$statusValue) -or -not [string]::IsNullOrWhiteSpace([string]$versionValue)) {'
            '      $derivedAction = ''node_heartbeat'''
            '    } else {'
            '      $derivedAction = ''node_pull'''
            '    }'
            '    $body | Add-Member -NotePropertyName ''action'' -NotePropertyValue $derivedAction -Force'
            '    Write-Host "[PC2] NODE_ACTION_COMPAT=$derivedAction"'
            '  }'
            '}'
          )
          $compat = $compatLines -join "`r`n"
          $needleIndex = $text.IndexOf($needle, [StringComparison]::Ordinal)
          if ($needleIndex -lt 0) { throw 'NODE_ACTION_COMPAT_INJECTION_POINT_NOT_FOUND' }
          $v1Index = $text.IndexOf('# AX_NODE_ACTION_COMPAT_V1', [StringComparison]::Ordinal)
          $v2Index = $text.IndexOf('# AX_NODE_ACTION_COMPAT_V2', [StringComparison]::Ordinal)
          $v3Index = $text.IndexOf('# AX_NODE_ACTION_COMPAT_V3', [StringComparison]::Ordinal)
          $startIndex = $needleIndex
          foreach ($candidate in @($v1Index, $v2Index, $v3Index)) {
            if ($candidate -ge 0 -and $candidate -lt $startIndex) { $startIndex = $candidate }
          }
          $backup = "$runtime.bak-before-node-action-compat-v4-$(Get-Date -Format yyyyMMddHHmmss)"
          Copy-Item $runtime $backup -Force
          $text = $text.Substring(0, $startIndex) + $compat + "`r`n" + $text.Substring($needleIndex)
          Set-Content -Path $runtime -Value $text -Encoding UTF8
          $patched = Get-Content -Raw $runtime
          $remainingBad = $patched -match '# AX_NODE_ACTION_COMPAT_V1' -or $patched -match '# AX_NODE_ACTION_COMPAT_V2'
          if ($remainingBad) { throw 'NODE_ACTION_COMPAT_STALE_BLOCK_REMAINS' }
          if ($patched -notmatch '# AX_NODE_ACTION_COMPAT_V3') { throw 'NODE_ACTION_COMPAT_V3_NOT_VERIFIED' }
          $compatStart = $patched.IndexOf('# AX_NODE_ACTION_COMPAT_V3', [StringComparison]::Ordinal)
          $compatEnd = $patched.IndexOf($needle, $compatStart, [StringComparison]::Ordinal)
          if ($compatEnd -lt 0) { throw 'NODE_ACTION_COMPAT_NEEDLE_AFTER_V3_NOT_FOUND' }
          $compatBlock = $patched.Substring($compatStart, $compatEnd - $compatStart)
          if ($compatBlock -match 'if \(\.PSObject\.Properties' -or $compatBlock -match '\| Add-Member.*-NotePropertyValue\s+-Force') { throw 'NODE_ACTION_COMPAT_V4_MALFORMED' }
          if ($compatBlock -notmatch '\$body\.PSObject\.Properties\.Name') { throw 'NODE_ACTION_COMPAT_V4_BODY_ACTION_CHECK_MISSING' }
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($patched, [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ('NODE_WORKER_POWERSHELL_PARSE_FAILED:' + (($parseErrors | ForEach-Object Message) -join '; ')) }
          Write-Host 'NODE_ACTION_COMPAT_V4=VERIFIED'
          Write-Host 'NODE_WORKER_POWERSHELL_PARSE=VERIFIED'
      - name: Inspect PC2 worker Node API contract
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'C:\AX-Runtime\AX_PC2_WORKER_V2.ps1'
          $lines = Get-Content $runtime
          Write-Host '--- WORKER API/COMMAND LINES ---'
          $lines | Where-Object { $_ -match 'AX_NODE_ACTION_COMPAT_V3|NODE_ACTION_COMPAT|NODE_API|UNKNOWN_COMMAND|allowlist|Invoke-RestMethod|command|action|apiUrl|endpoint' } | Select-Object -First 160 | ForEach-Object { Write-Host $_ }
          Write-Host '--- WORKER END ---'
      - name: Execute one PC2 worker E2E
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'C:\AX-Runtime\AX_PC2_WORKER_V2.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $worker -Once
          if (-not (Test-Path 'C:\AX-Runtime\AX-PC2-Worker-State.json')) { throw 'PC2_WORKER_STATE_MISSING' }
          $state = Get-Content 'C:\AX-Runtime\AX-PC2-Worker-State.json' -Raw | ConvertFrom-Json
          $state | ConvertTo-Json -Depth 20 | Write-Host
          if ($state.status -ne 'COMPLETED') { throw "PC2_WORKER_E2E_NOT_COMPLETED:$($state.status)" }
          Write-Host 'PC2_WORKER_E2E=VERIFIED'
      - name: Verify PC2 evidence
        if: ${{ always() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'C:\AX-Runtime\AX-PC2-Worker-V2.log'
          if (Test-Path $logPath) { Get-Content $logPath -Tail 50 | ForEach-Object { Write-Host $_ } }
          $proof = Get-ChildItem 'C:\AX-Runtime\proof' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($proof) { Write-Host "LATEST_PROOF=$($proof.FullName)" }
          else { Write-Host 'LATEST_PROOF=NONE' }
