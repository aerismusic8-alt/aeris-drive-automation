name: AX PC2 Runtime Recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc2-runtime-recovery:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      AX_EXPECTED_PC2: DESKTOP-RGK6JKB
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Identify runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          if ($env:COMPUTERNAME -ne $env:AX_EXPECTED_PC2) {
            Write-Host 'THIS_RUNNER_IS_NOT_PC2'
            exit 0
          }
          Write-Host 'PC2_RUNNER_CONFIRMED'

      - name: Repair and verify PC2 worker safe test path
        if: env.COMPUTERNAME == 'DESKTOP-RGK6JKB'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'C:\AX-Runtime\AX_PC2_WORKER_V2.ps1'
          if (-not (Test-Path $runtime)) { throw 'PC2_WORKER_RUNTIME_FILE_MISSING' }
          $backup = "$runtime.bak-before-node-e2e-fix-$(Get-Date -Format yyyyMMddHHmmss)"
          Copy-Item $runtime $backup -Force
          $text = Get-Content -Raw $runtime
          if ($text -notmatch "'NODE_E2E_TEST'") {
            $needle = "    'TEST_EXECUTION' { }`r`n    'CREATE_LOCAL_PROOF' { }"
            if ($text.Contains($needle)) {
              $text = $text.Replace($needle, "    'TEST_EXECUTION' { }`r`n    'CREATE_LOCAL_PROOF' { }`r`n    'NODE_E2E_TEST' { }")
            } else {
              $needle = "    'TEST_EXECUTION' { }`n    'CREATE_LOCAL_PROOF' { }"
              if (-not $text.Contains($needle)) { throw 'SAFE_ALLOWLIST_ANCHOR_NOT_FOUND' }
              $text = $text.Replace($needle, "    'TEST_EXECUTION' { }`n    'CREATE_LOCAL_PROOF' { }`n    'NODE_E2E_TEST' { }")
            }
            Set-Content -Path $runtime -Value $text -Encoding UTF8
          }
          $verify = Get-Content -Raw $runtime
          if ($verify -notmatch "'NODE_E2E_TEST'") { throw 'SAFE_ALLOWLIST_FIX_NOT_VERIFIED' }
          Write-Host 'NODE_E2E_TEST_SAFE_ALLOWLIST=VERIFIED'
          Write-Host "WORKER_BACKUP=$backup"

      - name: Execute one PC2 node E2E job
        if: env.COMPUTERNAME == 'DESKTOP-RGK6JKB'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'C:\AX-Runtime\AX_PC2_WORKER_V2.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $worker -Once
          $state = Get-Content 'C:\AX-Runtime\AX-PC2-Worker-State.json' -Raw | ConvertFrom-Json
          $state | ConvertTo-Json -Depth 20 | Write-Host
          if ($state.status -ne 'COMPLETED') { throw "PC2_WORKER_E2E_NOT_COMPLETED:$($state.status)" }
          Write-Host 'PC2_WORKER_E2E=VERIFIED'

      - name: Verify PC2 evidence
        if: env.COMPUTERNAME == 'DESKTOP-RGK6JKB'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Get-Content 'C:\AX-Runtime\AX-PC2-Worker-V2.log' -Tail 30
          $log | ForEach-Object { Write-Host $_ }
          $proof = Get-ChildItem 'C:\AX-Runtime\proof' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $proof) { throw 'PC2_PROOF_MISSING' }
          Write-Host "LATEST_PROOF=$($proof.FullName)"
          Write-Host 'PC2_RUNTIME_RECOVERY=VERIFIED'
