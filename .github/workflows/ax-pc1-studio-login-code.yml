name: AX PC1 Studio Login Code Extract

# Fast path for Quick Sign-In: start Studio, then read the cross-device code
# straight out of Studio's own log instead of screenshotting and decoding.
#
# A screenshot round trip costs minutes; the code lives about two minutes. If
# Studio logs the code, it can be printed seconds after it is generated.
#
# This prints a sign-in code, which is a credential-equivalent. It is emitted
# only so the account owner can type it on their own phone.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ax-pc1-studio-login-code.yml'

jobs:
  extract:
    runs-on: self-hosted
    steps:
      - name: Verify PC1
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-RGK6JKB') { throw "EXPECTED_PC1:$env:COMPUTERNAME" }
          Write-Host "PC1=VERIFIED"

      - name: Start Studio and read the cross-device code from its log
        shell: powershell
        run: |
          $studio = Get-ChildItem 'C:\Users\User\AppData\Local\Roblox\Versions' -Recurse -Filter 'RobloxStudioBeta.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$studio) { throw 'STUDIO_NOT_FOUND' }
          Write-Host "STUDIO_EXE=$studio"

          Get-Process -Name 'RobloxStudioBeta' -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

          $logDir = 'C:\Users\User\AppData\Local\Roblox\logs'
          $before = (Get-Date).ToUniversalTime()

          # Launch in the interactive session, then poll the newest log.
          $u = (Get-CimInstance Win32_ComputerSystem).UserName
          $sid = ([System.Security.Principal.NTAccount]$u).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $runner = 'C:\AX-Build\start-studio.ps1'
          New-Item -ItemType Directory -Path 'C:\AX-Build' -Force | Out-Null
          Set-Content -LiteralPath $runner -Encoding UTF8 -Value @'
param([string]$StudioExe)
Start-Process -FilePath $StudioExe | Out-Null
'@
          $name = 'AERIS-PC1-START-STUDIO'
          Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          $arg = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{0}" -StudioExe "{1}"' -f $runner, $studio
          Register-ScheduledTask -TaskName $name -Action (New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $arg) `
            -Principal (New-ScheduledTaskPrincipal -UserId $sid -LogonType Interactive -RunLevel Limited) `
            -Settings (New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 3)) -Force | Out-Null
          Start-ScheduledTask -TaskName $name

          # Poll for the code for up to 100 seconds.
          $pattern = 'crossdevice[^"]*code[=%]*(?<code>[A-Z0-9]{6})|code[=%](?<code2>[A-Z0-9]{6})'
          $deadline = (Get-Date).AddSeconds(100)
          $found = $false
          while ((Get-Date) -lt $deadline -and !$found) {
            Start-Sleep -Seconds 5
            $logs = Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -gt $before.AddSeconds(-5) } |
              Sort-Object LastWriteTime -Descending
            foreach ($lg in $logs) {
              $hits = Select-String -LiteralPath $lg.FullName -Pattern 'crossdevice', 'QuickSignIn', 'LoginCode', 'crossDevice' -ErrorAction SilentlyContinue
              foreach ($h in $hits) {
                Write-Host ("LOG_HIT[{0}]: {1}" -f $lg.Name, $h.Line.Trim())
                $found = $true
              }
            }
          }

          if (!$found) { Write-Host 'NO_CODE_IN_LOG' }
          Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          Write-Host 'EXTRACT=COMPLETE'
