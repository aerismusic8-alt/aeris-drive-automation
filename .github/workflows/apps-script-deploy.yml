name: Deploy Apps Script via clasp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'AX_UNIVERSAL_INPUT_GATEWAY.gs'
      - 'AERIS_Code.gs'
      - 'AERIS_Delegation_Scope_Compat.gs'
      - 'appsscript.json'
      - '.clasp.json'
      - '.github/workflows/apps-script-deploy.yml'

permissions:
  contents: write

env:
  AERIS_SCRIPT_ID: '1TYdTy1uorI5cyTlEamp13ZDI0kgStdRFUYuXpia29W4iFN3BNtpjAt4h'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy with diagnostic stages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ops
          STAGE="CHECKOUT"

          write_sentinel() {
            local stage="$1"
            local status="$2"
            cat > ops/apps-script-deploy-sentinel.json <<EOF
          {
            "workflow": "apps-script-deploy",
            "stage": "${status}",
            "last_stage": "${stage}",
            "commit": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          }

          finalize_sentinel() {
            local rc=$?
            if [ "$rc" -eq 0 ]; then
              write_sentinel "$STAGE" "COMPLETED"
            else
              write_sentinel "$STAGE" "FAILED"
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ops/apps-script-deploy-sentinel.json
            git commit -m "ci: record Apps Script deploy ${STAGE}" || true
            git push || true
            exit "$rc"
          }
          trap finalize_sentinel EXIT

          STAGE="SCOPE_REGRESSION"
          node --test tests/AERIS_Delegation_Scope_Compat.test.mjs

          STAGE="PREPARE_CLASP"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$AERIS_SCRIPT_ID" > .clasp.json

          STAGE="CLASP_INSTALL"
          npm install --global @google/clasp

          STAGE="OAUTH_CREDENTIAL_CHECK"
          test -n "${{ secrets.CLASPRC_JSON }}" || { echo 'CLASPRC_CREDENTIALS secret is required'; exit 1; }
          printf '%s' "${{ secrets.CLASPRC_JSON }}" > "$HOME/.clasprc.json"

          STAGE="CLASP_PUSH"
          clasp push --force

          STAGE="CLASP_STATUS"
          clasp status

          STAGE="PRODUCTION_DEPLOYMENT_VERIFIED"
