name: Deploy Apps Script via clasp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'AX_UNIVERSAL_INPUT_GATEWAY.gs'
      - 'AERIS_Code.gs'
      - 'AERIS_Delegation_Scope_Compat.gs'
      - 'appsscript.json'
      - '.clasp.json'
      - '.github/workflows/apps-script-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Record deployment start
        shell: bash
        run: |
          mkdir -p ops
          cat > ops/apps-script-deploy-sentinel.json <<EOF
          {
            "workflow": "apps-script-deploy",
            "stage": "STARTED",
            "commit": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/apps-script-deploy-sentinel.json
          git commit -m 'ci: record Apps Script deployment start' || true
          git push

      - name: Run AERIS scope regression
        run: node --test tests/AERIS_Delegation_Scope_Compat.test.mjs

      - name: Prepare clasp project
        shell: bash
        run: |
          test -n "$SCRIPT_ID" || { echo 'SCRIPT_ID secret is required'; exit 1; }
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.AERIS_APPS_SCRIPT_ID }}

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Authenticate clasp
        shell: bash
        run: |
          test -n "$CLASP_CREDENTIALS" || { echo 'CLASP_CREDENTIALS secret is required'; exit 1; }
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASPRC_JSON }}

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Verify project content
        run: clasp status

      - name: Record deployment success
        if: ${{ success() }}
        shell: bash
        run: |
          cat > ops/apps-script-deploy-sentinel.json <<EOF
          {
            "workflow": "apps-script-deploy",
            "stage": "COMPLETED",
            "commit": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/apps-script-deploy-sentinel.json
          git commit -m 'ci: record Apps Script deployment success'
          git push
