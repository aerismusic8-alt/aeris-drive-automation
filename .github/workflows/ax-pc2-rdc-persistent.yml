name: AX PC2 RDC Persistent Agent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ax-pc2-rdc-persistent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-rdc-persistent:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    steps:
      - name: Inspect PC2 runtime identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== AX RDC PERSISTENT SETUP ==="
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "USERNAME=$env:USERNAME"
          Write-Host "WHOAMI=$([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host "INTERACTIVE_USER=$($cs.UserName)"
          node --version
          npm --version
          Write-Host "=== CURRENT RDC PROCESSES ==="
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -match 'desktop-commander.*remote|@wonderwhy-er/desktop-commander.*remote' } |
            Select-Object ProcessId,Name,CommandLine |
            Format-List

      - name: Install persistent RDC logon task
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskName = 'AX-RDC-PERSISTENT'
          $cs = Get-CimInstance Win32_ComputerSystem
          $user = [string]$cs.UserName
          if ([string]::IsNullOrWhiteSpace($user)) {
            throw 'NO_INTERACTIVE_USER'
          }
          $root = 'C:\AX-Runtime\RDC'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $wrapper = Join-Path $root 'Start-RDC-Persistent.ps1'
          @'
$ErrorActionPreference = 'Continue'
$log = 'C:\AX-Runtime\RDC\rdc-agent.log'
while ($true) {
  Add-Content -Path $log -Value "$(Get-Date -Format o) START RDC"
  try {
    & powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "npx @wonderwhy-er/desktop-commander@latest remote" *>> $log
  } catch {
    Add-Content -Path $log -Value "$(Get-Date -Format o) ERROR $($_.Exception.Message)"
  }
  Add-Content -Path $log -Value "$(Get-Date -Format o) RDC EXIT; RETRY 10s"
  Start-Sleep -Seconds 10
}
'@ | Set-Content -Path $wrapper -Encoding UTF8
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Normal -File `"$wrapper`""
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
          $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType InteractiveToken -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
          $t = Get-ScheduledTask -TaskName $taskName
          Write-Host "TASK_NAME=$($t.TaskName)"
          Write-Host "TASK_STATE=$($t.State)"
          Write-Host "TASK_USER=$user"
          Write-Host "TASK_ACTION=$($t.Actions.Execute) $($t.Actions.Arguments)"

      - name: Start persistent RDC agent now
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskName = 'AX-RDC-PERSISTENT'
          Start-ScheduledTask -TaskName $taskName
          Start-Sleep -Seconds 8
          $t = Get-ScheduledTask -TaskName $taskName
          Write-Host "TASK_AFTER_START=$($t.State)"
          Write-Host "=== RDC PROCESSES AFTER START ==="
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -match 'desktop-commander.*remote|@wonderwhy-er/desktop-commander.*remote' } |
            Select-Object ProcessId,Name,CommandLine |
            Format-List
          if (Test-Path 'C:\AX-Runtime\RDC\rdc-agent.log') {
            Get-Content 'C:\AX-Runtime\RDC\rdc-agent.log' -Tail 40
          }
