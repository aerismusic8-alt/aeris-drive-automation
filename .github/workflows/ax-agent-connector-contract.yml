name: AX Agent Connector Contract

on:
  push:
    paths:
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_ROUTING_BRIDGE.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_AGENT_DISPATCH.Tests.ps1'
      - 'tests/AX_AGENT_CONNECTOR_CONTRACT.Tests.ps1'
      - '.github/workflows/ax-agent-connector-contract.yml'
  pull_request:
    paths:
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_ROUTING_BRIDGE.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_AGENT_DISPATCH.Tests.ps1'
      - 'tests/AX_AGENT_CONNECTOR_CONTRACT.Tests.ps1'
      - '.github/workflows/ax-agent-connector-contract.yml'
  workflow_dispatch:

jobs:
  contract-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch contract
        shell: pwsh
        run: ./tests/AX_AGENT_DISPATCH.Tests.ps1
      - name: Connector contract
        shell: pwsh
        run: ./tests/AX_AGENT_CONNECTOR_CONTRACT.Tests.ps1
