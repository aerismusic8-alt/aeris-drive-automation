name: AX Web Result Auth Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ax-web-result-auth-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch web result route and regression guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('cloudflare/ax-control-runtime/src/index.ts')
          text = src.read_text(encoding='utf-8')
          old = """if (request.method === 'GET' && url.pathname.startsWith('/web/result/')) {\n  const denied = await requireWebSession(request, env); if (denied) return denied;\n  const requestId = decodeURIComponent(url.pathname.slice('/web/result/'.length)); if (!requestId) return json({ error: 'REQUEST_ID_REQUIRED' }, 422);\n  const resultResponse = await gatewayInboxCall(env, 'result-get/', undefined, requestId);\n  return json(await resultResponse.json(), resultResponse.status);\n}"""
          new = """if (request.method === 'GET' && url.pathname.startsWith('/web/result/')) {\n  const requestId = decodeURIComponent(url.pathname.slice('/web/result/'.length));\n  if (!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(requestId)) return json({ error: 'REQUEST_ID_INVALID' }, 422);\n  const resultResponse = await gatewayInboxCall(env, 'result-get/', undefined, requestId);\n  return json(await resultResponse.json(), resultResponse.status);\n}"""
          if old not in text:
              raise SystemExit('expected web result route was not found; refusing to patch')
          src.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs')
          t = test.read_text(encoding='utf-8')
          marker = "assert(webChatSource.includes(\"$('file').addEventListener('change'\"), 'web chat file picker must react to file selection');"
          addition = marker + "\n\nconst webResultRouteStart = source.indexOf(\"if (request.method === 'GET' && url.pathname.startsWith('/web/result/')\")\nassert(webResultRouteStart >= 0, 'web result route must be present');\nconst webResultRoute = source.slice(webResultRouteStart, source.indexOf('}', webResultRouteStart) + 1);\nassert(!webResultRoute.includes('requireWebSession'), 'web result polling must not depend on a browser session after gateway acceptance');\nassert(webResultRoute.includes('REQUEST_ID_INVALID'), 'web result route must validate the request id before lookup');"
          if marker not in t:
              raise SystemExit('expected web chat test marker was not found; refusing to patch')
          test.write_text(t.replace(marker, addition, 1), encoding='utf-8')
          print('patched')
          PY

      - name: Run source regression guard
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ax-web-result-auth-repair.yml
          git add cloudflare/ax-control-runtime/src/index.ts cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs .github/workflows/ax-web-result-auth-repair.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m "fix: decouple web result polling from session auth"
          git push
