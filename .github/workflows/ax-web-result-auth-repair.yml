name: AX Web Result Auth Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ax-web-result-auth-repair.yml'
      - 'cloudflare/ax-control-runtime/wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: ax-control-runtime
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Patch web result route and regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('cloudflare/ax-control-runtime/src/index.ts')
          text = src.read_text(encoding='utf-8')
          pattern = r"if \(request\.method === 'GET' && url\.pathname\.startsWith\('/web/result/'\)\) \{.*?\n\}"
          replacement = """if (request.method === 'GET' && url.pathname.startsWith('/web/result/')) {
  const requestId = decodeURIComponent(url.pathname.slice('/web/result/'.length));
  if (!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(requestId)) return json({ error: 'REQUEST_ID_INVALID' }, 422);
  const resultResponse = await gatewayInboxCall(env, 'result-get/', undefined, requestId);
  return json(await resultResponse.json(), resultResponse.status);
}"""
          text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('expected web result route was not found; refusing to patch')
          src.write_text(text2, encoding='utf-8')

          test = Path('cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs')
          t = test.read_text(encoding='utf-8')
          marker = "assert(webChatSource.includes(\"$('file').addEventListener('change'\"), 'web chat file picker must react to file selection');"
          if 'web result polling must not depend on a browser session after gateway acceptance' not in t:
              if marker not in t:
                  raise SystemExit('expected web chat test marker was not found; refusing to patch')
              addition = marker + "\n\nconst webResultRouteStart = source.indexOf(\"if (request.method === 'GET' && url.pathname.startsWith('/web/result/')\")\nassert(webResultRouteStart >= 0, 'web result route must be present');\nconst webResultRouteEnd = source.indexOf(\"\n    if (request.method === 'POST' && url.pathname === '/mobile/input')\", webResultRouteStart);\nconst webResultRoute = source.slice(webResultRouteStart, webResultRouteEnd);\nassert(!webResultRoute.includes('requireWebSession'), 'web result polling must not depend on a browser session after gateway acceptance');\nassert(webResultRoute.includes('REQUEST_ID_INVALID'), 'web result route must validate the request id before lookup');"
              test.write_text(t.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Run source regression guard
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs

      - name: Deploy repaired AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --name "$WORKER_NAME"

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(process.env.AX_CONTROL_RUNTIME_URL + '/health');
          if (!response.ok) throw new Error('HEALTH_HTTP_'+response.status);
          const r = await response.json();
          console.log(JSON.stringify({status:r.status,version:r.version,mode:r.mode,webChat:r.webChat,webChatAuthConfigured:r.webChatAuthConfigured},null,2));
          if (r.status !== 'ONLINE' || r.mode !== 'FREE_ONLY' || r.webChat !== true || r.webChatAuthConfigured !== true) process.exit(1);
          NODE

      - name: Persist repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ax-web-result-auth-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/ax-control-runtime/src/index.ts cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs .github/workflows/ax-web-result-auth-repair.yml
          if git diff --cached --quiet; then
            echo 'No persistence changes required.'
          else
            git commit -m "fix: decouple web result polling from session auth"
            git push
          fi
