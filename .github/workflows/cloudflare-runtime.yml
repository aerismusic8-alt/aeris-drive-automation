name: AX Cloudflare Control Runtime

# POST-MERGE VERIFICATION TRIGGER: this workflow is intentionally push-enabled on main.
# Cloudflare deployment runs on GitHub-hosted Linux; PC execution remains on the
# existing self-hosted Windows runner workflows and is verified separately.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - '.github/workflows/cloudflare-runtime.yml'
      - 'AX_RESOURCE_GOVERNOR.json'
      - 'AX_CLOUDFLARE_DISPATCH_ADAPTER.ps1'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
      WORKER_NAME: ax-control-runtime
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      QUEUE_NAME: ax-execution-events

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Verify Node and Wrangler
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npx wrangler@latest --version

      - name: Verify ingress secrets configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AX_MOBILE_INGRESS_SECRET}" ]]; then exit 1; fi
          if [[ -z "${AX_PC_PULL_SECRET}" ]]; then exit 1; fi
          if (( ${#AX_MOBILE_INGRESS_SECRET} < 32 )); then exit 1; fi
          if (( ${#AX_PC_PULL_SECRET} < 32 )); then exit 1; fi
          echo 'Ingress secrets are configured and length policy passed. Values are never printed.'

      - name: Ensure AX Queue exists
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          if ! npx wrangler@latest queues info "$QUEUE_NAME" >/tmp/ax-queue-info.txt 2>&1; then
            npx wrangler@latest queues create "$QUEUE_NAME" --message-retention-period-secs 3600
          fi
          npx wrangler@latest queues info "$QUEUE_NAME"

      - name: Validate AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --dry-run --name "$WORKER_NAME"

      - name: Deploy AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --name "$WORKER_NAME"

      - name: Configure Worker ingress secrets
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          printf '%s' "$AX_MOBILE_INGRESS_SECRET" | npx wrangler@latest secret put AX_MOBILE_INGRESS_SECRET --name "$WORKER_NAME"
          printf '%s' "$AX_PC_PULL_SECRET" | npx wrangler@latest secret put AX_PC_PULL_SECRET --name "$WORKER_NAME"

      - name: Verify AX Control Runtime Health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            if node <<'NODE'
          const url = process.env.AX_CONTROL_RUNTIME_URL + '/health';
          const response = await fetch(url);
          if (!response.ok) process.exit(1);
          const r = await response.json();
          console.log('Status:', r.status);
          console.log('Mode:', r.mode);
          console.log('Live Financial Execution:', r.liveFinancialExecution);
          console.log('Mobile Ingress Auth Configured:', r.mobileIngressAuthConfigured);
          console.log('PC Pull Auth Configured:', r.pcPullAuthConfigured);
          const ok = r.status === 'ONLINE' && r.mode === 'FREE_ONLY' && r.liveFinancialExecution === false && r.mobileIngressAuthConfigured === true && r.pcPullAuthConfigured === true && r.gatewayInbox === 'AX_GATEWAY_INBOX';
          if (!ok) process.exit(1);
          NODE
            then
              echo 'AX Control Runtime health verification passed.'
              break
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo 'AX_CONTROL_RUNTIME_HEALTH_VERIFICATION_FAILED'
              exit 1
            fi
            sleep 5
          done

      - name: Verify Existing AERIS External Runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://aeris-execution-runtime.aerismusic8.workers.dev';
          try {
            const response = await fetch(url);
            const r = await response.json();
            if (r.status !== 'ONLINE') throw new Error('EXISTING_AERIS_RUNTIME_NOT_ONLINE');
            console.log('Existing AERIS External Runtime: VERIFIED ONLINE');
          } catch (error) {
            console.log(`WARNING: Existing runtime verification failed: ${error.message}`);
            console.log('New AX Control Runtime remains independently deployed.');
          }
          NODE

      - name: Deployment Summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AX CONTROL RUNTIME DEPLOYMENT VERIFIED'
          echo "Control Worker: $WORKER_NAME"
          echo "Control Runtime: $AX_CONTROL_RUNTIME_URL"
          echo 'Mobile ingress: authenticated'
          echo 'PC pull/ack: authenticated'
          echo 'Transport store: AX_GATEWAY_INBOX'
          echo 'Execution mode: FREE_ONLY'
          echo 'Live financial execution: DISABLED'
          echo 'Existing AERIS External Execution Runtime remains a separate boundary.'
