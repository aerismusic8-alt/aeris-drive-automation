name: AX Cloudflare Control Runtime

# POST-MERGE VERIFICATION TRIGGER: this workflow is intentionally push-enabled on main.
# A source change under this workflow file causes a real deployment execution path.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - '.github/workflows/cloudflare-runtime.yml'
      - 'AX_RESOURCE_GOVERNOR.json'
      - 'AX_CLOUDFLARE_DISPATCH_ADAPTER.ps1'

permissions:
  contents: read

concurrency:
  group: ax-cloudflare-control-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
      WORKER_NAME: ax-control-runtime
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      QUEUE_NAME: ax-execution-events

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Verify Node and Wrangler
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          npm --version
          npx wrangler@latest --version
          if ($LASTEXITCODE -ne 0) { throw 'WRANGLER_VERSION_CHECK_FAILED' }

      - name: Verify ingress secrets configured
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AX_MOBILE_INGRESS_SECRET)) { throw 'AX_MOBILE_INGRESS_SECRET_NOT_CONFIGURED' }
          if ([string]::IsNullOrWhiteSpace($env:AX_PC_PULL_SECRET)) { throw 'AX_PC_PULL_SECRET_NOT_CONFIGURED' }
          if ($env:AX_MOBILE_INGRESS_SECRET.Length -lt 32) { throw 'AX_MOBILE_INGRESS_SECRET_TOO_SHORT' }
          if ($env:AX_PC_PULL_SECRET.Length -lt 32) { throw 'AX_PC_PULL_SECRET_TOO_SHORT' }
          Write-Host 'Ingress secrets are configured and length policy passed. Values are never printed.'

      - name: Ensure AX Queue exists
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $queueExists = $false
          try {
            $ErrorActionPreference = 'Continue'
            npx wrangler@latest queues info $env:QUEUE_NAME 2>&1 | Out-Host
            $queueInfoExitCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($queueInfoExitCode -eq 0) { $queueExists = $true }
          } catch { $ErrorActionPreference = 'Stop'; $queueExists = $false }
          if (-not $queueExists) {
            npx wrangler@latest queues create $env:QUEUE_NAME --message-retention-period-secs 3600
            if ($LASTEXITCODE -ne 0) { throw 'QUEUE_CREATE_FAILED' }
          }
          npx wrangler@latest queues info $env:QUEUE_NAME
          if ($LASTEXITCODE -ne 0) { throw 'QUEUE_VERIFY_FAILED' }

      - name: Validate AX Control Runtime
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npx wrangler@latest deploy --dry-run --name $env:WORKER_NAME
          if ($LASTEXITCODE -ne 0) { throw 'AX_CONTROL_RUNTIME_DRY_RUN_FAILED' }

      - name: Deploy AX Control Runtime
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npx wrangler@latest deploy --name $env:WORKER_NAME
          if ($LASTEXITCODE -ne 0) { throw 'AX_CONTROL_RUNTIME_DEPLOY_FAILED' }

      - name: Configure Worker ingress secrets
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AX_MOBILE_INGRESS_SECRET | npx wrangler@latest secret put AX_MOBILE_INGRESS_SECRET --name $env:WORKER_NAME
          if ($LASTEXITCODE -ne 0) { throw 'AX_MOBILE_INGRESS_SECRET_PUT_FAILED' }
          $env:AX_PC_PULL_SECRET | npx wrangler@latest secret put AX_PC_PULL_SECRET --name $env:WORKER_NAME
          if ($LASTEXITCODE -ne 0) { throw 'AX_PC_PULL_SECRET_PUT_FAILED' }

      - name: Verify AX Control Runtime Health
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $verified = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            try {
              $r = Invoke-RestMethod -Uri "$env:AX_CONTROL_RUNTIME_URL/health" -Method Get -TimeoutSec 30
              Write-Host "Status: $($r.status)"
              Write-Host "Mode: $($r.mode)"
              Write-Host "Live Financial Execution: $($r.liveFinancialExecution)"
              Write-Host "Mobile Ingress Auth Configured: $($r.mobileIngressAuthConfigured)"
              Write-Host "PC Pull Auth Configured: $($r.pcPullAuthConfigured)"
              if ($r.status -eq 'ONLINE' -and $r.mode -eq 'FREE_ONLY' -and $r.liveFinancialExecution -eq $false -and $r.mobileIngressAuthConfigured -eq $true -and $r.pcPullAuthConfigured -eq $true -and $r.gatewayInbox -eq 'AX_GATEWAY_INBOX') { $verified = $true; break }
            } catch { Write-Host "Health probe failed: $($_.Exception.Message)" }
            if ($attempt -lt 8) { Start-Sleep -Seconds 5 }
          }
          if (-not $verified) { throw 'AX_CONTROL_RUNTIME_HEALTH_VERIFICATION_FAILED' }
          Write-Host 'AX Control Runtime: ONLINE'
          Write-Host 'Mobile HTTPS ingress: AUTHENTICATED'
          Write-Host 'PC pull: AUTHENTICATED'
          Write-Host 'Mode: FREE_ONLY'
          Write-Host 'Live Financial Execution: DISABLED'

      - name: Verify Existing AERIS External Runtime
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $externalRuntimeUrl = 'https://aeris-execution-runtime.aerismusic8.workers.dev'
          try {
            $r = Invoke-RestMethod -Uri $externalRuntimeUrl -Method Get -TimeoutSec 30
            if ($r.status -ne 'ONLINE') { throw 'EXISTING_AERIS_RUNTIME_NOT_ONLINE' }
            Write-Host 'Existing AERIS External Runtime: VERIFIED ONLINE'
          } catch {
            Write-Host "WARNING: Existing runtime verification failed: $($_.Exception.Message)"
            Write-Host 'New AX Control Runtime remains independently deployed.'
          }

      - name: Deployment Summary
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'AX CONTROL RUNTIME DEPLOYMENT VERIFIED'
          Write-Host "Control Worker: $env:WORKER_NAME"
          Write-Host "Control Runtime: $env:AX_CONTROL_RUNTIME_URL"
          Write-Host 'Mobile ingress: authenticated'
          Write-Host 'PC pull/ack: authenticated'
          Write-Host 'Transport store: AX_GATEWAY_INBOX'
          Write-Host 'Execution mode: FREE_ONLY'
          Write-Host 'Live financial execution: DISABLED'
          Write-Host 'Existing AERIS External Execution Runtime remains a separate boundary.'
