name: AX Cloudflare Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - '.github/workflows/cloudflare-runtime.yml'
      - 'AX_RESOURCE_GOVERNOR.json'
      - 'AX_CLOUDFLARE_DISPATCH_ADAPTER.ps1'

permissions:
  contents: read

concurrency:
  group: ax-cloudflare-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AX_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      QUEUE_NAME: ax-execution-events
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Node and Wrangler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          npx wrangler@latest --version

      - name: Ensure Free Queue exists
        shell: powershell
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npx wrangler@latest queues info $env:QUEUE_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating queue $env:QUEUE_NAME"
            npx wrangler@latest queues create $env:QUEUE_NAME --message-retention-period-secs 3600
            if ($LASTEXITCODE -ne 0) { throw 'QUEUE_CREATE_FAILED' }
          } else {
            Write-Host "Queue exists: $env:QUEUE_NAME"
          }
          npx wrangler@latest queues update $env:QUEUE_NAME --message-retention-period-secs 3600 --delivery-delay-secs 0
          if ($LASTEXITCODE -ne 0) { throw 'QUEUE_UPDATE_FAILED' }

      - name: Validate Worker
        shell: powershell
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npx wrangler@latest deploy --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'WRANGLER_DRY_RUN_FAILED' }

      - name: Deploy Worker
        shell: powershell
        working-directory: cloudflare/ax-control-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npx wrangler@latest deploy
          if ($LASTEXITCODE -ne 0) { throw 'WRANGLER_DEPLOY_FAILED' }

      - name: Verify Runtime Health
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Invoke-RestMethod -Uri "$env:AX_RUNTIME_URL/health" -Method Get -TimeoutSec 30
          if ($r.status -ne 'ONLINE' -or $r.mode -ne 'FREE_ONLY' -or $r.liveFinancialExecution -ne $false) {
            throw 'AX_RUNTIME_HEALTH_VERIFICATION_FAILED'
          }
          Write-Host 'AX Cloudflare Runtime: ONLINE'
          Write-Host 'Mode: FREE_ONLY'
          Write-Host 'Live Financial Execution: DISABLED'
          Write-Host "Queue: $($r.queue)"
