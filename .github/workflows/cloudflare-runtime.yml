name: AX Cloudflare Control Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - '.github/workflows/cloudflare-runtime.yml'
      - 'AX_RESOURCE_GOVERNOR.json'
      - 'AX_CLOUDFLARE_DISPATCH_ADAPTER.ps1'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: ax-control-runtime
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      QUEUE_NAME: ax-execution-events

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Verify Node and Wrangler
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npx wrangler@latest --version

      - name: Verify AX Web Chat and GitHub App and XM regression guards
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
          test -f cloudflare/ax-control-runtime/src/xm-bridge.ts
          grep -q "AxXmExecutionQueue" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q 'AX_XM_EXECUTION_QUEUE' cloudflare/ax-control-runtime/wrangler.jsonc
          grep -q "url.pathname === '/ax/direct/attachment'" cloudflare/ax-control-runtime/src/ax-adapters-route.ts
          test -f cloudflare/ax-control-runtime/test/direct-attachment.spec.ts

      - name: Verify required Cloudflare credential is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo 'Cloudflare API token is configured.'

      - name: Ensure AX Queue exists
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          if ! npx wrangler@latest queues info "$QUEUE_NAME" >/tmp/ax-queue-info.txt 2>&1; then
            npx wrangler@latest queues create "$QUEUE_NAME" --message-retention-period-secs 3600
          fi
          npx wrangler@latest queues info "$QUEUE_NAME"

      - name: Validate AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npm test
          npx wrangler@latest deploy --dry-run --name "$WORKER_NAME"

      - name: Deploy AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --name "$WORKER_NAME"

      - name: Verify AX Control Runtime Health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node <<'NODE'
          const url = process.env.AX_CONTROL_RUNTIME_URL + '/health';
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) process.exit(1);
          const r = await response.json();
          console.log('Status:', r.status);
          console.log('Version:', r.version);
          console.log('Mode:', r.mode);
          console.log('Live Financial Execution:', r.liveFinancialExecution);
          console.log('Mobile Ingress Auth Configured:', r.mobileIngressAuthConfigured);
          console.log('PC Pull Auth Configured:', r.pcPullAuthConfigured);
          console.log('Web Chat Auth Configured:', r.webChatAuthConfigured);
          console.log('Gateway Inbox:', r.gatewayInbox);
          const ok = r.status === 'ONLINE'
            && r.version === 'control-runtime-1.5.0'
            && r.mode === 'FREE_ONLY'
            && r.liveFinancialExecution === false
            && r.mobileIngressAuthConfigured === true
            && r.pcPullAuthConfigured === true
            && r.webChat === true
            && r.webChatAuthConfigured === true
            && r.gatewayInbox === 'AX_GATEWAY_INBOX';
          if (!ok) process.exit(1);
          NODE
            then
              echo 'AX Control Runtime health verification passed.'
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo 'AX_CONTROL_RUNTIME_HEALTH_VERIFICATION_FAILED'
              exit 1
            fi
            sleep 5
          done

      - name: Verify GitHub App live status
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if node <<'NODE'
          const url = process.env.AX_CONTROL_RUNTIME_URL + '/github/status';
          const response = await fetch(url, { cache: 'no-store' });
          const r = await response.json();
          console.log(JSON.stringify(r));
          if (response.ok && r.verified === true && r.configured === true && r.authenticated === true && r.repositoryAccess === true && r.status === 'VERIFIED') process.exit(0);
          process.exit(1);
          NODE
            then
              echo 'AX GitHub App live verification passed.'
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo 'AX_GITHUB_APP_LIVE_VERIFICATION_FAILED'
              exit 1
            fi
            sleep 5
          done

      - name: Verify XM bridge public status
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if node <<'NODE'
          const url = process.env.AX_CONTROL_RUNTIME_URL + '/xm/status';
          const response = await fetch(url, { cache: 'no-store' });
          const r = await response.json();
          console.log(JSON.stringify(r));
          if (response.ok && r.ok === true && r.service === 'AX XM EXECUTION BRIDGE' && r.mode === 'READ_ONLY_PENDING_HANDSHAKE' && r.live_execution_enabled === false && r.kill_switch === true) process.exit(0);
          process.exit(1);
          NODE
            then
              echo 'AX XM bridge status verification passed (read-only/kill-switch state).'
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo 'AX_XM_BRIDGE_STATUS_VERIFICATION_FAILED'
              exit 1
            fi
            sleep 5
          done

      - name: Verify deployed source contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f cloudflare/ax-control-runtime/src/github-app-entry.ts
          test -f cloudflare/ax-control-runtime/src/xm-bridge.ts
          grep -q "url.pathname === '/github/verify'" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "url.pathname === '/github/status'" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "url.pathname === '/xm/node/pull'" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "url.pathname === '/xm/node/result'" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "url.pathname === '/xm/control/enqueue'" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "url.pathname === '/ax/direct/attachment'" cloudflare/ax-control-runtime/src/ax-adapters-route.ts
          grep -q "AX_XM_NODE_SECRET" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "AX_GITHUB_APP_PRIVATE_KEY" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "AX_GITHUB_APP_ID" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "AX_GITHUB_CLIENT_ID" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "Access-Control-Allow-Origin" cloudflare/ax-control-runtime/src/index.ts
          grep -q "request.method === 'OPTIONS'" cloudflare/ax-control-runtime/src/index.ts

      - name: Deployment Summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AX CONTROL RUNTIME DEPLOYMENT VERIFIED'
          echo "Control Worker: $WORKER_NAME"
          echo "Control Runtime: $AX_CONTROL_RUNTIME_URL"
          echo 'Regression guard: PASS'
          echo 'Health verification: PASS'
          echo 'GitHub App live verification: PASS'
          echo 'XM bridge transport verification: PASS'
          echo 'Direct attachment route: PASS'
          echo 'CORS contract: PASS'
          echo 'Execution mode: FREE_ONLY'
          echo 'Live financial execution: DISABLED'
