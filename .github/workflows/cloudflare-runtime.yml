name: AX Cloudflare Control Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - '.github/workflows/cloudflare-runtime.yml'
      - 'AX_RESOURCE_GOVERNOR.json'
      - 'AX_CLOUDFLARE_DISPATCH_ADAPTER.ps1'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: ax-control-runtime
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      QUEUE_NAME: ax-execution-events

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Verify Node and Wrangler
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npx wrangler@latest --version

      - name: Verify AX Web Chat and GitHub App regression guard
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs

      - name: Verify required Cloudflare credential is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo 'Cloudflare API token is configured.'

      - name: Ensure AX Queue exists
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          if ! npx wrangler@latest queues info "$QUEUE_NAME" >/tmp/ax-queue-info.txt 2>&1; then
            npx wrangler@latest queues create "$QUEUE_NAME" --message-retention-period-secs 3600
          fi
          npx wrangler@latest queues info "$QUEUE_NAME"

      - name: Validate AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --dry-run --name "$WORKER_NAME"

      - name: Deploy AX Control Runtime
        shell: bash
        working-directory: cloudflare/ax-control-runtime
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --name "$WORKER_NAME"

      - name: Verify AX Control Runtime Health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node <<'NODE'
          const url = process.env.AX_CONTROL_RUNTIME_URL + '/health';
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) process.exit(1);
          const r = await response.json();
          console.log('Status:', r.status);
          console.log('Version:', r.version);
          console.log('Mode:', r.mode);
          console.log('Live Financial Execution:', r.liveFinancialExecution);
          console.log('Mobile Ingress Auth Configured:', r.mobileIngressAuthConfigured);
          console.log('PC Pull Auth Configured:', r.pcPullAuthConfigured);
          console.log('Web Chat Auth Configured:', r.webChatAuthConfigured);
          console.log('Gateway Inbox:', r.gatewayInbox);
          const ok = r.status === 'ONLINE'
            && r.version === 'control-runtime-1.5.0'
            && r.mode === 'FREE_ONLY'
            && r.liveFinancialExecution === false
            && r.mobileIngressAuthConfigured === true
            && r.pcPullAuthConfigured === true
            && r.webChat === true
            && r.webChatAuthConfigured === true
            && r.gatewayInbox === 'AX_GATEWAY_INBOX';
          if (!ok) process.exit(1);
          NODE
            then
              echo 'AX Control Runtime health verification passed.'
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo 'AX_CONTROL_RUNTIME_HEALTH_VERIFICATION_FAILED'
              exit 1
            fi
            sleep 5
          done

      - name: Verify GitHub App gateway source is deployed
        shell: bash
        run: |
          set -euo pipefail
          echo 'GitHub App entrypoint is part of the deployed Worker source contract.'
          test -f cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "url.pathname === '/github/verify'" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "AX_GITHUB_APP_PRIVATE_KEY" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "AX_GITHUB_APP_ID" cloudflare/ax-control-runtime/src/github-app-entry.ts
          grep -q "AX_GITHUB_CLIENT_ID" cloudflare/ax-control-runtime/src/github-app-entry.ts

      - name: Deployment Summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AX CONTROL RUNTIME DEPLOYMENT VERIFIED'
          echo "Control Worker: $WORKER_NAME"
          echo "Control Runtime: $AX_CONTROL_RUNTIME_URL"
          echo 'Regression guard: PASS'
          echo 'Health verification: PASS'
          echo 'Execution mode: FREE_ONLY'
          echo 'Live financial execution: DISABLED'
          echo 'Next gate: authenticated /github/verify check'
