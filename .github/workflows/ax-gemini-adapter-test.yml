name: AX Gemini Adapter Test

on:
  push:
    paths:
      - 'cloudflare/ax-control-runtime/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/ax-control-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Gemini adapter test
        run: npm run test:gemini
