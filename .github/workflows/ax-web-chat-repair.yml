name: AX Web Chat Repair

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/src/index.ts'
      - 'cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs'
      - '.github/workflows/ax-web-chat-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify failing regression test before repair
        shell: bash
        run: |
          set +e
          node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo 'EXPECTED_RED_TEST_DID_NOT_FAIL'
            exit 1
          fi
          echo 'RED_TEST_CONFIRMED'

      - name: Repair web chat browser script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('cloudflare/ax-control-runtime/src/index.ts')
          source = path.read_text(encoding='utf-8')

          if 'id="loginStatus"' not in source:
              source = source.replace(
                  '<button id="login">Start session</button></div>',
                  '<button id="login">Start session</button><div id="loginStatus" class="muted" role="status" aria-live="polite"></div></div>',
                  1,
              )

          source = re.sub(
              r"async function login\(\)\{try\{.*?\}\s*catch\(e\)\{\$\('session'\)\.textContent=e\.message\}\}",
              "async function login(){const status=$('loginStatus');status.className='muted';status.textContent='Connecting…';try{const secret=$('secret').value.trim();if(!secret)throw new Error('SECRET_REQUIRED');const r=await fetch('/web/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'AUTH_FAILED');if(!j.sessionToken)throw new Error('SESSION_TOKEN_MISSING');setSession(j.sessionToken);$('secret').value='';status.textContent='';logged();await refresh()}catch(e){status.className='err';status.textContent=e.message||'AUTH_FAILED';}}",
              source,
              count=1,
              flags=re.S,
          )

          source = re.sub(
              r"\$\('macheck'\)\.onclick=.*?;\$\('logout'\)\.onclick=",
              "$('macheck').onclick=async()=>{try{const r=await submit('M-A-CHECK');$('messages').textContent+='\\n\\n[REQUESTED] '+r.requestId+'\\nM-A-CHECK';const result=await poll(r.requestId);$('messages').textContent+='\\n[RESULT]\\n'+JSON.stringify(result.result||result,null,2)}catch(e){$('result').className='err';$('result').textContent=e.message}};$('logout').onclick=",
              source,
              count=1,
              flags=re.S,
          )

          source = re.sub(
              r"\$\('send'\)\.onclick=.*?;if\(session\(\)\)\{logged\(\);refresh\(\)\.catch\(\(\)=>\{\}\)\}",
              "$('send').onclick=async()=>{try{const message=$('message').value.trim();if(!message && !$('file').files.length)throw new Error('MESSAGE_REQUIRED');const r=await submit(message);$('messages').textContent+='\\n\\n[RECEIVED] '+r.requestId+'\\n'+(message||'[attachment]');$('result').className='muted';$('result').textContent='Waiting for Local Hub result…';const result=await poll(r.requestId);$('messages').textContent+='\\n[LOCAL HUB RESULT]\\n'+JSON.stringify(result.result||result,null,2);$('result').textContent='Completed';$('message').value='';$('file').value=''}catch(e){$('result').className='err';$('result').textContent=e.message}};if(session()){logged();refresh().catch(()=>{})}",
              source,
              count=1,
              flags=re.S,
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify repaired regression test
        shell: bash
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'NO_REPAIR_CHANGE_NEEDED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/ax-control-runtime/src/index.ts
          git commit -m 'fix: repair AX web chat browser interactions'
          git push
