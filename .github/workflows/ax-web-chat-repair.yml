name: AX Web Chat Repair

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/ax-control-runtime/src/index.ts
      - cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
      - .github/workflows/ax-web-chat-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Confirm regression test is red
        run: |
          set +e
          node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply deterministic repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cloudflare/ax-control-runtime/src/index.ts')
          source = path.read_text(encoding='utf-8')

          old = "$('send').onclick=async()=>{try{const message=$('message').value.trim();if(!message&&!$('file').files.length)throw new Error('MESSAGE_REQUIRED');const r=await submit(message);$('messages').textContent+=NL+NL+'[RECEIVED] '+r.requestId+NL+(message||'[attachment]');$('result').className='muted';$('result').textContent='Waiting for Local Hub result…';const result=await poll(r.requestId);$('messages').textContent+=NL+'[LOCAL HUB RESULT]'+NL+JSON.stringify(result.result||result,null,2);$('result').textContent='Completed';$('message').value='';$('file').value=''}catch(e){$('result').className='err';$('result').textContent=e.message}};"
          new = "$('send').onclick=async()=>{try{const message=$('message').value.trim();if(!message&&!$('file').files.length)throw new Error('MESSAGE_REQUIRED');const r=await submit(message);$('messages').textContent+=NL+NL+'[RECEIVED] '+r.requestId+NL+(message||'[attachment]');$('message').value='';$('file').value='';$('result').className='muted';$('result').textContent='Waiting for Local Hub result…';const result=await poll(r.requestId);$('messages').textContent+=NL+'[LOCAL HUB RESULT]'+NL+JSON.stringify(result.result||result,null,2);$('result').textContent='Completed'}catch(e){$('result').className='err';$('result').textContent=e.message}};"
          if old not in source:
              raise SystemExit('REPAIR_CURRENT_SEND_HANDLER_NOT_FOUND')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify repair
        run: node cloudflare/ax-control-runtime/tests/web-chat-source.test.mjs

      - name: Create repair branch
        id: branch
        run: |
          branch="repair/ax-web-chat-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/ax-control-runtime/src/index.ts
          git commit -m 'fix: clear AX web chat composer after acceptance'
          git push --set-upstream origin "${{ steps.branch.outputs.branch }}"
