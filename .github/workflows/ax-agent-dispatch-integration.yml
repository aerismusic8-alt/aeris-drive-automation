name: AX Agent Dispatch Integration

on:
  push:
    paths:
      - 'AX_AGENT_ROUTE_GATE.ps1'
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_AGENT_DISPATCH_INTEGRATION.Tests.ps1'
  pull_request:
    paths:
      - 'AX_AGENT_ROUTE_GATE.ps1'
      - 'AX_AGENT_DISPATCH.ps1'
      - 'AX_AGENT_CAPABILITY_REGISTRY.json'
      - 'tests/AX_AGENT_DISPATCH_INTEGRATION.Tests.ps1'
  workflow_dispatch:

jobs:
  integration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify dispatch integration guards
        shell: pwsh
        run: ./tests/AX_AGENT_DISPATCH_INTEGRATION.Tests.ps1
