name: AX Worker Parallel

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'

concurrency:
  group: ax-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: AX Worker identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "AX_WORKER=ONLINE"
          Write-Host "PC=$env:COMPUTERNAME"
          Write-Host "TIME=$([DateTime]::UtcNow.ToString('o'))"

      - name: AX Worker execution proof
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $root = 'C:\AERIS\AX\workers'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $id = [guid]::NewGuid().ToString()
          $path = Join-Path $root "worker-$id.json"
          $proof = [ordered]@{
            workerId=$id
            executed=$true
            verified=$false
            computer=$env:COMPUTERNAME
            executedAtUtc=[DateTime]::UtcNow.ToString('o')
          }
          $proof | ConvertTo-Json | Set-Content $path -Encoding UTF8
          $read = Get-Content $path -Raw | ConvertFrom-Json
          if ($read.workerId -ne $id -or $read.executed -ne $true) { throw 'AX_WORKER_READBACK_FAILED' }
          $proof.verified=$true
          $proof | ConvertTo-Json | Set-Content $path -Encoding UTF8
          $final=Get-Content $path -Raw | ConvertFrom-Json
          if ($final.verified -ne $true) { throw 'AX_WORKER_VERIFY_FAILED' }
          Write-Host 'AX_WORKER_EXECUTED=TRUE'
          Write-Host 'AX_WORKER_VERIFIED=TRUE'
          Write-Host "EVIDENCE=$path"
