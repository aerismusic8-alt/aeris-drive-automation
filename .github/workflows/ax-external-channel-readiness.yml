name: AX External Channel Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ax-control-runtime/**'
      - '.github/workflows/ax-external-channel-readiness.yml'

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
    steps:
      - name: Verify public health contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$AX_CONTROL_RUNTIME_URL/health" -o health.json
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const required = {
            status: 'ONLINE',
            mode: 'FREE_ONLY',
            liveFinancialExecution: false,
            gatewayInbox: 'AX_GATEWAY_INBOX',
            mobileIngress: true,
            pcPull: true,
            mobileIngressAuthConfigured: true,
            pcPullAuthConfigured: true,
          };
          for (const [key, value] of Object.entries(required)) {
            if (r[key] !== value) throw new Error(`HEALTH_CONTRACT_FAILED:${key}=${r[key]}`);
          }
          console.log('PUBLIC_HEALTH_PASS', JSON.stringify(required));
          NODE

      - name: Verify public mobile surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$AX_CONTROL_RUNTIME_URL/mobile" | grep -F "AX Mobile Gateway" >/dev/null
          curl --fail --silent --show-error "$AX_CONTROL_RUNTIME_URL/mobile/config" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(r.mobileIngress!==true||r.pcPull!==true||r.executionMode!=='FREE_ONLY'||r.transportStore!=='AX_GATEWAY_INBOX')process.exit(1);console.log('PUBLIC_MOBILE_SURFACE_PASS')})"

      - name: Verify unauthenticated input is blocked
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -o /tmp/unauth.json -w '%{http_code}' \
            -X POST "$AX_CONTROL_RUNTIME_URL/mobile/input" \
            -H 'Content-Type: application/json' \
            --data '{"source_channel":"MOBILE","content_type":"text","content":"unauthorized readiness probe"}')
          test "$status" = "401"
          grep -F 'AUTH_REQUIRED' /tmp/unauth.json >/dev/null
          echo 'UNAUTH_INPUT_BLOCK_PASS'

  authenticated-e2e:
    needs: public-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
    steps:
      - name: Verify required readiness secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AX_MOBILE_INGRESS_SECRET"
          test -n "$AX_PC_PULL_SECRET"
          echo 'READINESS_SECRETS_PRESENT'

      - name: Submit external mobile request
        shell: bash
        run: |
          set -euo pipefail
          export REQUEST_ID="EXT-READINESS-$(date -u +%Y%m%dT%H%M%SZ)-$RANDOM"
          export TASK_ID="TASK-EXT-READINESS-$RANDOM"
          cat >request.json <<JSON
          {"request_id":"$REQUEST_ID","task_id":"$TASK_ID","source_channel":"MOBILE","content_type":"text","content":"AX external channel readiness probe","attachments":[]}
          JSON
          status=$(curl --silent --show-error -o response.json -w '%{http_code}' \
            -X POST "$AX_CONTROL_RUNTIME_URL/mobile/input" \
            -H "Authorization: Bearer $AX_MOBILE_INGRESS_SECRET" \
            -H 'Content-Type: application/json' \
            --data @request.json)
          test "$status" = "201"
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          if (r.accepted !== true || r.queued !== true || r.status !== 'RECEIVED' || r.executionStatus !== 'NOT_EXECUTED') throw new Error('MOBILE_SUBMIT_CONTRACT_FAILED');
          console.log('MOBILE_SUBMIT_PASS', JSON.stringify({requestId:r.requestId, taskId:r.taskId, status:r.status}));
          fs.writeFileSync('request-id.txt', r.requestId);
          fs.writeFileSync('task-id.txt', r.taskId);
          NODE

      - name: Pull queued request through PC boundary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            status=$(curl --silent --show-error -o pull.json -w '%{http_code}' \
              -X POST "$AX_CONTROL_RUNTIME_URL/pc/pull" \
              -H "Authorization: Bearer $AX_PC_PULL_SECRET")
            test "$status" = "200"
            if node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('pull.json', 'utf8'));
          if (!r.item) process.exit(1);
          const expected = fs.readFileSync('request-id.txt', 'utf8').trim();
          if (r.item.request_id !== expected) throw new Error(`PULLED_WRONG_REQUEST:${r.item.request_id}`);
          console.log('PC_PULL_PASS', JSON.stringify({requestId:r.item.request_id, taskId:r.item.task_id, status:r.item.status}));
          process.exit(0);
          NODE
            then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo 'PC_PULL_TIMEOUT'
              cat pull.json
              exit 1
            fi
            sleep 2
          done

      - name: Acknowledge request through PC boundary
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=$(cat request-id.txt)
          status=$(curl --silent --show-error -o ack.json -w '%{http_code}' \
            -X POST "$AX_CONTROL_RUNTIME_URL/pc/ack" \
            -H "Authorization: Bearer $AX_PC_PULL_SECRET" \
            -H 'Content-Type: application/json' \
            --data "{\"request_id\":\"$REQUEST_ID\"}")
          test "$status" = "200"
          grep -F '"ok":true' ack.json >/dev/null
          echo 'PC_ACK_PASS'

      - name: Readiness summary
        shell: bash
        run: |
          echo 'AX EXTERNAL CHANNEL READINESS: PASS'
          echo 'Public surface: /mobile'
          echo 'External ingress: /mobile/input'
          echo 'PC boundary: /pc/pull + /pc/ack'
          echo 'Mode: FREE_ONLY'
          echo 'Live financial execution: DISABLED'
