name: AX External Channel Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
    steps:
      - name: Verify public health contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Invoke-RestMethod "$env:AX_CONTROL_RUNTIME_URL/health"
          $required = @{ status='ONLINE'; mode='FREE_ONLY'; liveFinancialExecution=$false; gatewayInbox='AX_GATEWAY_INBOX'; mobileIngress=$true; pcPull=$true; webChat=$true; mobileIngressAuthConfigured=$true; pcPullAuthConfigured=$true; webChatAuthConfigured=$true }
          foreach ($pair in $required.GetEnumerator()) { if ($r.($pair.Key) -ne $pair.Value) { throw "HEALTH_CONTRACT_FAILED:$($pair.Key)=$($r.($pair.Key))" } }
          Write-Host 'PUBLIC_HEALTH_PASS'

      - name: Verify public mobile and web surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Invoke-WebRequest -UseBasicParsing "$env:AX_CONTROL_RUNTIME_URL/mobile").Content -notmatch 'AX Mobile Gateway') { throw 'PUBLIC_MOBILE_SURFACE_FAILED' }
          $cfg = Invoke-RestMethod "$env:AX_CONTROL_RUNTIME_URL/mobile/config"
          if ($cfg.mobileIngress -ne $true -or $cfg.pcPull -ne $true -or $cfg.webChat -ne $true -or $cfg.executionMode -ne 'FREE_ONLY' -or $cfg.transportStore -ne 'AX_GATEWAY_INBOX') { throw 'PUBLIC_MOBILE_CONFIG_FAILED' }
          Write-Host 'PUBLIC_MOBILE_SURFACE_PASS'
          $chat = (Invoke-WebRequest -UseBasicParsing "$env:AX_CONTROL_RUNTIME_URL/chat").Content
          if ($chat -notmatch 'คุยกับ AX' -and $chat -notmatch 'AX Web Chat') { throw 'PUBLIC_CHAT_SURFACE_FAILED' }
          Write-Host 'PUBLIC_WEB_CHAT_SURFACE_PASS'

      - name: Verify unauthenticated protected surfaces are blocked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try { Invoke-RestMethod -Method Post -Uri "$env:AX_CONTROL_RUNTIME_URL/mobile/input" -ContentType 'application/json' -Body '{"source_channel":"MOBILE","content_type":"text","content":"unauthorized readiness probe"}' | Out-Null; throw 'MOBILE_AUTH_BYPASS' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 401 -and $_.Exception.Message -ne 'MOBILE_AUTH_BYPASS') { throw } }
          Write-Host 'UNAUTH_MOBILE_BLOCK_PASS'
          try { Invoke-RestMethod -Method Post -Uri "$env:AX_CONTROL_RUNTIME_URL/web/input" -ContentType 'application/json' -Body '{"source_channel":"WEB","content_type":"text","content":"unauthorized web probe","attachments":[]}' | Out-Null; throw 'WEB_AUTH_BYPASS' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 401 -and $_.Exception.Message -ne 'WEB_AUTH_BYPASS') { throw } }
          Write-Host 'UNAUTH_WEB_BLOCK_PASS'

  authenticated-e2e:
    needs: public-contract
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      AX_CONTROL_RUNTIME_URL: https://ax-control-runtime.aerismusic8.workers.dev
      AX_MOBILE_INGRESS_SECRET: ${{ secrets.AX_MOBILE_INGRESS_SECRET }}
      AX_PC_PULL_SECRET: ${{ secrets.AX_PC_PULL_SECRET }}
    steps:
      - name: Verify required readiness secrets exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AX_MOBILE_INGRESS_SECRET)) { throw 'AX_MOBILE_INGRESS_SECRET_MISSING' }
          if ([string]::IsNullOrWhiteSpace($env:AX_PC_PULL_SECRET)) { throw 'AX_PC_PULL_SECRET_MISSING' }
          Write-Host 'READINESS_SECRETS_PRESENT'
      - name: Open short-lived web session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{secret=$env:AX_MOBILE_INGRESS_SECRET} | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post -Uri "$env:AX_CONTROL_RUNTIME_URL/web/session" -ContentType 'application/json' -Body $body
          if ($r.authenticated -ne $true -or [string]::IsNullOrWhiteSpace($r.sessionToken)) { throw 'WEB_SESSION_CONTRACT_FAILED' }
          Set-Content -Path web-session.txt -Value $r.sessionToken -NoNewline
          Write-Host 'WEB_SESSION_PASS'
      - name: Submit external web request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requestId = "WEB-READINESS-$([guid]::NewGuid())"
          $taskId = "TASK-WEB-READINESS-$([guid]::NewGuid().ToString().Substring(0,8))"
          $payload = @{request_id=$requestId;task_id=$taskId;source_channel='WEB';content_type='text';content='AX external web chat readiness probe';attachments=@()} | ConvertTo-Json
          $headers = @{Authorization="Bearer $(Get-Content web-session.txt -Raw)"}
          $r = Invoke-WebRequest -Method Post -Uri "$env:AX_CONTROL_RUNTIME_URL/web/input" -Headers $headers -ContentType 'application/json' -Body $payload
          if ($r.StatusCode -ne 201) { throw "WEB_SUBMIT_HTTP_$($r.StatusCode)" }
          Write-Host "WEB_SUBMIT_PASS task=$taskId"
