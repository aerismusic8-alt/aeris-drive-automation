name: AX Autonomous Executive Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - AICS Paper E2E
      - PC Runner Smoke Test
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ax-executive-loop
  cancel-in-progress: false

jobs:
  executive-loop:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout AX control state
        uses: actions/checkout@v4

      - name: AX Executive Cycle
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AX_TRIGGER: ${{ github.event_name }}
          AX_TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cycle = [guid]::NewGuid().ToString()
          $now = Get-Date -Format o
          $repo = $env:GITHUB_REPOSITORY
          $root = $env:GITHUB_WORKSPACE

          Write-Host '=== AX AUTONOMOUS EXECUTIVE CYCLE ==='
          Write-Host "Cycle: $cycle"
          Write-Host "Time: $now"
          Write-Host "Trigger: $env:AX_TRIGGER"
          Write-Host "Trigger Workflow: $env:AX_TRIGGER_WORKFLOW"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Runner: $env:RUNNER_NAME"

          Write-Host '=== RECOVERY ==='
          & powershell.exe -ExecutionPolicy Bypass -File "$root\AX_RECOVERY_ENGINE.ps1"
          if ($LASTEXITCODE -ne 0) { throw "AX_RECOVERY_ENGINE_FAILED:$LASTEXITCODE" }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runsUrl = "https://api.github.com/repos/$repo/actions/runs?per_page=30"
          $runs = Invoke-RestMethod -Uri $runsUrl -Headers $headers -Method Get
          $ax = $runs.workflow_runs | Where-Object { $_.name -eq 'AX Status Monitor' } | Select-Object -First 1
          $smoke = $runs.workflow_runs | Where-Object { $_.name -eq 'PC Runner Smoke Test' } | Select-Object -First 1

          Write-Host '=== OBSERVE ==='
          Write-Host "AX Monitor: $($ax.status) / $($ax.conclusion)"
          Write-Host "PC Runner Smoke: $($smoke.status) / $($smoke.conclusion)"

          Write-Host '=== PRIORITY / DEPENDENCY DECISION ==='
          & powershell.exe -ExecutionPolicy Bypass -File "$root\AX_DECISION_ENGINE.ps1" -RegistryPath "$root\AX_TASK_REGISTRY.json"
          if ($LASTEXITCODE -ne 0) { throw "AX_DECISION_ENGINE_FAILED:$LASTEXITCODE" }

          Write-Host '=== CONTROLLED ACTION DISPATCH ==='
          & powershell.exe -ExecutionPolicy Bypass -File "$root\AX_ACTION_DISPATCHER.ps1" -RegistryPath "$root\AX_TASK_REGISTRY.json"
          if ($LASTEXITCODE -ne 0) { throw "AX_ACTION_DISPATCHER_FAILED:$LASTEXITCODE" }

          Write-Host '=== PERMISSION ==='
          Write-Host 'Live-money execution: DISABLED'
          Write-Host 'Financial transactions: NOT PERMITTED'
          Write-Host 'Repository mutation: NOT PERFORMED BY THIS CYCLE'

          Write-Host '=== VERIFY ==='
          Write-Host 'Recovery engine: EXECUTED'
          Write-Host 'Priority selection: EXECUTED'
          Write-Host 'Dependency gate: EXECUTED'
          Write-Host 'Action dispatcher: EXECUTED'
          Write-Host 'Event/heartbeat trigger: ACCEPTED'
          Write-Host 'Runner execution: VERIFIED by workflow execution'

          Write-Host '=== AUDIT ==='
          Write-Host "CycleId=$cycle"
          Write-Host "Timestamp=$now"
          Write-Host "Trigger=$env:AX_TRIGGER"
          Write-Host "TriggerWorkflow=$env:AX_TRIGGER_WORKFLOW"
          Write-Host 'RecoveryEngine=EXECUTED'
          Write-Host 'LiveExecution=DISABLED'
          Write-Host '=== AX AUTONOMOUS EXECUTIVE CYCLE COMPLETE ==='
