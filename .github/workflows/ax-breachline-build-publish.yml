name: Breachline Build and Publish

# Builds the Breachline place from the recovered base plus the source overlay,
# verifies the result, and publishes it through the Open Cloud API.
#
# Why a separate workflow from the garden: the two games share nothing but the
# repository. The garden builds from `roblox-garden/` with Rojo; Breachline
# builds from `breachline/` with rbxmk, because its place is a binary file that
# was published already and Rojo has no base to merge onto. Giving Breachline
# its own workflow keeps a change to one game from rebuilding and republishing
# the other.
#
# The self-hosted PC1 workflows are untouched. Publishing does not need PC1 --
# it is one HTTPS POST -- so this runs on a hosted runner and stays available
# when PC1 is not.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Saved (private test) or Published (live)'
        required: true
        default: 'Published'
        type: choice
        options: [Saved, Published]
      publish:
        description: 'Publish to Roblox, or build and verify only'
        required: true
        default: 'yes'
        type: choice
        # Quoted: unquoted yes/no parse as YAML booleans, so GitHub's
        # allowed values became 'true'/'false'. The default then matched
        # neither, and the `!= 'no'` guard was never false -- choosing
        # 'build only' published anyway.
        options: ['yes', 'no']
  push:
    paths:
      - 'breachline/**'
      - 'scripts/build-breachline.sh'
      - 'scripts/unpack-breachline.sh'
      - 'scripts/fetch-rbxmk.sh'
      - 'scripts/publish-place-linux.sh'
      - 'scripts/check-breachline-build.py'
      - 'scripts/check-workflow-inputs.py'
      - '.github/workflows/ax-breachline-build-publish.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      place_path: ${{ steps.build.outputs.place_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch rbxmk
        run: bash scripts/fetch-rbxmk.sh

      # The base place is not committed; it is unpacked from the compact zstd
      # original in breachline-src/. The unpack repacks zstd chunks, so it needs
      # the Python binding. Without this the build fails on a fresh checkout.
      - name: Install zstandard
        run: python3 -m pip install --quiet zstandard

      - name: Build the place
        id: build
        run: |
          bash scripts/build-breachline.sh "$RUNNER_TEMP/breachline.rbxl" | tee "$RUNNER_TEMP/build.log"
          PLACE=$(grep -oP '(?<=^BUILD_PLACE=).*' "$RUNNER_TEMP/build.log")
          echo "place_path=$PLACE" >> "$GITHUB_OUTPUT"

      # The build reporting success is not the same as the build being right.
      # This replays the overlay and asserts what the result must contain, so a
      # module that was added to the overlay but never parented fails here.
      - name: Verify the built place
        run: python3 scripts/check-breachline-build.py

      # This workflow is not run by scripts/test-roblox.sh, so it checks its own
      # dispatch inputs. An unquoted `options: [yes, no]` parses as booleans, and
      # the `publish != 'no'` guard below then never matches -- the build-only
      # choice publishes.
      - name: Check dispatch inputs
        run: python3 scripts/check-workflow-inputs.py

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: breachline-place
          path: ${{ runner.temp }}/breachline.rbxl
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish != 'no' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built place
        uses: actions/download-artifact@v4
        with:
          name: breachline-place
          path: ${{ runner.temp }}

      - name: Publish to Roblox
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CONFIG: breachline/publish-config.json
        run: |
          set +e
          bash scripts/publish-place-linux.sh \
            "$RUNNER_TEMP/breachline.rbxl" \
            "${{ inputs.version_type || 'Published' }}" | tee "$RUNNER_TEMP/publish.log"
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          # Exit 3 means the credential is absent. That is a known state, not a
          # build failure: warn and pass, so a red run always means something
          # actually broke.
          if [ "$CODE" = "3" ]; then
            echo "::warning::Publishing is BLOCKED: ROBLOX_API_KEY is not set."
            exit 0
          fi
          exit "$CODE"

  # Publishing a place and having a game a player can open are two different
  # facts, and only the second one matters to a player. The garden has had this
  # job since a green pipeline proved the wrong thing twice -- a place published
  # with no name, and a private universe -- while every job passed and the game
  # page said Title-Unavailable. Breachline never had it, so nothing in its
  # pipeline had ever asked whether the universe is reachable.
  #
  # It runs last, needs no credential for the parts that are public, and reads
  # the things a player reads: the game page redirect, the name the games API
  # reports, and -- with the key -- the universe's visibility, because a PRIVATE
  # universe is unreachable however good the build is.
  live-state:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the game the way a player sees it
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CFG_JSON: ${{ github.workspace }}/breachline/publish-config.json
          # Breachline has no Config.luau, so there is no expected name to compare
          # against and the name check is skipped; the page redirect, the API name
          # being present and not [TITLE UNAVAILABLE], and the visibility read all
          # still run. Pointing this at the garden's Config.luau would compare
          # Breachline's name to the garden's and fail for the wrong reason.
          CFG_LUAU: ${{ github.workspace }}/breachline/publish-config.json
        run: bash scripts/check-live-state-linux.sh

      - name: Dump the full universe object for both games
        if: always()
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ]; then echo "NO_KEY"; exit 0; fi
          for U in 10772257179 10771844216; do
            echo "=============== universe $U ==============="
            curl -sS -m 20 -H "x-api-key: $ROBLOX_API_KEY" \
              "https://apis.roblox.com/cloud/v2/universes/$U" | head -c 3000
            echo
          done
