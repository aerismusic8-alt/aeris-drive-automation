name: PC Runner Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pc-runner-smoke:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify PC runner execution
        shell: cmd
        run: |
          echo === AERIS PC RUNNER SMOKE TEST ===
          echo Hostname: %COMPUTERNAME%
          echo User: %USERNAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner Arch: %RUNNER_ARCH%
          git --version
          echo === SMOKE TEST COMPLETE ===
