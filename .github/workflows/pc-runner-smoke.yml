name: PC Runner Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  AX_PC2_STATUS_CONTEXT: ax/pc2-runner-smoke

jobs:
  control-plane-runner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pc2_online: ${{ steps.check.outputs.pc2_online }}
      pc1_online: ${{ steps.check.outputs.pc1_online }}
    steps:
      - name: Check PC runner health through AX Control Runtime
        id: check
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 --retry-delay 2 https://ax-control-runtime.aerismusic8.workers.dev/github/runners)
          echo "$response"
          pc2=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const x=(r.runners||[]).find(v=>v.name==="PC2-CODING-EXECUTOR");process.stdout.write(x?.status==="online" ? "true" : "false")})')
          pc1=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const x=(r.runners||[]).find(v=>v.name==="PC1-AUTONOMOUS-EXECUTOR");process.stdout.write(x?.status==="online" ? "true" : "false")})')
          echo "pc2_online=$pc2" >> "$GITHUB_OUTPUT"
          echo "pc1_online=$pc1" >> "$GITHUB_OUTPUT"

      - name: Publish AX PC2 runner status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          description="AX Control Runtime runner health check failed"
          if [ "${{ job.status }}" = "success" ]; then
            if [ "${{ steps.check.outputs.pc2_online }}" = "true" ]; then
              state=pending
              description="PC2-CODING-EXECUTOR reported online; awaiting self-hosted execution proof"
            else
              state=failure
              description="PC2-CODING-EXECUTOR is not online according to AX Control Runtime"
            fi
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'const [state,description,context]=process.argv.slice(1); console.log(JSON.stringify({state,description,context}))' "$state" "$description" "$AX_PC2_STATUS_CONTEXT")"

  pc2-runner-smoke:
    needs: control-plane-runner-check
    if: needs.control-plane-runner-check.outputs.pc2_online == 'true'
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    steps:
      - name: Verify PC2 runner execution
        shell: cmd
        run: |
          echo === PC2 RUNNER SMOKE TEST ===
          echo Hostname: %COMPUTERNAME%
          echo User: %USERNAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner Arch: %RUNNER_ARCH%
          echo Runner Name: %RUNNER_NAME%
          git --version
          echo === PC2 RUNNER SMOKE TEST COMPLETE ===

      - name: Publish AX PC2 execution proof
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = if ('${{ job.status }}' -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') {
            'PC2-CODING-EXECUTOR accepted and completed the self-hosted smoke test'
          } else {
            'PC2-CODING-EXECUTOR started the smoke job but execution failed'
          }
          $body = @{ state = $state; description = $description; context = $env:AX_PC2_STATUS_CONTEXT } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } `
            -Body $body
