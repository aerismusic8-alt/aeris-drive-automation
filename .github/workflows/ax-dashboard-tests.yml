name: AX Dashboard Tests

on:
  push:
    paths:
      - 'dashboard/**'
      - '.github/workflows/ax-dashboard-tests.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/ax-dashboard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test dashboard data contract
        run: node --test dashboard/dashboard-data.test.mjs
