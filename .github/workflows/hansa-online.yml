name: Agent Hansa — Online Control

on:
  push:
    paths:
      - "HANSA_ONLINE/**"
      - ".github/workflows/hansa-online.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: hansa-online
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  online-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Run Hansa online controller
        env:
          AGENTHANSA_API_KEY: ${{ secrets.AGENTHANSA_API_KEY }}
        run: node HANSA_ONLINE/runtime/hansa-online.mjs

      - name: Write back canonical Hansa state
        run: |
          git config user.name "hansa-online-bot"
          git config user.email "hansa-online-bot@users.noreply.github.com"
          git add HANSA_ONLINE/state.json HANSA_ONLINE/evidence/latest.json
          if git diff --cached --quiet; then
            echo "No Hansa state change."
            exit 0
          fi
          git commit -m "chore(hansa): online runtime state write-back [skip ci]"
          git push
