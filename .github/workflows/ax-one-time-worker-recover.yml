name: AX One-Time Worker Recovery
on:
  push:
    branches: [main]
    paths:
      - 'AX_CONTROL_HUB/ONE_TIME_WORKER_RESTORE'
      - '.github/workflows/ax-one-time-worker-recover.yml'
permissions:
  contents: write
jobs:
  restore:
    if: ${{ hashFiles('AX_CONTROL_HUB/ONE_TIME_WORKER_RESTORE') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore verified pre-change worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 99d792711523857933ea7ab3f61e07e3903f53f2 -- cloudflare/ax-control-runtime/src/index.ts
          rm -f AX_CONTROL_HUB/ONE_TIME_WORKER_RESTORE
          git add cloudflare/ax-control-runtime/src/index.ts AX_CONTROL_HUB/ONE_TIME_WORKER_RESTORE
          git commit -m 'revert: restore control runtime before one-time UI experiment'
          git push origin HEAD:main
