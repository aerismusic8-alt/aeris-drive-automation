name: AKATH 24x7 Acceptance Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: akath-24x7-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AKATH_RUNTIME_ID: akath-primary
      AKATH_PROBE_MODE: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify this is an autonomous scheduled acceptance cycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -ne 'schedule') {
            Write-Host 'Manual run: execute one verified probe only; it does not count toward 24x7 acceptance.'
          }

      - name: Run one verified AKATH cycle
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/AKATH/runtime/akath_worker.ps1" -ProbeMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $stateDir = if ($env:AKATH_STATE_DIR) { $env:AKATH_STATE_DIR } else { Join-Path $HOME '.akath/runtime' }
          $statePath = Join-Path $stateDir 'runtime-state.json'
          if (-not (Test-Path -LiteralPath $statePath)) { throw 'AKATH_STATE_MISSING' }
          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          if ($state.state -ne 'VERIFIED') { throw "AKATH_STATE_NOT_VERIFIED:$($state.state)" }
          if ($state.verification_status -ne 'VERIFIED') { throw 'AKATH_VERIFICATION_MISSING' }
          if ([string]::IsNullOrWhiteSpace($state.evidence_ref)) { throw 'AKATH_EVIDENCE_REF_MISSING' }

          $evidence = Get-Content -Raw -LiteralPath $state.evidence_ref | ConvertFrom-Json
          if ($evidence.verification_status -ne 'VERIFIED') { throw 'AKATH_EVIDENCE_NOT_VERIFIED' }
          if ($evidence.rehydration.rehydration_status -ne 'VERIFIED') { throw 'AKATH_REHYDRATION_NOT_VERIFIED' }
          if ($evidence.rehydration.identity -ne 'A') { throw 'AKATH_IDENTITY_NOT_A' }
          if ($evidence.rehydration.execution_authorized -ne $false) { throw 'AKATH_REHYDRATION_AUTHORITY_BYPASS' }
          if ($evidence.next_job_ready -ne $true) { throw 'AKATH_NEXT_JOB_NOT_READY' }

          "AKATH_RUN_ID=$($state.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_JOB_ID=$($state.job_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_EVIDENCE=$($state.evidence_ref)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_CYCLE_VERIFIED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check previous scheduled acceptance runs
        if: github.event_name == 'schedule'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $runsJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/akath-24x7-acceptance.yml/runs?event=schedule&per_page=10"
          $runs = $runsJson | ConvertFrom-Json
          $previous = @($runs.workflow_runs | Where-Object { $_.id -ne [int64]'${{ github.run_id }}' } | Select-Object -First 2)
          if ($previous.Count -lt 2) {
            "AKATH_ACCEPTANCE_STREAK=1/3" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "AKATH_ACCEPTANCE_READY=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          if ($previous[0].conclusion -ne 'success' -or $previous[1].conclusion -ne 'success') {
            "AKATH_ACCEPTANCE_STREAK=1/3 (previous scheduled run failed)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "AKATH_ACCEPTANCE_READY=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          if ($previous[0].run_number -ne ($previous[1].run_number + 1)) {
            throw 'AKATH_ACCEPTANCE_SCHEDULE_SEQUENCE_GAP'
          }

          "AKATH_ACCEPTANCE_STREAK=3/3" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "AKATH_ACCEPTANCE_READY=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Persist acceptance proof
        if: github.event_name == 'schedule' && env.AKATH_ACCEPTANCE_READY == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $proofDir = Join-Path $env:GITHUB_WORKSPACE 'AKATH/VERIFICATION'
          New-Item -ItemType Directory -Force -Path $proofDir | Out-Null

          $runsJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/akath-24x7-acceptance.yml/runs?event=schedule&per_page=5"
          $runs = $runsJson | ConvertFrom-Json
          $successful = @($runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 3)
          if ($successful.Count -lt 3) { throw 'AKATH_ACCEPTANCE_SUCCESSFUL_RUNS_LT_3' }

          $record = [ordered]@{
            schema = 'AKATH_AUTONOMY_24X7_ACCEPTANCE_V1'
            acceptance = 'PASS'
            verified_at_utc = [DateTime]::UtcNow.ToString('o')
            workflow = 'AKATH 24x7 Acceptance Gate'
            schedule = '*/5 * * * *'
            chat_intervention_between_cycles = $false
            cycle_count = 3
            cycles = @(
              [ordered]@{ sequence = 1; github_run_id = [string]$successful[2].id; github_run_number = $successful[2].run_number; conclusion = $successful[2].conclusion; event = $successful[2].event },
              [ordered]@{ sequence = 2; github_run_id = [string]$successful[1].id; github_run_number = $successful[1].run_number; conclusion = $successful[1].conclusion; event = $successful[1].event },
              [ordered]@{ sequence = 3; github_run_id = [string]$successful[0].id; github_run_number = $successful[0].run_number; conclusion = $successful[0].conclusion; event = $successful[0].event }
            )
          }

          $proofPath = Join-Path $proofDir 'three-cycle-proof.json'
          $record | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 -Path $proofPath

          git config user.name 'AKATH Autonomous Acceptance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AKATH/VERIFICATION/three-cycle-proof.json
          git commit -m 'chore: persist AKATH 24x7 acceptance proof'
          git push origin HEAD:main

      - name: Report acceptance state
        if: always()
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'schedule') {
            Write-Host "AKATH_24X7_ACCEPTANCE_RUN=${{ github.run_id }}"
            Write-Host "AKATH_24X7_ACCEPTANCE_CYCLE_VERIFIED=$env:AKATH_CYCLE_VERIFIED"
            Write-Host "AKATH_24X7_ACCEPTANCE_READY=$env:AKATH_ACCEPTANCE_READY"
          }
