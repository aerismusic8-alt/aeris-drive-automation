name: AKATH 24x7 Acceptance Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/akath-24x7-acceptance.yml'
      - 'AKATH/runtime/**'
      - 'AKATH/probes/**'
      - 'AKATH/tests/**'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: akath-24x7-acceptance
  cancel-in-progress: false

env:
  AKATH_AUDIT_PASS: "false"
  AKATH_RUNTIME_PASS: "false"
  AKATH_ADAPTER_PASS: "false"

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64, PC2-CODING-EXECUTOR]
    timeout-minutes: 5
    env:
      AKATH_RUNTIME_ID: akath-primary
      AKATH_PROBE_MODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare portable Python runtime
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonDir = Join-Path $env:RUNNER_TEMP 'akath-python-3.12'
          $pythonZip = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
          if (Test-Path -LiteralPath $pythonDir) { Remove-Item -LiteralPath $pythonDir -Recurse -Force }
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $pythonZip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonDir -Force
          $pythonExe = Join-Path $pythonDir 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe)) { throw 'AKATH_PORTABLE_PYTHON_MISSING' }
          $pythonExe | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $pythonExe --version

      - name: Clean stale CI rebase state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          git rebase --abort 2>$null
          if (Test-Path -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-merge") { Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-merge" -Recurse -Force }
          if (Test-Path -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-apply") { Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-apply" -Recurse -Force }
          python --version

      - name: Audit legacy identity removal
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/AKATH/probes/akath_legacy_identity_audit.ps1" -Root $env:GITHUB_WORKSPACE
          if (-not $?) { throw 'AKATH_LEGACY_IDENTITY_AUDIT_FAILED' }
          "AKATH_AUDIT_PASS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run and verify one autonomous AKATH cycle
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $stateDir = Join-Path $env:RUNNER_TEMP ("akath-24x7-acceptance\${{ github.run_id }}")
          & "$env:GITHUB_WORKSPACE/AKATH/runtime/akath_worker.ps1" -ProbeMode -StateDir $stateDir
          if (-not $?) { throw 'AKATH_WORKER_FAILED' }
          $statePath = Join-Path $stateDir 'runtime-state.json'
          if (-not (Test-Path -LiteralPath $statePath)) { throw 'AKATH_STATE_MISSING' }
          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          if ($state.state -ne 'VERIFIED') { throw "AKATH_STATE_NOT_VERIFIED:$($state.state)" }
          if ($state.verification_status -ne 'VERIFIED') { throw 'AKATH_VERIFICATION_MISSING' }
          if ([string]::IsNullOrWhiteSpace($state.evidence_ref)) { throw 'AKATH_EVIDENCE_REF_MISSING' }
          $evidence = Get-Content -Raw -LiteralPath $state.evidence_ref | ConvertFrom-Json
          if ($evidence.verification_status -ne 'VERIFIED') { throw 'AKATH_EVIDENCE_NOT_VERIFIED' }
          if ($evidence.rehydration.rehydration_status -ne 'VERIFIED') { throw 'AKATH_REHYDRATION_NOT_VERIFIED' }
          if ($evidence.rehydration.identity -ne 'A') { throw 'AKATH_IDENTITY_NOT_A' }
          if ($evidence.rehydration.execution_authorized -ne $false) { throw 'AKATH_REHYDRATION_AUTHORITY_BYPASS' }
          if ($evidence.next_job_ready -ne $true) { throw 'AKATH_NEXT_JOB_NOT_READY' }
          "AKATH_RUN_ID=$($state.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_JOB_ID=$($state.job_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_EVIDENCE=$($state.evidence_ref)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AKATH_RUNTIME_PASS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run adapter acceptance test
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python "$env:GITHUB_WORKSPACE/AKATH/tests/rehydration_adapter_tests.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AKATH_ADAPTER_PASS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Record and evaluate autonomous runtime cycle
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $proofDir = Join-Path $env:GITHUB_WORKSPACE 'AKATH/VERIFICATION'
          New-Item -ItemType Directory -Force -Path $proofDir | Out-Null
          $ledgerPath = Join-Path $proofDir 'runtime-cycle-ledger.json'
          if (Test-Path -LiteralPath $ledgerPath) { $ledger = Get-Content -Raw -LiteralPath $ledgerPath | ConvertFrom-Json } else { $ledger = [pscustomobject]@{ schema='AKATH_RUNTIME_CYCLE_LEDGER_V1'; acceptance='PENDING'; consecutive_successes=0; cycles=@() } }
          $cycles = @($ledger.cycles)
          $pass = ($env:AKATH_AUDIT_PASS -eq 'true' -and $env:AKATH_RUNTIME_PASS -eq 'true' -and $env:AKATH_ADAPTER_PASS -eq 'true')
          $result = if ($pass) { 'PASS' } else { 'FAIL' }
          $errorClass = if ($pass) { '' } elseif ($env:AKATH_AUDIT_PASS -ne 'true') { 'LEGACY_IDENTITY_AUDIT_FAILED' } elseif ($env:AKATH_RUNTIME_PASS -ne 'true') { 'AKATH_RUNTIME_FAILED' } elseif ($env:AKATH_ADAPTER_PASS -ne 'true') { 'AKATH_ADAPTER_TEST_FAILED' } else { 'AKATH_ACCEPTANCE_FAILED' }
          $record = [ordered]@{ sequence=$cycles.Count+1; github_run_id=[string]'${{ github.run_id }}'; github_run_number=[int64]'${{ github.run_number }}'; event='${{ github.event_name }}'; recorded_at_utc=[DateTime]::UtcNow.ToString('o'); result=$result; error_class=$errorClass; audit_pass=($env:AKATH_AUDIT_PASS -eq 'true'); runtime_pass=($env:AKATH_RUNTIME_PASS -eq 'true'); adapter_pass=($env:AKATH_ADAPTER_PASS -eq 'true'); runtime_run_id=if($env:AKATH_RUN_ID){$env:AKATH_RUN_ID}else{''}; runtime_job_id=if($env:AKATH_JOB_ID){$env:AKATH_JOB_ID}else{''}; evidence_ref=if($env:AKATH_EVIDENCE){$env:AKATH_EVIDENCE}else{''} }
          $cycles += [pscustomobject]$record
          $cycles = @($cycles | Select-Object -Last 20)
          $streak=0; for($i=$cycles.Count-1;$i-ge 0;$i--){if($cycles[$i].result -ne 'PASS'){break};$streak++}
          [ordered]@{schema='AKATH_RUNTIME_CYCLE_LEDGER_V1';acceptance=if($streak -ge 3){'PASS'}else{'PENDING'};consecutive_successes=$streak;required_consecutive_successes=3;last_updated_utc=[DateTime]::UtcNow.ToString('o');cycles=$cycles} | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 -Path $ledgerPath
          "AKATH_24X7_STREAK=$streak/3" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          git config user.name 'AKATH Autonomous Acceptance'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AKATH/VERIFICATION/runtime-cycle-ledger.json
          git commit -m 'chore: record AKATH autonomous runtime acceptance cycle' -m "Result: $result; consecutive_successes: $streak/3; event: ${{ github.event_name }}"
          $pushed=$false
          for($attempt=1;$attempt-le 3;$attempt++){
            git rebase --abort 2>$null
            if(Test-Path -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-merge"){Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-merge" -Recurse -Force}
            if(Test-Path -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-apply"){Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE/.git/rebase-apply" -Recurse -Force}
            git fetch origin main
            git rebase origin/main
            if($LASTEXITCODE -ne 0){git rebase --abort 2>$null; if($attempt -eq 3){throw "AKATH_LEDGER_REBASE_FAILED:$attempt"}; Start-Sleep -Seconds ([int](5*$attempt)); continue}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){$pushed=$true;break}
            Start-Sleep -Seconds ([int](5*$attempt))
          }
          if(-not $pushed){throw 'AKATH_LEDGER_PUSH_FAILED'}

      - name: Report acceptance state
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "AKATH_24X7_ACCEPTANCE_RUN=${{ github.run_id }}"
          Write-Host "AKATH_24X7_ACCEPTANCE_EVENT=${{ github.event_name }}"
          Write-Host "AKATH_AUDIT_PASS=$env:AKATH_AUDIT_PASS"
          Write-Host "AKATH_RUNTIME_PASS=$env:AKATH_RUNTIME_PASS"
          Write-Host "AKATH_ADAPTER_PASS=$env:AKATH_ADAPTER_PASS"

# CI self-healing: portable Python avoids runner execution-policy wrapper failure; ledger push cleans stale rebase state before retry.
# trigger: acceptance rerun after quote-safe dispatch contract test.
