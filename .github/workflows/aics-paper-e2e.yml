name: AICS Paper E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AX_AICS_*.ps1'
      - '.github/workflows/aics-paper-e2e.yml'
  schedule:
    # Fast feedback during development/testing. GitHub Actions minimum schedule granularity is 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: aics-paper-e2e
  cancel-in-progress: true

jobs:
  paper-e2e:
    runs-on: self-hosted
    steps:
      - name: Run AICS Paper E2E
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          & "$env:GITHUB_WORKSPACE\AX_AICS_PAPER_E2E.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
