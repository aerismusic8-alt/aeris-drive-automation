name: AX Canonical Bootstrap
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify local canonical bootstrap
        shell: powershell
        run: |
          & "$PWD\AX_CANONICAL_BOOTSTRAP.ps1"
      - name: Persist bootstrap manifest
        shell: powershell
        run: |
          git config user.name 'AX Canonical Bootstrap'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_CANONICAL_BOOTSTRAP.ps1
          if(git diff --cached --quiet){Write-Host 'Bootstrap script already persisted'}else{git commit -m 'chore: persist AX canonical bootstrap';git push}
