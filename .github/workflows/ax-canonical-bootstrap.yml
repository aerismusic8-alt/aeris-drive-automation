name: AX Canonical Bootstrap
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: ax-canonical-bootstrap-main
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Build and verify local canonical bootstrap
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          & "$PWD\AX_CANONICAL_BOOTSTRAP.ps1"
      - name: Persist bootstrap manifest
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'AX Canonical Bootstrap'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AX_CANONICAL_BOOTSTRAP.ps1
          if(git diff --cached --quiet){Write-Host 'Bootstrap script already persisted'; exit 0}

          git stash push -u -m 'ax-canonical-bootstrap-generated-state'
          git fetch origin main
          git rebase origin/main
          git stash pop
          git add AX_CANONICAL_BOOTSTRAP.ps1
          if(git diff --cached --quiet){Write-Host 'No bootstrap mutation after rebase'; exit 0}
          git commit -m 'chore: persist AX canonical bootstrap'

          for($attempt=1;$attempt -le 3;$attempt++){
            git fetch origin main
            $behind = git rev-list --count HEAD..origin/main
            if([int]$behind -gt 0){ git rebase origin/main }
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){ Write-Host "AX_CANONICAL_BOOTSTRAP_PUSH=PASS attempt=$attempt"; exit 0 }
            if($attempt -eq 3){ throw 'AX_CANONICAL_BOOTSTRAP_PUSH_FAILED_AFTER_RETRIES' }
            Start-Sleep -Seconds 2
          }
