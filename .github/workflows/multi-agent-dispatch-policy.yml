name: Multi-Agent Dispatch Policy Tests

on:
  push:
    paths:
      - 'docs/MULTI_AGENT_DISPATCH_ACTIVATION.md'
      - 'tests/MULTI_AGENT_DISPATCH_POLICY.Tests.ps1'
  pull_request:
    paths:
      - 'docs/MULTI_AGENT_DISPATCH_ACTIVATION.md'
      - 'tests/MULTI_AGENT_DISPATCH_POLICY.Tests.ps1'
  workflow_dispatch:

jobs:
  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate multi-agent safety policy
        shell: pwsh
        run: ./tests/MULTI_AGENT_DISPATCH_POLICY.Tests.ps1
