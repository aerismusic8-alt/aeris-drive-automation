name: AX OpenAI Code Stream Tests

on:
  push:
    paths:
      - 'AKATH/runtime/ax_openai_code_writer.py'
      - 'AKATH/tests/openai_code_stream_test.py'
      - '.github/workflows/ax-openai-code-stream-tests.yml'
  pull_request:
    paths:
      - 'AKATH/runtime/ax_openai_code_writer.py'
      - 'AKATH/tests/openai_code_stream_test.py'
      - '.github/workflows/ax-openai-code-stream-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Contract test
        run: python -m pytest -q AKATH/tests/openai_code_stream_test.py
